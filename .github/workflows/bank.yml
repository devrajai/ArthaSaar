name: Bank Scanner
on:
  workflow_dispatch:
  schedule:
    - cron: '20 12 * * 1-5'  # 5:50 PM IST daily (circuits ke baad)
permissions:
  contents: write
jobs:
  bankscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/bankscan.py
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add data/banks.json || true
          git commit -m "data: bank scanner prices" || echo "no change"
          git pull --rebase || true
          git push

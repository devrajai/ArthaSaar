name: Daily Brain Collect

on:
  schedule:
    # 18:05 IST Mon-Fri (after market close, data settled)
    - cron: '5 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brain-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Collect Nifty 500 data and compute screener
        run: python scripts/brain_collect.py

      - name: Update budget day study
        run: python scripts/budget_study.py

      - name: Commit brain data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'chore: daily market brain data'
            git push
          fi

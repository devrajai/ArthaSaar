name: Daily Brain Collect
on:
  schedule:
    # Run 1: 18:35 IST Mon-Sat (after market close, data settled)
    - cron: '5 13 * * 1-6'
    # Run 2: 21:05 IST Mon-Sat (second pass — self-heals anything run 1 missed,
    # and advances the staggered fundamentals refresh)
    - cron: '35 15 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brain-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install yfinance

      - name: Collect full-market prices + technicals (~2,300 stocks)
        run: python scripts/brain_collect.py

      - name: Collect all India indices (139 NSE + Sensex)
        run: python scripts/indices_collect.py

      - name: Collect pre-open + FII/DII flows + index changes
        run: python scripts/phase2_collect.py

      - name: Collect corporate filings (results/AGM/presentations)
        run: python scripts/filings_collect.py

      - name: Update budget day study
        run: python scripts/budget_study.py

      - name: Collect fundamentals (staggered, ~300/run)
        run: python scripts/fundamentals_collect.py

      - name: Commit brain data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'chore: daily market brain data'
            # Retry loop: if another workflow pushed meanwhile, rebase on top and push again
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then
                echo 'Pushed successfully'; exit 0
              fi
              echo "Push failed (attempt $i) — rebasing and retrying in 15s"
              sleep 15
            done
            echo 'ERROR: could not push after 5 attempts'; exit 1
          fi

name: bumpver
on:
  workflow_dispatch
concurrency:
  group: bumpver
  cancel-in-progress: false
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sed -i 's/app.js?v=21sep26h/app.js?v=21sep26i/' index.html
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add index.html
          git commit -m "bump loader version to 21sep26i"
          git push

name: Circuit Scanner
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1-5'  # 5:30 PM IST daily weekdays
permissions:
  contents: write
jobs:
  circuits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/circuits.py
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add data/circuits.json || true
          git commit -m "data: circuit scanner" || echo "no change"
          git pull --rebase || true
          git push

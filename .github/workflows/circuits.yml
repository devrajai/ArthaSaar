name: Circuit limits (price bands)

on:
  schedule:
    # 18:45 IST (13:15 UTC) Mon-Fri - after NSE bhavcopy is published
    - cron: '15 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: circuits
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect circuit limits
        run: python3 scripts/fetch_circuits.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/circuits.json
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'data: circuit limits'
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -X theirs origin main && git push; then
                echo 'Pushed successfully'; exit 0
              fi
              git rebase --abort || true
              sleep 15
            done
            echo 'ERROR: push failed'; exit 1
          fi

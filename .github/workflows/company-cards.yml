name: Company Cards Collect
on:
  schedule:
    # Sundays 9:00 IST — after screener-fundamentals (7:05) finishes
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: company-cards
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install deps
        run: pip install requests yfinance
      - name: Collect company cards (screener.in + yfinance)
        run: python scripts/company_cards_collect.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/companies data/company-index.json
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'chore: company cards weekly (screener.in + yfinance)'
            for i in 1 2 3 4 5 6 7 8; do
              if git pull --rebase --autostash -X theirs origin main && git push; then
                echo 'Pushed successfully'; exit 0
              fi
              git rebase --abort || true
              git pull --rebase --autostash -X theirs origin main && git push && exit 0
              sleep 20
            done
            echo 'ERROR: push failed'; exit 1
          fi

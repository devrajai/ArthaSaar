name: Constituents Collect
on:
  schedule:
    # Sunday 7:25 AM IST — weekly, sector memberships rarely change
    - cron: '55 1 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: constituents-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Collect NSE constituents
        run: python scripts/constituents_collect.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/constituents.json
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'chore: constituents data (NSE lists)'
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -X theirs origin main && git push; then
                echo 'Pushed successfully'; exit 0
              fi
              git rebase --abort || true
              sleep 15
            done
            echo 'ERROR: push failed'; exit 1
          fi

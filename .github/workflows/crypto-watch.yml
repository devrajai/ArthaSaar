name: Crypto Watch
on:
  schedule:
    # every 6 hours: 5:35 AM, 11:35 AM, 5:35 PM, 11:35 PM IST
    - cron: '5 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-watch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Collect crypto market data (top 100 + global + fear&greed)
        run: python scripts/crypto_collect.py

      - name: Commit crypto data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'chore: crypto watch data'
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then
                echo 'Pushed successfully'; exit 0
              fi
              echo "Push failed (attempt $i) — rebasing and retrying in 15s"
              sleep 15
            done
            echo 'ERROR: could not push after 5 attempts'; exit 1
          fi

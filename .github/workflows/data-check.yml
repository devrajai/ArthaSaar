name: Data checks (keep last good)

on:
  schedule:
    # 20:30 IST (15:00 UTC) - after every daily collector has run
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check every file the app loads
        run: python3 scripts/check_data.py --revert
      - name: Commit health + any reverts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data_health.json docs/
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'data: health check (bad files reverted to last good)'
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -X theirs origin main && git push; then
                echo 'Pushed successfully'; exit 0
              fi
              git rebase --abort || true
              sleep 15
            done
            echo 'ERROR: push failed'; exit 1
          fi

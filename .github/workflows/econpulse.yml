name: Economy Pulse
on:
  workflow_dispatch:
  schedule:
    - cron: '10 2 * * *'  # 7:40 AM IST daily
permissions:
  contents: write
jobs:
  econpulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/economy_pulse.py
      - run: sed -i 's/v=21sep26a33/v=21sep26a34/' index.html || true
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add data/economy-pulse.json index.html || true
          git commit -m "data: economy pulse + v=a34" || echo "no change"
          git pull --rebase || true
          git push

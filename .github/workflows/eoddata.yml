name: EOD Data (Delivery + Corp Actions)
on:
  workflow_dispatch:
  schedule:
    - cron: '40 13 * * 1-5'  # 7:10 PM IST, after NSE evening files
permissions:
  contents: write
jobs:
  eod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/delivery_collect.py || true
      - run: python3 scripts/dividends_collect.py || true
      - run: sed -i 's/app.js?v=27sepv1/app.js?v=27sepv2/' index.html || true
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add data/delivery.json data/dividends.json index.html || true
          git commit -m "data: EOD delivery% + corp actions (NSE+BSE)" || echo "no change"
          git pull --rebase || true
          git push
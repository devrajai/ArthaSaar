name: Feature data (rotation, rollover, delivery, corp actions)

on:
  schedule:
    # 19:00 IST (13:30 UTC) Mon-Fri - after bhavcopy + delivery files are published
    - cron: '30 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feature-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yfinance
        run: pip install -q yfinance
      - name: Build feature data
        run: python3 scripts/build_features.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/sector_rotation.json docs/rebalance.json docs/rollover.json docs/corp_actions.json docs/delivery.json
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'data: rotation, rollover, delivery, corp actions'
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -X theirs origin main && git push; then
                echo 'Pushed successfully'; exit 0
              fi
              git rebase --abort || true
              sleep 15
            done
            echo 'ERROR: push failed'; exit 1
          fi

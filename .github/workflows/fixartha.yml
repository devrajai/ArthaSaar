name: Rebrand ArthaSaar
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/rename_artha.py
      - run: |
          git config user.name devrajai
          git config user.email devraj.resume@gmail.com
          git add -A
          git commit -m 'rebrand: Market Brain -> ArthaSaar' || echo 'no change'
          git pull --rebase --autostash || true
          git push

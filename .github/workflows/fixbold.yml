name: Bold UI + Alarm Top
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fix_bold.py
      - run: |
          git config user.name devrajai
          git config user.email devraj.resume@gmail.com
          git add -A
          git commit -m 'ui: IPO-style bold theme + correction alarm top' || echo 'no change'
          git pull --rebase --autostash || true
          git push

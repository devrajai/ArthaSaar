name: Brand Clean 3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fix_brand3.py
      - run: |
          git config user.name devrajai
          git config user.email devraj.resume@gmail.com
          git add -A
          git commit -m 'privacy: remove all remaining Dev name traces (UI, data, comments, TG alert)' || echo 'no change'
          git pull --rebase --autostash || true
          git push

name: Brand Clean 4
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fix_brand4.py
      - run: |
          git config user.name devrajai
          git config user.email devraj.resume@gmail.com
          git add -A
          git commit -m 'privacy: final Dev trace sweep (test alert + ipo brain doc)' || echo 'no change'
          git pull --rebase --autostash || true
          git push

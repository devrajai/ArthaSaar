name: Fix FII Buy/Sell
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fix_fiisell.py
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add scripts/telegram_brain.py scripts/send_macro.py
          git commit -m "FII/DII: Buy/Sell words ke saath + MACRO PULSE se duplicate FII hatayi (Dev ka feedback)" || echo "no change"
          git pull --rebase || true
          git push

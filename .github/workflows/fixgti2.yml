name: Fix GTI Section
on:
  workflow_dispatch
concurrency:
  group: fixgti2
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_gti2.py
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add index.html
          git commit -m "gti: home tile + dedicated section"
          git push

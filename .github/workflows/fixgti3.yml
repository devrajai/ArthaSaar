name: Fix GTI3 Guide
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/fix_gti3.py
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add gtiinfo.js app.js index.html
          git commit -m "feat: GTI Complete Guide card (Learn + GTI section)"
          git pull --rebase || true
          git push

name: Guide Password Lines Remove
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/fix_guide2.py
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add mbguide.js index.html
          git commit -m "fix: remove password detail lines from learn guide" || echo "no change"
          git pull --rebase || true
          git push

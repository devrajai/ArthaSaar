name: Fix Home
on:
  workflow_dispatch
concurrency:
  group: fixhome
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_home.py
      - run: node --check homefix.js && node --check learnadd.js && node --check app.js
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add index.html style.css app.js homefix.js learnadd.js
          git commit -m "feat: home topics horizontal line + scroll-hide, Learn what's-new card, charts option removed"
          git push

name: Fix Learn
on:
  workflow_dispatch
concurrency:
  group: fixlearn
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_learn.py
      - run: node --check learnadd.js
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add style.css learnadd.js index.html
          git commit -m "learn: topics 2-row wrap + what's-new/naye-tools collapsible tap-open cards"
          git push

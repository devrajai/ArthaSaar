name: Fix Learn 3
on:
  workflow_dispatch
concurrency:
  group: fixlearn3
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_learn3.py
      - run: node --check learnadd.js
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add learnadd.js index.html
          git commit -m "learn: remove sab-topics card, add about-market-brain collapsible card"
          git push

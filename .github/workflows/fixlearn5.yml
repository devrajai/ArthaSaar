name: Fix Learn 5
on:
  workflow_dispatch
concurrency:
  group: fixlearn5
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: echo  | base64 -d > scripts/fix_learn5.py
      - run: python3 scripts/fix_learn5.py
      - run: node --check oldapp.js && node --check learnadd.js
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add oldapp.js learnadd.js index.html
          git commit -m "learn: learning hub intro + SEBI text moved inside Naye Tools card"
          git push

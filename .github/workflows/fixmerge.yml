name: Merge IPO site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/merge_ipo.py
      - run: |
          git config user.name devrajai
          git config user.email devraj.resume@gmail.com
          git add ipo index.html
          git commit -m 'merge: IPO terminal site into ipo/ + tile in-site' || echo 'no change'
          git pull --rebase --autostash || true
          git push

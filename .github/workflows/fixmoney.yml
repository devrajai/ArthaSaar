name: Money + History + PWA
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 scripts/fix_pwa.py
      - run: python3 scripts/fix_money.py
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add manifest.json sw.js icon-192.png icon-512.png app.js index.html
          git commit -m "feat: PWA install + tax calc + muhurat/budget/astro cards" || echo "no change"
          git pull --rebase || true
          git push

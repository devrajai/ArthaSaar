name: Remove Toolkit Card
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/fix_notoolkit.py
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add tools5.js index.html
          git commit -m "fix: remove free toolkit external links card" || echo "no change"
          git pull --rebase || true
          git push

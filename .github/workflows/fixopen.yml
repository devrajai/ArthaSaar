name: IPO Link + Collapsible Learn Cards
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/fix_open2.py
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add index.html financelearn.js fdinvest.js
          git commit -m "feat: ipo tile links to ipo-terminal site; learn cards collapsible + levels" || echo "no change"
          git pull --rebase || true
          git push

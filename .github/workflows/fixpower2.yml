name: Power Pack 2 Wiring
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/fix_power2.py
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add app.js index.html
          git commit -m "feat: movement analysis + fii/dii + portfolio + charts + mf verdict + finance basics" || echo "no change"
          git pull --rebase || true
          git push

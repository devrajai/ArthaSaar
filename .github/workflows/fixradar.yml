name: Fix Radar Emoji
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fix_radar.py
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add globals.js
          git commit -m "globals.js: radar emoji escape fix" || echo "no change"
          git pull --rebase || true
          git push

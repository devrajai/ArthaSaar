name: Radar Launch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fix_radar.py
      - run: |
          git config user.name devrajai
          git config user.email devraj.resume@gmail.com
          git add -A
          git commit -m 'ui: 8 radar cards live (indices/fundamental/mf/deepfund/filings/futures/gti/sector)' || echo 'no change'
          git pull --rebase --autostash || true
          git push

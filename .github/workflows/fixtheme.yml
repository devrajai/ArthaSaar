name: Calm Theme Launch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fix_theme.py
      - run: |
          git config user.name devrajai
          git config user.email devraj.resume@gmail.com
          git add -A
          git commit -m 'ui: calm terminal v3 live (logo, palette, ticker, status bar)' || echo 'no change'
          git pull --rebase --autostash || true
          git push

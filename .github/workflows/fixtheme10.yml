name: Fix Theme 10 EventTop
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_theme10.py
      - name: Commit and push
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add calm.css index.html
          git commit -m "ui: v9 event tile on top, only Event word, no small words (a50)" || echo "no changes"
          git push

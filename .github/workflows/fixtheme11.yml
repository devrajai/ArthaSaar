name: Fix Theme 11 MarketClose
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_theme11.py
      - name: Commit and push
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add calm.css oldapp.js dtfix.js index.html
          git commit -m "ui: v10 market-close pill + no brand underline (as11)" || echo "no changes"
          git push

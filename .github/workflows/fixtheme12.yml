name: Fix Theme 12 EventTrading Decision
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_theme12.py
      - name: Commit and push
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add calm.css themefix.js index.html ipo/index.html ipo/scripts/merge-tools.js
          git commit -m "ui: v11 one-line header + event tile in trading + ipo decision fix (as12)" || echo "no changes"
          git push

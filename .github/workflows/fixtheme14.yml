name: Fix Theme 14 TG+Site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_tg.py
      - run: python .github/scripts/fix_theme14.py
      - name: Workflow yml changes revert (GITHUB_TOKEN se workflow files push nahi hote)
        run: |
          git checkout -- .github/workflows || true
          git clean -fd .github/workflows || true
      - name: Commit and push (retry ke saath)
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add -A scripts index.html app.js oldapp.js themefix.js economypulse.js newsvolume.js news.js
          git commit -m "feat: TG scripts v2 + site v13 (retry, auto-refresh, clean tiles)" || echo "no changes"
          for i in 1 2 3 4 5 6 7 8; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Pushed (attempt $i)"
              exit 0
            fi
            echo "Push failed (attempt $i) - retry in 20s"
            sleep 20
          done
          echo "ERROR: push failed after 8 attempts"
          exit 1

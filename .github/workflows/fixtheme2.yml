name: Fix Theme Direct
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_theme2.py
      - name: Commit and push
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add index.html themefix.js
          git commit -m "ui: direct-load calm theme (chain-independent, a43)" || echo "no changes"
          git push

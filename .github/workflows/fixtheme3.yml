name: Fix Theme 3 Full Clothes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_theme3.py
      - name: Commit and push
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add calm.css index.html
          git commit -m "ui: calm v2 full-clothes reskin (panels, tiles, buttons, tables)" || echo "no changes"
          git push

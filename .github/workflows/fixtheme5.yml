name: Fix Theme 5 Premium
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_theme5.py
      - name: Commit and push
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add calm.css themefix.js index.html
          git commit -m "ui: v4 Premium — status bar removed, hero NIFTY panel, gradient chips (a45)" || echo "no changes"
          git push

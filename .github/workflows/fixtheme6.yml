name: Fix Theme 6 RefHeader
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_theme6.py
      - name: Commit and push
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add calm.css themefix.js ipo/index.html scripts/global_collect.py index.html
          git commit -m "ui: v5 reference header + SENSEX source + IPO sheet-status fix (a46)" || echo "no changes"
          git push

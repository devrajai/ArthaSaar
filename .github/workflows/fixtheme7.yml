name: Fix Theme 7 Compact
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_theme7.py
      - name: Commit and push
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add calm.css index.html
          git commit -m "ui: v6 compact header — no clock/refresh, smaller fonts, brand underline (a47)" || echo "no changes"
          git push

name: Fix Theme 8 Radars
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_theme8.py
      - name: Commit and push
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add calm.css index.html
          git commit -m "ui: v7 forecast radar + event radar tile/section (a48)" || echo "no changes"
          git push

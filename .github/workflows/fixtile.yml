name: fixtile
on:
  workflow_dispatch
concurrency:
  group: fixtile
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_tile.py
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add index.html
          git commit -m "fix: static MF tile in index.html + bump loader v=j"
          git push

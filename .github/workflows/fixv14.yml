name: Fix v14 site (one-shot)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply v14 patch
        run: |
          set -e
          printf '%s' '' | base64 -d | gunzip > v14.diff
          git apply --check -p2 v14.diff
          git apply -p2 v14.diff
          rm v14.diff
          node --check oldapp.js
          node --check themefix.js
          node --check app.js
          node --check radars.js
          grep -q 'as-chev' themefix.js
          grep -q '25sep26b63' index.html
          grep -q '?v=as14' app.js
      - name: Commit and push (retry)
        run: |
          set -e
          git config user.name 'devrajai'
          git config user.email 'devraj.resume@gmail.com'
          git add -A
          git commit -m 'feat: site v14 - infinite-loop fix + instant cache + full auto-refresh + event radar chevron/info + mobile dashboard + no loading text'
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase --autostash || true
            if git push; then ok=1; break; fi
            sleep 20
          done
          [ "$ok" = "1" ] || { echo 'PUSH FAILED'; exit 1; }

name: F&O Radar
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1-5'  # 6:30 PM IST daily weekdays
permissions:
  contents: write
jobs:
  forda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/forda.py
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add data/forda.json || true
          git commit -m "data: F&O radar" || echo "no change"
          git pull --rebase || true
          git push

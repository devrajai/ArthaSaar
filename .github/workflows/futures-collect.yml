name: Futures Collect
on:
  schedule:
    # 18:50 IST Mon-Fri, after market close + evening data run
    - cron: '50 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: futures-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Collect F&O futures from NSE bhavcopy
        run: python scripts/futures_collect.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'chore: futures data (EOD bhavcopy)'
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then
                echo 'Pushed successfully'; exit 0
              fi
              sleep 15
            done
            echo 'ERROR: push failed'; exit 1
          fi

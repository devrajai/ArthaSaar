name: GTI Zones
on:
  workflow_dispatch:
  schedule:
    - cron: '25 13 * * 1-5'
permissions:
  contents: write
jobs:
  gti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yfinance
      - run: python3 scripts/gti.py  # TG alert removed — night-unified.yml me merge ho gaya
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add data/gti.json data/members.json || true
          git commit -m "data: gti zones" || echo "no change"
          git pull --rebase || true
          git push

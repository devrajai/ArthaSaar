name: Monthly Stock Ideas
on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 1 * *"
concurrency:
  group: ideas
  cancel-in-progress: false
jobs:
  ideas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/stock_scores.py
      - run: python3 scripts/stock_ideas.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

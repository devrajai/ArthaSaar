name: input-bluefix
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: kill blue focus borders at source + bump version
        run: |
          python3 - << 'EOF'
          s = open("index.html", encoding="utf-8").read()
          old1 = "#gInp:focus{border-color:#5aa7ff}"
          new1 = "#gInp:focus{border-color:rgba(255,255,255,.28)}"
          assert s.count(old1) == 1, "gate input rule not found exactly once"
          s = s.replace(old1, new1)
          old3 = "app.js?v=21sep26c"
          new3 = "app.js?v=21sep26d"
          assert s.count(old3) == 1, "version tag not found exactly once"
          s = s.replace(old3, new3)
          open("index.html", "w", encoding="utf-8").write(s)
          c = open("style.css", encoding="utf-8").read()
          old2 = ".controls input:focus,.controls select:focus{border-color:var(--blue)}"
          new2 = ".controls input:focus,.controls select:focus{border-color:var(--border2)}"
          assert c.count(old2) == 1, "controls focus rule not found exactly once"
          c = c.replace(old2, new2)
          open("style.css", "w", encoding="utf-8").write(c)
          print("3 source edits applied")
          EOF
      - name: commit and push
        run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add index.html style.css
          git commit -m "fix: kill blue focus borders at source (gate input + search inputs), version bump d" || echo "nothing to commit"
          for i in 1 2 3; do git push && break; git pull --rebase -X theirs || true; done

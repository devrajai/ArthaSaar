name: Intraday archive (daily, after close)

# THE ONE JOB THAT CANNOT BE BACKFILLED.
# Yahoo keeps 1-minute bars for about 7 days and 5-minute for about 60. After that they are
# gone - not paywalled, gone. Every weekday this does not run is intraday history that can
# never be recovered from any free source.
#
# Runs at 10:30 UTC = 4:00 PM IST, half an hour after NSE closes at 3:30 PM, so the session's
# bars are final.
#
# Deliberately separate from the nightly pipeline:
#   - it must not delay or block the main data run
#   - it is allowed to fail, because Yahoo is an unofficial endpoint
#   - it is time-critical in a way the nightly job is not

on:
  schedule:
    - cron: '30 10 * * 1-5'      # Mon-Fri, 4 PM IST
  workflow_dispatch:
    inputs:
      top:
        description: 'How many stocks besides the two indices'
        required: false
        default: '100'

permissions:
  contents: write

concurrency:
  group: intraday
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow

      - name: Capture the session
        run: python scripts/fetch_intraday.py --top "${{ github.event.inputs.top || '100' }}"

      - name: Show what we got
        run: |
          python - <<'EOF'
          import glob, os
          import pandas as pd
          files = sorted(glob.glob("data/intraday/*/*.parquet"))
          if not files:
              print("::warning title=No intraday file::nothing was written for this session")
              raise SystemExit(0)
          latest = files[-1]
          d = pd.read_parquet(latest)
          print(f"{latest}: {len(d):,} bars, {d['symbol'].nunique()} symbols")
          print(f"{d['datetime'].min()} -> {d['datetime'].max()}")
          per = d.groupby("symbol").size()
          print(f"bars per symbol: min {per.min()}, median {int(per.median())}, max {per.max()}")
          total = sum(os.path.getsize(f) for f in files)
          print(f"\n{len(files)} sessions on disk, {total/1e6:.1f} MB total")
          EOF

      # 20 minutes of capture should never depend on winning a push race. Keep a copy as a
      # release asset first, exactly as mf-nav now does.
      - name: Keep a copy as a release asset
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(data/intraday/*/*.parquet)
          if [ ${#files[@]} -eq 0 ]; then echo "nothing to keep"; exit 0; fi
          gh release view intraday >/dev/null 2>&1 || \
            gh release create intraday --title "Intraday 1-minute bars" \
              --notes "Daily 1-minute bars for Nifty, Bank Nifty and the most liquid stocks. Cannot be backfilled - Yahoo drops them after 7 days." || true
          gh release upload intraday "${files[@]}" --clobber || \
            echo "::warning title=Release upload failed::the file is still on the runner only"

      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/intraday/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "data: intraday bars $(date -u +%F)"
          for i in 1 2 3 4 5 6 7 8; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash || true
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            echo "push attempt $i failed; waiting $((i*15))s"
            sleep $((i*15))
          done
          echo "::warning title=Push failed::the release asset above still holds today's bars"

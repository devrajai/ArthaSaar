name: learnchip-fix
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: learnchip blue border + version bump
        run: |
          python3 - << 'EOF'
          s = open("index.html", encoding="utf-8").read()
          old1 = ".learnchip{border-color:#5aa7ff}"
          new1 = ".learnchip{border-color:var(--border2)}"
          assert s.count(old1) == 1, "learnchip rule not found exactly once"
          s = s.replace(old1, new1)
          old2 = "app.js?v=21sep26d"
          new2 = "app.js?v=21sep26e"
          assert s.count(old2) == 1, "version tag not found exactly once"
          s = s.replace(old2, new2)
          open("index.html", "w", encoding="utf-8").write(s)
          print("2 source edits applied")
          EOF
      - name: commit and push
        run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add index.html
          git commit -m "fix: learnchip hardcoded blue border -> soft white, version bump e" || echo "nothing to commit"
          for i in 1 2 3; do git push && break; git pull --rebase -X theirs || true; done

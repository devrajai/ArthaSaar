name: ArthaSaar Score
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1-5'  # 9:00 AM IST weekdays
permissions:
  contents: write
jobs:
  mbscore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/mbscore.py
      - run: sed -i 's/v=21sep26a17/v=21sep26a18/' index.html || true
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add data/mb-score.json index.html || true
          git commit -m "data: arthasaar score + v=a18" || echo "no change"
          git pull --rebase || true
          git push

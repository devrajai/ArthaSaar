name: MF NAV history (one-off backfill)

# WHY A WORKFLOW AND NOT COLAB
# Two Colab attempts failed on the network: the AMFI month-by-month version made ~7,100
# requests and was stopped by hand, and the mfapi.in version produced no output at all -
# its diagnostic cell hung on the first request. Colab appears to block or throttle these
# hosts.
#
# This runner does not. The daily pipeline already pulls AMFI's NAVAll.txt here and reports
# 14,414 schemes, so it is a network where the source is known to work.
#
# It runs on demand, not on a schedule: history only needs backfilling once. After that the
# daily pipeline appends one day at a time from the NAVAll.txt it already fetches.

on:
  workflow_dispatch:
    inputs:
      max_schemes:
        description: 'Limit to N schemes (0 = all 400)'
        required: false
        default: '0'
      source:
        description: 'mfapi, amfi, or auto'
        required: false
        default: 'auto'

permissions:
  contents: write

concurrency:
  group: mf-nav
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests

      # Run a small batch first. If the network blocks us, this fails in a minute rather
      # than after an hour of silent retries.
      - name: Smoke test - one scheme
        run: python scripts/fetch_mf_nav.py --max 3 --source "${{ github.event.inputs.source || 'auto' }}"

      - name: Backfill the rest
        run: |
          python scripts/fetch_mf_nav.py \
            --max "${{ github.event.inputs.max_schemes || '0' }}" \
            --source "${{ github.event.inputs.source || 'auto' }}"

      - name: Show what we got
        run: |
          python - <<'EOF'
          import os, pandas as pd
          p = "data/mf/nav_history.parquet"
          if not os.path.exists(p):
              print("::error title=Nothing produced::nav_history.parquet was not written")
              raise SystemExit(1)
          d = pd.read_parquet(p)
          print(f"{len(d):,} rows | {d['code'].nunique()} schemes | "
                f"{d['date'].min().date()} -> {d['date'].max().date()}")
          print(f"{os.path.getsize(p)/1e6:.1f} MB")
          print()
          print(d.groupby(d["date"].dt.year).size().to_string())
          EOF

      # Even if the git push never succeeds, keep the data somewhere durable. 14.9 MB and
      # 20 minutes of collection should not depend on winning a push race.
      - name: Keep a copy as a release asset
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f data/mf/nav_history.parquet ]; then echo "nothing to keep"; exit 0; fi
          gh release view mf-nav >/dev/null 2>&1 || \
            gh release create mf-nav --title "Mutual fund NAV history" \
              --notes "Full AMFI NAV history, one row per scheme per day." || true
          gh release upload mf-nav data/mf/nav_history.parquet --clobber || \
            echo "::warning title=Release upload failed::the file is still on the runner only"

      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/mf/nav_history.parquet
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: mutual fund NAV history ($(date -u +%FT%TZ))"
            # 20 minutes of collection died here on the first attempt because another
            # workflow pushed while this one was running. Four retries 10s apart was not
            # enough. Now: 8 attempts with growing backoff, and the file is uploaded as a
            # RELEASE ASSET as well - so even if every push fails, the data survives.
            for i in 1 2 3 4 5 6 7 8; do
              git rebase --abort 2>/dev/null || true
              git pull --rebase --autostash || true
              if git push; then echo "pushed on attempt $i"; exit 0; fi
              echo "push attempt $i failed; waiting $((i*15))s"
              sleep $((i*15))
            done
            echo "::warning title=Push failed::committing to git failed; the release asset below still has the data"
          fi

name: News Volume
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'  # 7:00 AM IST daily
permissions:
  contents: write
jobs:
  newsvol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/news_volume.py
      - run: sed -i 's/v=21sep26a15/v=21sep26a16/' index.html || true
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add data/news-volume.json index.html || true
          git commit -m "data: news volume 7d + v=a16" || echo "no change"
          git pull --rebase || true
          git push

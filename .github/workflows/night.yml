name: Night Brief Telegram
on:
  schedule:
    - cron: '30 16 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 xray_tg.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

name: notion-sync-now
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ipo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Write notion data
        run: |
          printf '%s' '' | base64 -d | gunzip > data/notion-data.json
          python -c "import json;d=json.load(open('data/notion-data.json'));print('rows',len(d['ipos']))"
      - name: Merge into site data
        run: python scripts/sync_from_pipeline.py
      - name: Rebuild terminal state + events
        run: python scripts/build_terminal_state.py
      - name: Commit
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet && echo 'No changes' && exit 0
          git commit -m 'data: notion IPO tracker sync'
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase --autostash && git push && break
            echo "retry $i"; sleep 20
          done

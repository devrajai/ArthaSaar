name: OI GTI Combo
on:
  workflow_dispatch:
  schedule:
    - cron: '15 14 * * 1-5'
permissions:
  contents: write
jobs:
  oi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/oi_gti.py
      - run: python3 scripts/fix_oi.py
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add data/oi-gti.json app.js index.html
          git commit -m "feat: OI + GTI combo card" || echo "no change"
          git pull --rebase || true
          git push

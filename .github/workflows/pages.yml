name: GitHub Pages Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_run:
    workflows: ["Research Radar"]
    types: [completed]

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build ArthaSaar (app UI + demos + full EOD data)
        run: |
          rm -rf site
          mkdir -p site/data site/data/history site/app site/demo site/demo2
          cp index.html ping.html site/
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest site/; fi
          # Copy every root JS bundle used by the HTML/runtime loaders.
          # GitHub Pages publishes only the staged `site/` directory, so omitting these
          # files leaves dynamic pages (including Research Radar) blank even though the
          # source repo contains the scripts.
          cp ./*.js site/ 2>/dev/null || true
          if [ -f app/index.html ]; then cp app/index.html site/app/index.html; fi
          if [ -f demo.html ]; then cp demo.html site/demo/index.html; fi
          if [ -f demo2.html ]; then cp demo2.html site/demo2/index.html; fi
          if [ -f saar-v11.css ]; then cp saar-v11.css site/; fi
          if [ -f saar-v11.js ]; then cp saar-v11.js site/; fi
          if [ -f sw.js ]; then cp sw.js site/; fi
          cp data/*.json site/data/ 2>/dev/null || true
          cp data/*.csv site/data/ 2>/dev/null || true
          cp data/history/*.json site/data/history/ 2>/dev/null || true
          printf '%s\n' '{"site":"ArthaSaar v14 app","pipeline":"NSE + yfinance + AMFI + free public sources","built_at":"'$(date -u +%FT%TZ)'"}' > site/data/site-build.json
          echo "site files:"; ls -1 site; echo "data files:"; ls -1 site/data | wc -l

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

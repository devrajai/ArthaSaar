name: GitHub Pages Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build ArthaSaar UI v10 (new site + full EOD data)
        run: |
          rm -rf site
          mkdir -p site/data
          cp index.html ping.html saar-v11.css saar-v11.js site/
          if [ -f sw.js ]; then cp sw.js site/; fi
          cp data/*.json site/data/ 2>/dev/null || true
          printf '%s\n' '{"site":"ArthaSaar v10","pipeline":"NSE + yfinance + AMFI + free public sources","built_at":"'$(date -u +%FT%TZ)'"}' > site/data/site-build.json
          echo "site files:"; ls -1 site; echo "data files:"; ls -1 site/data | wc -l

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

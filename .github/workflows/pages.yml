name: GitHub Pages Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
permissions:
  pages: write
  id-token: write
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build ArthaSaar v6 Mobile OS"data/$f.json" "site/data/$f.json"
          done
          printf '%s\n' '{"site":"ArthaSaar v3","pipeline":"NSE + yfinance + free public sources","built_at":"'"$(date -u +%FT%TZ)"'"}' > site/data/site-build.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

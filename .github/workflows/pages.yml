name: GitHub Pages Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/20 * * * *"
permissions:
  pages: write
  id-token: write
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Trim non-site files
        run: |
          rm -rf .git market-brain.apk xray_tg.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

name: pipeline

# THE pipeline. One file, one schedule, one job that collects everything, analyses
# it, verifies it and commits it. Optional sources light up on their own the moment
# you add their secret - nothing to edit.
#
# 17:30 UTC = 23:00 IST (11 PM), once a day, every day. Cron is always UTC (GMT).
#
# Same order as scripts/run_pipeline.sh, so a local run proves what CI will do.
on:
  schedule:
    - cron: "30 17 * * *"     # 23:00 IST daily
  workflow_dispatch: {}          # or run it by hand

permissions:
  contents: write                # commit the new data
  issues: write                  # raise an alert if a feed goes stale

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ collect
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Flags are computed here because the `secrets` context is NOT available inside a
    # step-level `if:` - using it there makes the whole workflow fail to parse.
    env:
      HAS_DRIVE: ${{ secrets.GOOGLE_SA_JSON != '' && secrets.ARTHASAAR_DRIVE_FOLDER != '' }}
      HAS_SHEETS: ${{ secrets.GOOGLE_SA_JSON != '' && secrets.SHEET_SOURCE_ID != '' }}
      HAS_NOTION: ${{ secrets.NOTION_TOKEN != '' && secrets.NOTION_DATABASE_ID != '' }}
      HAS_ARTHASAAR: ${{ secrets.ARTHASAAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: "1. NSE bhavcopy (equities + F&O)"
        run: python scripts/fetch_bhavcopy.py --latest

      - name: "2. Yahoo Finance (indices, global)"
        run: |
          python scripts/fetch_yahoo.py --group indices --period 5y || true
          python scripts/fetch_yahoo.py --group global --period 2y || true
          python scripts/fetch_yahoo.py --group fx --period 2y || true
          python scripts/fetch_yahoo.py --group nse_stocks --period 2y || true

      - name: "3. YouTube channels -> uploads"
        run: python scripts/fetch_youtube.py

      - name: "4. YouTube analysis (the brain)"
        run: python scripts/analyze_youtube.py

      - name: "5. Candle archive from bhavcopy"
        run: python scripts/candles_from_bhavcopy.py --from-local

      - name: "5b. Corporate actions + price adjustment (BEFORE any analysis)"
        run: |
          python scripts/corporate_actions.py --fetch
          python scripts/corporate_actions.py --adjust || echo "no archive to adjust yet"

      - name: "6. Analytics (futures, breadth)"
        run: python scripts/build_analytics.py

      - name: "7. Feature table"
        run: |
          if [ -f data/candles/cm_daily.parquet ] || [ -f data/candles/daily.parquet ]; then
            python scripts/build_features.py
          else
            echo "no candle archive yet - skipping"
          fi

      - name: "7b. Indicators (verified library)"
        run: python scripts/build_indicators.py

      - name: "7c. Forecasts (free models, walk-forward accuracy)"
        run: python scripts/forecast.py --models naive,drift,mean,seasonal_naive,ets,arima

      - name: "7d. Crypto"
        run: python scripts/fetch_crypto.py

      - name: "7f. Data quality check"
        run: python scripts/validate_data.py

      - name: "7g. Patterns + relative strength + screens"
        run: |
          python scripts/patterns.py --all || true
          python scripts/relative_strength.py || true
          python scripts/screen.py --rule trend_up || true
          python scripts/screen.py --rule oversold || true

      - name: "7h. Reference backtest (a rule has to beat naive to matter)"
        run: python scripts/backtest.py --strategy sma_cross --fast 20 --slow 50 --stop 0.08 --target 0.20 || true

      - name: "7i. NSE reference data (FII/DII, symbol master, indices)"
        run: python scripts/fetch_nse_extra.py

      - name: "7j. Mutual fund NAVs (AMFI)"
        run: python scripts/fetch_amfi.py || true

      - name: "7k. News headlines (RSS)"
        run: python scripts/fetch_news.py || true

      - name: "7l. Spike detection (OI + volume)"
        run: python scripts/build_spikes.py || true

      - name: "7m1. Full listed universe (all NSE symbols)"
        run: python scripts/build_universe.py || true

      - name: "7m1b. Indices (constituents + points)"
        run: python scripts/build_indices.py || true

      - name: "7m1c. Sector heat map"
        run: python scripts/build_sectors.py || true

      - name: "7m2. Stock pages - deepen a slice of the universe"
        run: python scripts/build_stock_pages.py --rotate 300 || true

      - name: "7m2b. ETF pages (all NSE-listed ETFs)"
        run: python scripts/build_etf_pages.py || true

      - name: "7m2c0. Benchmark history for the fund comparison (10y)"
        run: python scripts/fetch_yahoo.py --symbols "^NSEI" "^BSESN" "GC=F" --period 10y || true

      - name: "7m2c. Mutual funds (NAV record + benchmark comparison)"
        run: python scripts/fetch_mutual_funds.py --limit 400 || true

      - name: "7m3. Crypto pages (list + per-coin technicals)"
        run: python scripts/build_crypto_pages.py --top 120 || true

      - name: "7m4. Global pages (stocks by country)"
        run: python scripts/build_global_pages.py || true

      - name: "7n1. Screener metrics"
        run: python scripts/build_screener.py || true

      - name: "7n2. Search index"
        run: python scripts/build_search_index.py || true

      - name: "7n. Build the website data (docs/data.json)"
        run: python scripts/build_site_data.py

      - name: "8. Google Drive candle archive (optional)"
        if: env.HAS_DRIVE == 'true'
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python scripts/candles_from_drive.py --folder-id "${{ secrets.ARTHASAAR_DRIVE_FOLDER }}" --kind daily

      - name: "9. Google Sheets source (optional)"
        if: env.HAS_SHEETS == 'true'
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python scripts/fetch_from_sheets.py --spreadsheet-id "${{ secrets.SHEET_SOURCE_ID }}" --range "${{ secrets.SHEET_SOURCE_RANGE }}"

      - name: "10. Notion source (optional)"
        if: env.HAS_NOTION == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/fetch_notion.py --database-id "${{ secrets.NOTION_DATABASE_ID }}" --name notion

      - name: "11. ArthaSaar analytics JSONs (optional)"
        if: env.HAS_ARTHASAAR == 'true'
        env:
          ARTHASAAR_TOKEN: ${{ secrets.ARTHASAAR_TOKEN }}
        run: python scripts/fetch_arthasaar_data.py

      - name: "12. Freshness check"
        run: python scripts/check_freshness.py --max-age 4

      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          # docs/ matters as much as data/: it holds the website's data.json,
          # stocks.json and the rest. Staging only data/ meant the site never updated.
          git add data/ docs/
          # docs/index.html and the other hand-maintained files are NOT written by this
          # pipeline. Staging all of docs/ meant the runner committed its own stale copy
          # over any concurrent edit - which silently reverted a merged pull request.
          # Unstage them so the commit only ever contains what this pipeline generated.
          git reset -q -- docs/index.html docs/sw.js docs/config.json docs/charges.json docs/learn.json 2>/dev/null || true
          git commit -m "pipeline: $(date -u +%FT%TZ)" || echo "no changes to commit"

          # A concurrent push (a manual commit, another workflow) makes this fail with
          # exit 128 - and because that failure came last, the whole run was marked red
          # and NOTHING was published, even though every step before it had succeeded.
          # Retry around it, and abort any half-finished rebase instead of leaving the
          # repo stuck in one.
          pushed=0
          for i in 1 2 3 4; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash || true
            if git push; then pushed=1; break; fi
            echo "push attempt $i failed; retrying in 5s"; sleep 5
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::could not push after 4 attempts - data was built but not published"
            exit 1
          fi
          echo "published"

  # ------------------------------------------------------------------ forecast
  # TimesFM lives in its own workflow (.github/workflows/timesfm.yml): loading the
  # 200M checkpoint needs 3-4 GB of RAM, so it runs on a separate schedule with the
  # model cached on Google Drive.

  # ------------------------------------------------------------------ alert
  # If the pipeline itself fails, say so loudly instead of going quiet.
  alert:
    needs: [collect]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Open an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Pipeline failure"
          BODY=$(cat <<'EOF'
          The daily **pipeline** run failed. Check the Actions tab for the failing step.

          Common causes:
          - bhavcopy step: NSE changed its file URL or columns (see fetch_bhavcopy.py)
          - yahoo step: rate-limited (safe to ignore once)
          - freshness step: a feed has gone stale

          Opened automatically by .github/workflows/pipeline.yml.
          EOF
          )
          EXISTING=$(gh issue list --state open --search "$TITLE" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY"
          else gh issue create --title "$TITLE" --body "$BODY"; fi

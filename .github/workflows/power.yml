name: Power Pack
on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 1-5'
permissions:
  contents: write
jobs:
  power:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/radar_collect.py
      - run: python3 scripts/dividends_collect.py || true
      - run: python3 scripts/bullish_scan.py
      - run: python3 scripts/fix_power.py
      - run: python3 scripts/fix_money.py
      - run: python3 scripts/fix_bullish.py
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add data/radar.json data/dividends.json data/bullish.json app.js index.html
          git commit -m "feat: bullish scanner (week/month/year/long-term scores)" || echo "no change"
          git pull --rebase || true
          git push

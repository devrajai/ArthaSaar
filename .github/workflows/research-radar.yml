name: Research Radar
on:
  push:
    paths:
      - 'scripts/research_radar.py'
      - 'scripts/research_alerts.py'
      - 'scripts/research_finalize.py'
      - 'scripts/research_edge_pack.py'
      - '.github/workflows/research-radar.yml'
  schedule:
    # 21:50 IST Mon-Sat, after the second daily brain pass (21:05 IST).
    - cron: '20 16 * * 1-6'
  workflow_run:
    workflows: ["Daily Brain Collect"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-radar
  cancel-in-progress: false
jobs:
  radar:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Research Radar Python
        run: python3 -m py_compile scripts/research_radar.py
      - name: Build 44-module Research Radar
        run: python3 scripts/research_radar.py
      - name: Build free alert feed
        run: python3 scripts/research_alerts.py
      - name: Recompute data health after radar products
        run: python3 scripts/data_health.py
      - name: Finalize radar freshness metadata
        run: python3 scripts/research_finalize.py
      - name: Build Research Edge Pack
        run: python3 scripts/research_edge_pack.py
      - name: Commit radar snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research-radar.json data/research-history.json data/index-membership.json data/index-membership-history.json data/research-signal-history.json data/research-market-history.json data/research-alerts.json data/research-edge-pack.json data/data-health.json
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'data: refresh research radar'
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -X theirs origin main && git push; then
                echo 'Pushed successfully'; exit 0
              fi
              git rebase --abort || true
              sleep 10
            done
            echo 'ERROR: push failed'; exit 1
          fi

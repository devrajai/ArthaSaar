name: rotate-password
on: workflow_dispatch
permissions:
  contents: write
jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: swap hash
        run: |
          python3 - << 'EOF'
          s = open("index.html", encoding="utf-8").read()
          old = "402050bf47fafdda98bb3680ffe9423a597f06e1aa61065993b5cd7c8574e2dc"
          new = "b811a679d90e2cfdd9996aaa2a37610af14bb604cb3492b6ed15914411885edb"
          assert s.count(old) == 1, "old hash not found exactly once"
          open("index.html", "w", encoding="utf-8").write(s.replace(old, new))
          print("password hash swapped")
          EOF
      - name: commit and push
        run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add index.html
          git commit -m "chore: rotate site password" || echo "nothing to commit"
          for i in 1 2 3; do git push && break; git pull --rebase -X theirs || true; done

name: Screener Fundamentals
on:
  schedule:
    # Sundays 7:05 AM IST — weekly deep fundamentals for Nifty 500
    - cron: '5 1 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screener-fundamentals
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Collect deep fundamentals from screener.in (throttled, ~20 min)
        run: python scripts/screener_collect.py

      - name: Commit screener fundamentals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'chore: screener.in deep fundamentals (weekly)'
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then
                echo 'Pushed successfully'; exit 0
              fi
              echo "Push failed (attempt $i) — rebasing and retrying in 15s"
              sleep 15
            done
            echo 'ERROR: could not push after 5 attempts'; exit 1
          fi

name: Telegram public channels

# Reads PUBLIC Telegram channels through their own web preview (t.me/s/<name>).
# No bot token, no phone number, no login - it is the same page a logged-out browser sees.
#
# HARD REQUIREMENT: the channel owner must have "Show a preview of posts on the web" enabled.
# Without it t.me/s/<name> serves a landing page with no messages, and there is no way around
# that from outside. The collector reports which channels are in that state rather than
# silently recording zero.
#
# Runs twice a day because market channels post around the open and after the close.

on:
  schedule:
    - cron: '45 4 * * 1-5'    # 10:15 IST, after the morning posts
    - cron: '15 13 * * 1-5'   # 18:45 IST, after the close
  workflow_dispatch:
    inputs:
      channels:
        description: 'Comma separated handles, no @ (blank = TELEGRAM_CHANNELS secret)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: telegram-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow

      - name: Collect
        env:
          TELEGRAM_CHANNELS: ${{ github.event.inputs.channels || secrets.TELEGRAM_CHANNELS }}
        run: python scripts/fetch_telegram_channels.py

      - name: Show what we got
        run: |
          python - <<'EOF'
          import json, os
          p = "docs/telegram.json"
          if not os.path.exists(p):
              print("::warning title=No output::the collector wrote nothing")
              raise SystemExit(0)
          d = json.load(open(p))
          print(f"{d.get('count',0)} messages across {len(d.get('channels') or [])} channels")
          for c in (d.get("channels") or []):
              print(f"  {c['channel']:24s} {c['messages']:4d}  latest {str(c.get('latest'))[:19]}")
          for pr in (d.get("problems") or []):
              print(f"  !! {pr['channel']}: {pr['problem']}")
          a = "data/telegram/messages.parquet"
          if os.path.exists(a):
              print(f"archive: {os.path.getsize(a)/1e6:.2f} MB")
          EOF

      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/telegram/ docs/telegram.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: telegram channels $(date -u +%F)"
          for i in 1 2 3 4 5 6; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash || true
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            sleep $((i*12))
          done
          echo "::warning title=Push failed::the run will retry at the next schedule"

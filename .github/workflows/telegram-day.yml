name: Telegram Day Analysis
on:
  workflow_dispatch:

concurrency:
  group: telegram
  cancel-in-progress: false

# Least privilege. This workflow uses secrets, so it must not inherit the
# repository default token scope. contents:read is all it needs.
permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install yfinance (Sensex fallback)
        run: pip install -q yfinance

      - name: Fetch ArthaSaar market data
        run: python3 scripts/fetch_arthasaar_data.py

      - name: Send day analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scripts/telegram_brain.py afternoon

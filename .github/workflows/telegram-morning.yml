name: Telegram Morning Brief
on:
  schedule:
    # 8:30 AM IST Mon-Fri — single merged morning message
    # (7AM AI brief + Morning Digest + Pre-open brief -> EK message)
    - cron: '0 3 * * 1-5'
  workflow_dispatch:

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch ArthaSaar market data
        run: python3 scripts/fetch_arthasaar_data.py

      # morning_unified.py was REMOVED from here. It reads the OLD ArthaSaar layout -
      # data/mood.json, smart-brain.json, radar.json, gti.json, oi-gti.json,
      # indices-all.json, breadth.json, preopen.json, events.json. Nine of those ten no
      # longer exist, and fetch_arthasaar_data.py fails soft when it cannot find them, so it
      # sent a near-empty brief with NO error anywhere. telegram_brief.py below replaces it
      # and reads this repo's own data.

      # The daily brief from this repo's own data. morning_unified.py reads the OLD
      # ArthaSaar layout (mood.json, smart-brain.json, ...) and nine of those ten files
      # no longer exist, so it would have sent a near-empty message with no error.
      - name: Send the daily brief (docs/brief.json)
        run: python3 scripts/telegram_brief.py

      - name: Commit fii history
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/fii-history.json
          git commit -m "data: fii history update" || echo "no change"
          git pull --rebase || true
          git push

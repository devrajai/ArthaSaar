name: Telegram Who
on:
  workflow_dispatch:

# Least privilege. This workflow uses secrets, so it must not inherit the
# repository default token scope. contents:read is all it needs.
permissions:
  contents: read

jobs:
  who:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: List chat ids
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN || secrets.TELEGRAM }}
        run: python scripts/telegram_who.py

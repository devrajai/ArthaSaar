name: Telegram Who
on:
  workflow_dispatch:

# Least privilege. This workflow uses secrets, so it must not inherit the
# repository default token scope. contents:read is all it needs.
permissions:
  contents: read

jobs:
  who:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: List chat ids
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN || secrets.TELEGRAM }}
        run: python scripts/telegram_who.py

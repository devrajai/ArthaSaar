name: Telegram Who
on:
  workflow_dispatch:

jobs:
  who:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: List chat ids
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: python scripts/telegram_who.py

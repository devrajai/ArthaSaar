name: Telegram Alerts
on:
  workflow_dispatch:
  schedule:
    # 09:20 market open summary removed
    - cron: "30 10 * * 1-5"  # 16:00 IST — market close summary
concurrency:
  group: telegram
  cancel-in-progress: false
# Least privilege. This workflow uses secrets, so it must not inherit the
# repository default token scope. contents:read is all it needs.
permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ArthaSaar market data
        run: python3 scripts/fetch_arthasaar_data.py

      - run: python3 scripts/telegram_alert.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN || secrets.TELEGRAM }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID || secrets.TELEGRAM_CHAT }}

name: Telegram Alerts
on:
  workflow_dispatch:
  schedule:
    - cron: "50 3 * * 1-5"    # 09:20 IST — market open summary
    - cron: "30 10 * * 1-5"  # 16:00 IST — market close summary
concurrency:
  group: telegram
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/telegram_alert.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

name: tests

# Guards the two things that must not silently break: the indicator maths and the
# backtester's execution timing. Runs on every push and PR, so a future edit that
# introduces look-ahead or a wrong formula fails here instead of quietly corrupting
# results.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Indicator correctness + no look-ahead
        run: python scripts/test_indicators.py

      - name: Backtest execution timing + cost accounting
        run: python scripts/test_backtest.py

      - name: TimesFM forecast maths (stub model, no 4 GB download)
        run: python scripts/test_timesfm.py

      - name: Mutual fund maths (stub NAV history, no network)
        run: python scripts/test_mf.py

      - name: Every script compiles
        run: python -m compileall -q scripts

      # THE GATE THAT WAS MISSING. scripts/check_page.py has existed for weeks and nothing
      # called it, so it never ran - not on push, not on pull request, not in the pipeline.
      # On 10 Nov a page-breaking commit reached the live site and no check stopped it: the
      # script that would have caught it was sitting in the repo, orphaned.
      #
      # It reads docs/index.html against the JSON files the page will actually receive and
      # fails if a card would throw - a guard checking the wrong field, a name used but never
      # declared, a binding pointed at a file that does not exist. No `|| true`: a gate that
      # cannot fail is decoration.
      - name: Page gate - the page must match the data
        run: python scripts/check_page.py

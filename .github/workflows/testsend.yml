name: Test Send
on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: "Naye member ka Telegram chat ID (sirf usiko test jayega)"
        required: true
concurrency:
  group: testsend
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test_send.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TEST_CHAT_ID: ${{ github.event.inputs.chat_id }}

name: "Telegram channel diagnostic"
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Where does it redirect, and is there any preview at all?
        run: |
          for path in "s/LIVEOPTIONDATA" "s/liveoptiondata" "LIVEOPTIONDATA"; do
            echo "=== t.me/$path ==="
            curl -s -L -o /tmp/t.html -w '  final HTTP %{http_code} | %{size_download} bytes | url=%{url_effective}\n' \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0" "https://t.me/$path"
            echo -n "  message bodies: "; grep -o 'tgme_widget_message_text' /tmp/t.html | wc -l
            echo -n "  channel title: "; grep -o '<meta property="og:title" content="[^"]*"' /tmp/t.html | head -1
            echo -n "  is it a private-channel page: "; grep -c 'tgme_page_extra' /tmp/t.html || true
            echo -n "  mentions subscriber count: "; grep -o 'subscribers' /tmp/t.html | head -1 || echo none
          done
          echo
          echo "=== also try the widget endpoint ==="
          curl -s -o /tmp/w.html -w 'widget HTTP %{http_code} | %{size_download} bytes\n' \
            -A "Mozilla/5.0" "https://t.me/s/LIVEOPTIONDATA"
          grep -o 'tgme_widget_message_text' /tmp/w.html | wc -l

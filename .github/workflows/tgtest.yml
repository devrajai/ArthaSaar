name: TG Test Msg
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for id in 1392604324 1073463083; do
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
              -d chat_id="$id" \
              --data-urlencode "text=Welcome jems_bonda! (6th member) - Aap ab Market Brain ke rozana Market + IPO Telegram messages receive karoge. Ye sirf test message hai - aaj se daily digest, alerts, IPO news sab aayega. - Market Brain by Dev" > /dev/null
            echo "sent $id"
          done

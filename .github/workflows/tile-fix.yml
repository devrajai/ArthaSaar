name: tile-bluefix
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: fix tile active blue border + ROCE label + bump version
        run: |
          python3 - << 'EOF'
          s = open("index.html", encoding="utf-8").read()
          old1 = ".tile:active{border-color:#5aa7ff}"
          new1 = ".tile:active{border-color:rgba(255,255,255,.22)}"
          assert s.count(old1) == 1, "tile active rule not found exactly once"
          s = s.replace(old1, new1)
          old2 = '<select id="dfROCE"><option value="0">ROE: any</option>'
          new2 = '<select id="dfROCE"><option value="0">ROCE: any</option>'
          assert s.count(old2) == 1, "dfROCE label not found exactly once"
          s = s.replace(old2, new2)
          old3 = 'app.js?v=21sep26b'
          new3 = 'app.js?v=21sep26c'
          assert s.count(old3) == 1, "version tag not found exactly once"
          s = s.replace(old3, new3)
          open("index.html", "w", encoding="utf-8").write(s)
          print("3 edits applied")
          EOF
      - name: commit and push
        run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add index.html
          git commit -m "fix: tile :active blue border (the sticky blue line), ROCE label, version bump c" || echo "nothing to commit"
          for i in 1 2 3; do git push && break; git pull --rebase -X theirs || true; done

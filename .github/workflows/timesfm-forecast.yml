name: TimesFM Forecasts
on:
  schedule:
    # weekly, Sunday 8:05 PM IST (after Friday close + weekend data settled)
    - cron: '35 14 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timesfm-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install TimesFM 3.0 + yfinance
        run: |
          python -m pip install --upgrade pip
          pip install "timesfm[torch]" yfinance

      - name: Run TimesFM 3.0 forecasts (indices + top stocks + crypto)
        run: python scripts/timesfm_forecast.py

      - name: Commit forecast data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'chore: timesfm 3.0 weekly forecasts'
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then
                echo 'Pushed successfully'; exit 0
              fi
              echo "Push failed (attempt $i) — rebasing and retrying in 15s"
              sleep 15
            done
            echo 'ERROR: could not push after 5 attempts'; exit 1
          fi

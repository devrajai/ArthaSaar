name: TimesFM forecasts (FM3)

# Why a separate workflow: loading the 2.5-200M checkpoint needs about 3-4 GB of RAM.
# That fits a GitHub runner but not a small container, so this does not run inside the
# daily pipeline. It runs on its own schedule and commits one JSON the site reads.
#
# The checkpoint is ~1 GB. It is cached with actions/cache, which needs no credentials and
# is scoped to this repo - so it downloads once and is restored on every later run.
#
# Google Drive is also supported, but only when GOOGLE_SA_JSON and ARTHASAAR_DRIVE_FOLDER
# are set as repository secrets. Neither is set today, so the Drive mirror is skipped and
# the run says so out loud instead of failing quietly.

on:
  schedule:
    # daily 20:35 IST (15:05 UTC) - after the EOD data is in
    - cron: '5 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timesfm
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HOME: ${{ github.workspace }}/.hf
      # `secrets` cannot be used in a step-level if: - compute the flag here instead.
      HAS_DRIVE: ${{ secrets.GOOGLE_SA_JSON != '' && secrets.ARTHASAAR_DRIVE_FOLDER != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install TimesFM, torch (CPU) and helpers
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install "timesfm" yfinance pandas pyarrow
          pip install google-api-python-client google-auth

      # THE CHECKPOINT IS ~1 GB. Without a cache it downloads from HuggingFace on every
      # single run - run 17's log says "unauthenticated requests to the HF Hub" and then
      # spends minutes pulling it again.
      #
      # Two caches, in order of preference:
      #   1. actions/cache - works TODAY with no credentials, free, 10 GB per repo.
      #   2. Google Drive   - only when GOOGLE_SA_JSON is set. Currently it is not, which is
      #                       why this step has been skipping silently.
      # actions/cache is the one that actually runs, and it is the better tool here: it is
      # scoped to this repo and this key, so it cannot pick up a stale copy.
      - name: Restore the TimesFM checkpoint (actions cache)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf
          key: timesfm-2.5-200m-pytorch-v1
          restore-keys: |
            timesfm-2.5-200m-pytorch-

      - name: Restore the model cache from Google Drive (only if configured)
        if: env.HAS_DRIVE == 'true'
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          ARTHASAAR_DRIVE_FOLDER: ${{ secrets.ARTHASAAR_DRIVE_FOLDER }}
        run: python scripts/timesfm_drive.py --pull || true

      - name: Say plainly whether Drive is wired up
        env:
          HAS_DRIVE: ${{ secrets.GOOGLE_SA_JSON != '' && secrets.ARTHASAAR_DRIVE_FOLDER != '' }}
        run: |
          if [ "$HAS_DRIVE" = "true" ]; then
            echo "Google Drive: configured - the checkpoint and forecasts are mirrored there."
          else
            echo "::notice title=Google Drive not configured::GOOGLE_SA_JSON is unset, so the Drive mirror is skipped. The actions cache above still prevents re-downloading the 1 GB checkpoint every run."
          fi

      # THE MISSING PIECE. This workflow checked out the repo and went straight to the model,
      # but data/candles/ is gitignored - so the archive was empty and only the 13 Yahoo
      # index series had anything to forecast. That is why FM3 showed 13 series and no
      # stocks. The daily pipeline restores the archive in its step 5a; this does the same.
      - name: Restore the price archive (otherwise there is nothing to forecast)
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          ARTHASAAR_DRIVE_FOLDER: ${{ secrets.ARTHASAAR_DRIVE_FOLDER }}
        run: |
          if [ -z "$ARTHASAAR_DRIVE_FOLDER" ]; then
            echo "::notice title=Reading the archive from the release asset::Drive folder not set"
            python scripts/candles_from_drive.py --kind daily || true
          else
            python scripts/candles_from_drive.py --folder-id "$ARTHASAAR_DRIVE_FOLDER" --kind daily || true
          fi
          python - <<'EOF'
          import os, pandas as pd
          p = "data/candles/daily.parquet"
          if os.path.exists(p):
              d = pd.read_parquet(p, columns=["date"])
              print(f"archive: {len(d):,} rows, {d['date'].nunique()} sessions")
              if d["date"].nunique() < 100:
                  print("::warning title=Archive still shallow::TimesFM will only see indices")
          else:
              print("::warning title=No archive::TimesFM will only see the Yahoo indices")
          EOF

      # THE SECOND MISSING PIECE, and run 18 proved it.
      # After restoring the archive, run 18 still forecast only 13 series. Because
      # timesfm_forecast.py reads data/candles/daily_adj.parquet - the SPLIT-ADJUSTED file -
      # and restoring the archive only produces the raw daily.parquet. The adjusted file is
      # written by corporate_actions.py, which the daily pipeline runs and this workflow
      # never did.
      #
      # Adjustment is not optional for forecasting: an unadjusted 1:10 split reads as a 90%
      # crash and would poison every prediction.
      - name: Fetch and apply corporate actions (splits, bonuses)
        run: |
          python scripts/corporate_actions.py --fetch || echo "no corporate actions fetched"
          python scripts/corporate_actions.py --adjust || echo "nothing to adjust"
          python - <<'EOF'
          import os
          for p in ("data/candles/daily_adj.parquet", "data/candles/cm_daily_adj.parquet"):
              print(f"{p}: {'%.0f MB' % (os.path.getsize(p)/1e6) if os.path.exists(p) else 'MISSING'}")
          EOF

      - name: Run TimesFM forecasts
        env:
          OMP_NUM_THREADS: '2'
        run: python scripts/timesfm_forecast.py --max-series 60 --context 512 --horizon 63

      - name: Save the model cache and forecasts to Google Drive
        if: env.HAS_DRIVE == 'true'
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          ARTHASAAR_DRIVE_FOLDER: ${{ secrets.ARTHASAAR_DRIVE_FOLDER }}
        run: |
          python scripts/timesfm_drive.py --push || true
          python scripts/timesfm_drive.py --push-forecasts || true

      - name: Rebuild the site data so the page picks it up
        run: python scripts/build_site_data.py || true

      - name: Commit the forecasts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/timesfm_forecasts.json docs/data.json
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'chore: TimesFM (FM3) forecasts'
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -X theirs origin main && git push; then
                echo 'Pushed.'; exit 0
              fi
              git rebase --abort || true
              sleep 15
            done
            echo 'ERROR: could not push after 5 attempts'; exit 1
          fi

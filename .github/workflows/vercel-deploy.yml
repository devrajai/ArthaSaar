name: Deploy to Vercel

# Vercel's own GitHub integration stopped posting a status on any commit after 23 Nov, so
# arthasaar.vercel.app froze on an old build while GitHub Pages kept updating. This deploys
# explicitly on every push instead of relying on that integration being healthy.
#
# The token can live under any of the usual names - VERCEL_TOKEN, VERCEL_API_KEY,
# VERCEL_API_TOKEN or VERCEL_KEY. A secret whose name does not match the workflow reads as
# empty and fails here, which is exactly what happened on the first two runs, so the check
# below names every name it looked for instead of just one.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "vercel.json"
      - ".github/workflows/vercel-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"

      # DEPLOY HOOK PATH - no token, no scopes, no project lookup.
      # A Vercel deploy hook is a URL you create once in the project settings. Hitting it
      # starts a production deploy of that project. It carries the project id inside the URL,
      # so it works even when the API token cannot list projects - which is exactly the
      # situation here: the token reads /v2/user but sees zero projects in every scope.
      - name: Deploy via hook (if configured)
        id: hook
        env:
          HOOK: ${{ secrets.DEPLOY_HOOK || secrets.VERCEL_DEPLOY_HOOK || secrets.vercel_hook }}
        run: |
          if [ -z "$HOOK" ]; then echo "no deploy hook configured"; echo "used=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::add-mask::$HOOK"
          CODE=$(curl -s -o /tmp/hook.json -w "%{http_code}" -X POST "$HOOK")
          echo "hook responded http $CODE"
          head -c 300 /tmp/hook.json 2>/dev/null; echo
          echo "used=1" >> "$GITHUB_OUTPUT"
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "::error::Deploy hook returned HTTP $CODE"; exit 1
          fi
          echo "### Vercel deploy (hook)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- triggered via deploy hook, http $CODE" >> "$GITHUB_STEP_SUMMARY"

      - name: Find the token
        id: tok
        if: steps.hook.outputs.used != '1'
        env:
          # Secrets first, then Variables. GitHub puts both on the same settings page under
          # two tabs, and a value added to the Variables tab is invisible to secrets.* - which
          # reads as an empty string with no error at all.
          T1: ${{ secrets.VERCEL_TOKEN }}
          T2: ${{ secrets.VERCEL_API_KEY }}
          T3: ${{ secrets.VERCEL_API_TOKEN }}
          T4: ${{ secrets.VERCEL_KEY }}
          # The repository secret is actually named "vercel" - not VERCEL_TOKEN. A secret
          # whose name the workflow does not reference reads as an empty string, with no
          # warning anywhere, which is why three runs failed with a token that did exist.
          T9: ${{ secrets.vercel }}
          T10: ${{ secrets.VERCEL }}
          T5: ${{ vars.VERCEL_TOKEN }}
          T6: ${{ vars.VERCEL_API_KEY }}
          T7: ${{ vars.VERCEL_API_TOKEN }}
          T8: ${{ vars.VERCEL_KEY }}
        run: |
          FOUND=""
          for NAME in T9 T10 T1 T2 T3 T4 T5 T6 T7 T8; do
            eval "V=\$$NAME"
            if [ -n "$V" ]; then FOUND="$V"; echo "using $NAME"; break; fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::No Vercel token found. Looked for vercel, VERCEL, VERCEL_TOKEN, VERCEL_API_KEY, VERCEL_API_TOKEN and VERCEL_KEY, as both Secrets and Variables. Add one at Settings > Secrets and variables > Actions > New repository secret. The name must match exactly and it must be a Secret, not a Variable."
            exit 1
          fi
          # Trim surrounding whitespace and any stray newline. A token pasted with a trailing
          # space or line break is rejected by the Vercel CLI with "not valid", which reads
          # like a wrong token rather than a formatting problem.
          FOUND="$(printf '%s' "$FOUND" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          echo "::add-mask::$FOUND"
          # Length only - never the value. A Vercel token is about 24 characters; a much longer
          # or much shorter string means the wrong thing was pasted.
          echo "token length: ${#FOUND}"
          echo "first 4 chars: $(printf '%s' "$FOUND" | cut -c1-4)"
          {
            echo "tok<<__EOF__"
            echo "$FOUND"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      # The token may be scoped to a single project, in which case it can deploy to that
      # project but cannot enumerate projects or teams. The deployed page itself often carries
      # the project id in a meta tag or an insights script, so look there before giving up.
      - name: Recover the project id from the live site
        id: live
        if: steps.hook.outputs.used != '1'
        run: |
          for HOST in https://arthasaar.vercel.app https://artha-saar.vercel.app; do
            echo "--- $HOST ---"
            curl -s -m 20 "$HOST" -o /tmp/page.html -w "http %{http_code}\n" || true
            grep -oE 'prj_[A-Za-z0-9]{10,}' /tmp/page.html 2>/dev/null | sort -u | head -3
            grep -oE 'team_[A-Za-z0-9]{10,}' /tmp/page.html 2>/dev/null | sort -u | head -3
            grep -oE '/_vercel/[a-z]+' /tmp/page.html 2>/dev/null | sort -u | head -3
          done
          # Vercel exposes the project id on the deployment's own JSON metadata endpoint
          for HOST in https://arthasaar.vercel.app https://artha-saar.vercel.app; do
            echo "--- $HOST/_vercel/insights ---"
            curl -s -m 15 "$HOST/_vercel/insights/script.js" -o /tmp/i.js -w "http %{http_code}\n" || true
            grep -oE 'prj_[A-Za-z0-9]{10,}' /tmp/i.js 2>/dev/null | sort -u | head -3
          done

      - name: Find the project
        id: proj
        if: steps.hook.outputs.used != '1'
        env:
          VERCEL_TOKEN: ${{ steps.tok.outputs.tok }}
          PINNED: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$PINNED" ]; then
            echo "using pinned VERCEL_PROJECT_ID"; echo "pid=$PINNED" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 - <<'PY' > /tmp/pick.txt
          import json, os, urllib.request

          TOK = os.environ["VERCEL_TOKEN"]
          def api(path):
              req = urllib.request.Request("https://api.vercel.com" + path,
                                           headers={"Authorization": "Bearer " + TOK})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except Exception as e:
                  print("# api %s failed: %s" % (path, e))
                  return {}

          # The token's defaultTeamId returned zero projects, so the site is somewhere else -
          # a different team, or the personal scope. Look in every scope the token can see and
          # log all of them, so a wrong pick is obvious.
          scopes = [("personal", None)]
          for t in (api("/v2/teams").get("teams") or []):
              scopes.append((t.get("slug") or t.get("name"), t.get("id")))

          best = None
          for name, tid in scopes:
              q = "/v9/projects?limit=100" + (("&teamId=" + tid) if tid else "")
              d = api(q)
              ps = d.get("projects") or []
              print("# scope %-22s %d project(s)" % (name, len(ps)))
              for pr in ps:
                  link = pr.get("link") or {}
                  print("#    %-28s repo=%s id=%s" % (pr.get("name"), link.get("repo"), pr.get("id")))
                  repo = (link.get("repo") or "").lower()
                  nm = (pr.get("name") or "").lower()
                  if best is None and (repo == "arthasaar" or "arthasaar" in nm):
                      best = (pr.get("id"), tid, name, pr.get("name"))
          if best:
              print("# picked %s in %s" % (best[3], best[2]))
              print("pid=" + best[0])
              if best[1]:
                  print("tid=" + best[1])
          else:
              print("# nothing matched arthasaar")
          PY
          cat /tmp/pick.txt
          grep '^pid=' /tmp/pick.txt >> "$GITHUB_OUTPUT" || true
          grep '^tid=' /tmp/pick.txt >> "$GITHUB_OUTPUT" || true

      - name: Deploy docs/ to production (REST API)
        if: steps.hook.outputs.used != '1'
        env:
          VERCEL_TOKEN: ${{ steps.tok.outputs.tok }}
          TEAM: ${{ steps.proj.outputs.tid || secrets.VERCEL_ORG_ID }}
          PROJECT: ${{ steps.proj.outputs.pid || secrets.VERCEL_PROJECT_ID }}
        run: |
          # Sending every file inside the deployment JSON hits Vercel's 10 MB request limit -
          # docs/ is 23.7 MB across 2,376 files. So upload each file first via /v2/files
          # (keyed by its sha1) and then send the deployment as a manifest of hashes. That is
          # the documented flow for larger sites and has no total-size ceiling.
          python3 - <<'PY'
          import base64, hashlib, json, os, sys, urllib.request, urllib.error
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path

          TOK = os.environ["VERCEL_TOKEN"]
          TEAM = os.environ.get("TEAM") or ""
          PROJ = os.environ.get("PROJECT") or ""
          NAME = "arthasaar"
          Q = ("?teamId=" + TEAM) if TEAM else ""

          def post_file(path, blob):
              sha = hashlib.sha1(blob).hexdigest()
              req = urllib.request.Request("https://api.vercel.com/v2/files" + Q, data=blob, method="POST")
              req.add_header("Authorization", "Bearer " + TOK)
              req.add_header("x-vercel-digest", sha)
              req.add_header("Content-Type", "application/octet-stream")
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      r.read()
                  return (path, sha, len(blob), None)
              except urllib.error.HTTPError as e:
                  return (path, sha, len(blob), "%s %s" % (e.code, e.read().decode("utf-8","replace")[:160]))

          root = Path("docs")
          items = [(str(f.relative_to(root)).replace(os.sep,"/"), f.read_bytes())
                   for f in sorted(root.rglob("*")) if f.is_file()]
          total = sum(len(b) for _, b in items)
          print("files: %d, %.1f MB" % (len(items), total/1024/1024))

          manifest, errors = [], []
          with ThreadPoolExecutor(max_workers=8) as ex:
              for path, sha, size, err in ex.map(lambda it: post_file(*it), items):
                  if err: errors.append((path, err))
                  manifest.append({"file": path, "sha": sha, "size": size})
          print("uploaded: %d, errors: %d" % (len(manifest)-len(errors), len(errors)))
          for p_, e_ in errors[:5]: print("  upload error", p_, e_)
          if len(errors) > len(items) * 0.02:
              print("::error::too many upload failures (%d of %d)" % (len(errors), len(items)))
              sys.exit(1)

          payload = {"name": NAME, "files": manifest, "target": "production",
                     "projectSettings": {"framework": None, "buildCommand": None,
                                         "installCommand": None, "outputDirectory": None}}
          q = Q + (("&" if Q else "?") + "projectId=" + PROJ if PROJ else "")
          req = urllib.request.Request("https://api.vercel.com/v13/deployments" + q,
                                       data=json.dumps(payload).encode(), method="POST")
          req.add_header("Authorization", "Bearer " + TOK)
          req.add_header("Content-Type", "application/json")
          try:
              with urllib.request.urlopen(req, timeout=300) as r:
                  code, resp = r.status, json.loads(r.read() or b"{}")
          except urllib.error.HTTPError as e:
              code = e.code; resp = {"error": e.read().decode("utf-8","replace")[:400]}
          print("POST /v13/deployments ->", code)
          if code not in (200, 201):
              print(json.dumps(resp)[:600])
              print("::error::Vercel rejected the deployment (http %s)" % code)
              sys.exit(1)
          url = resp.get("url") or "not reported"
          print("deployment:", url, "| state:", resp.get("readyState"), "| id:", resp.get("id"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("### Vercel deploy\n\n- commit: `%s`\n- url: %s\n- state: %s\n- files: %d (%.1f MB)\n"
                       % (os.environ.get("GITHUB_SHA","")[:8], url, resp.get("readyState"), len(items), total/1024/1024))
          PY

      - name: Wait for the deployment to go live
        run: |
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /tmp/live.html -w "%{http_code}" -m 15 https://arthasaar.vercel.app/ || echo 000)
            HAS=$(grep -c "openStock" /tmp/live.html 2>/dev/null || echo 0)
            FM3=$(grep -c "Has the model been right" /tmp/live.html 2>/dev/null || echo 0)
            echo "[$i] http=$CODE stockSheet=$HAS fm3Card=$FM3"
            if [ "$CODE" = "200" ] && [ "$HAS" -gt 0 ]; then
              echo "LIVE and current on arthasaar.vercel.app"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::deployment did not appear within 5 minutes"

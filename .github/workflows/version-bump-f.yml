name: version-bump-f
on: workflow_dispatch
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: bump version tag
        run: |
          python3 - << 'EOF'
          s = open("index.html", encoding="utf-8").read()
          old = "app.js?v=21sep26e"
          new = "app.js?v=21sep26f"
          assert s.count(old) == 1, "version tag not found exactly once"
          s = s.replace(old, new)
          open("index.html", "w", encoding="utf-8").write(s)
          print("version bumped to f")
          EOF
      - name: commit and push
        run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add index.html
          git commit -m "chore: version bump f (smart brain loader)" || echo "nothing to commit"
          for i in 1 2 3; do git push && break; git pull --rebase -X theirs || true; done

name: Market X-Ray Evening
on:
  schedule:
    - cron: '15 12 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  xray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 xray.py
      - run: |
          git config user.name "devrajai"
          git config user.email "devraj.resume@gmail.com"
          git add data/xray.json
          git commit -m "data: market xray evening" || echo "no change"
          git pull --rebase || true
          git push

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b1c">
<title>ArthaSaar — Blue Liquid App</title>
<meta name="description" content="ArthaSaar — free India-first market workspace. Stocks, mutual funds, SIPs, OI, FII/DII, crypto, global, news and IPO analysis (IpoBodh).">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{color:#eaf3ff;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:96px;
  background:radial-gradient(70vw 60vw at 18% -6%,rgba(60,140,255,.5),transparent 60%),radial-gradient(60vw 60vw at 92% 14%,rgba(130,80,255,.42),transparent 60%),radial-gradient(60vw 60vw at 50% 108%,rgba(45,212,191,.28),transparent 60%),#050b1c;background-attachment:fixed}
a{color:#8fc0ff;text-decoration:none}
.up{color:#3ee08d}.down{color:#ff6b7d}.mut{color:#9fb8d6}
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:13px 16px;background:rgba(8,18,42,.6);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border-bottom:1px solid rgba(120,180,255,.18)}
.logo{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,#4aa8ff,#7c5cff);box-shadow:0 8px 20px rgba(74,168,255,.4)}
.bar b{font-size:15.5px}.bar .grow{flex:1}
.icbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(120,180,255,.25);background:rgba(255,255,255,.06);color:#dbe9fb;cursor:pointer;font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.hero{border-radius:26px;padding:20px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#4aa8ff 0%,#7c5cff 55%,#ff6b9d 120%);box-shadow:0 20px 44px rgba(74,120,255,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.hero .lab{font-size:12px;opacity:.92;letter-spacing:.4px}
.hero .val{font-size:34px;font-weight:850;letter-spacing:-1px;margin:2px 0}
.hero .chg{font-weight:700;font-size:14px}
.hero .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hbtn{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:9px 15px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.hbtn.solid{background:#fff;color:#12325f;border-color:#fff}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}
.sec h2{font-size:16px;margin:0}
.sec a{font-size:12.5px;color:#8fc0ff;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{border-radius:20px;padding:14px;border:1px solid rgba(255,255,255,.16);cursor:pointer;position:relative;overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .12s}
.card:active{transform:scale(.98)}
.card .em{font-size:22px}.card b{display:block;font-size:14.5px;margin-top:8px}.card span{display:block;font-size:11.5px;opacity:.85;margin-top:2px}
.card .go{position:absolute;right:12px;top:12px;font-size:12px;opacity:.7}
.acc{border-radius:20px;border:1px solid rgba(120,180,255,.2);background:linear-gradient(160deg,rgba(30,60,120,.4),rgba(20,40,90,.3));backdrop-filter:blur(20px);margin-top:12px;overflow:hidden}
.acc .head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;font-weight:700}
.acc .body{display:none;padding:0 16px 14px}.acc.open .body{display:block}
.acc.open .head .arw{transform:rotate(180deg)}.acc .head .arw{transition:transform .2s}
.acc li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed rgba(120,180,255,.2);font-size:13px;list-style:none}
.acc ul{margin:0;padding:0}
.ai{border-radius:22px;border:1px solid rgba(120,180,255,.2);background:linear-gradient(160deg,rgba(40,70,140,.4),rgba(25,45,95,.3));backdrop-filter:blur(20px);margin-top:12px;padding:14px}
.ai .msgs{display:grid;gap:8px;margin-bottom:10px}
.msg{padding:9px 12px;border-radius:14px;font-size:13px;max-width:88%}
.msg.u{background:linear-gradient(135deg,#4aa8ff,#7c5cff);color:#fff;margin-left:auto}
.msg.b{background:rgba(255,255,255,.08);border:1px solid rgba(120,180,255,.2)}
.airow{display:flex;gap:8px}
.airow input{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(120,180,255,.25);border-radius:999px;padding:11px 14px;color:#eaf3ff;font:inherit}
.airow button{border:0;border-radius:999px;padding:11px 16px;background:linear-gradient(135deg,#4aa8ff,#7c5cff);color:#fff;font-weight:700;cursor:pointer}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;padding:8px 6px 12px;background:rgba(8,18,40,.75);backdrop-filter:blur(24px);border-top:1px solid rgba(120,180,255,.2)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:#9fc0e8;font:inherit;font-size:10.5px;cursor:pointer;padding:6px 12px;border-radius:14px}
.tab .ic{font-size:19px;line-height:1}.tab.on{color:#fff;background:linear-gradient(135deg,rgba(74,168,255,.4),rgba(124,92,255,.4))}
.sheet{position:fixed;inset:0;z-index:60;display:none}.sheet.on{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(3,8,20,.55);backdrop-filter:blur(6px)}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;top:34px;border-radius:26px 26px 0 0;overflow:auto;padding:18px;background:linear-gradient(160deg,rgba(16,32,64,.97),rgba(9,18,40,.99));border-top:1px solid rgba(120,180,255,.28);animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet .pn h3{margin:0 0 4px;font-size:19px}
.sheet .x{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(120,180,255,.3);background:rgba(255,255,255,.08);color:#fff;cursor:pointer}
.pnl{border-radius:18px;border:1px solid rgba(120,180,255,.2);background:rgba(255,255,255,.05);padding:14px;margin-top:12px}
.pnl h4{margin:0 0 10px;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:#9fb8d6}
.btn{border:1px solid rgba(255,255,255,.3);background:linear-gradient(135deg,#4aa8ff,#7c5cff);color:#fff;font-weight:700;border-radius:999px;padding:10px 16px;cursor:pointer;font-size:13px}
.btn.ghost{background:rgba(255,255,255,.08);border-color:rgba(120,180,255,.3)}
.btn.amber{background:linear-gradient(135deg,#ffb457,#ff6b7d)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed rgba(120,180,255,.18);font-size:13px}.li:last-child{border:0}
svg{display:block;width:100%;height:auto}
.sk{height:14px;border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.14),rgba(255,255,255,.06));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>

<header class="bar">
  <div class="logo">आ</div><b>ArthaSaar</b><div class="grow"></div>
  <div class="icbtn" onclick="openSheet('stocks')" title="Screener">🔍</div>
  <div class="icbtn" onclick="openIpo()" title="IPO · IpoBodh">🚀</div>
</header>

<div class="wrap">
  <div class="hero" id="hero">
    <div class="lab">NIFTY 50 · market</div>
    <div class="val" id="hVal">—</div>
    <div class="chg" id="hChg">loading…</div>
    <div class="row">
      <button class="hbtn solid" onclick="openSheet('stocks')">Screener</button>
      <button class="hbtn" onclick="openSheet('oi')">Option chain</button>
      <button class="hbtn" onclick="openSheet('radar')">Radar</button>
    </div>

  <div class="sec"><h2>Explore</h2><a onclick="openSheet('pro')">See all →</a></div>

  <div class="acc" id="radarAcc">
    <div class="head" onclick="document.getElementById('radarAcc').classList.toggle('open')"><span>📡 Radar system</span><span class="arw">▾</span></div>
    <div class="body" id="radarBody"><div class="sk" style="height:40px;margin:6px 0"></div></div>

</div>

<nav class="tabbar">
  <button class="tab on" onclick="openSheet('home')"><span class="ic">🏠</span>Home</button>
  <button class="tab" onclick="openSheet('stocks')"><span class="ic">📈</span>Markets</button>
  <button class="tab" onclick="openSheet('pro')"><span class="ic">🧰</span>Pro</button>
  <button class="tab" onclick="openSheet('radar')"><span class="ic">📡</span>Radar</button>
  <button class="tab" onclick="openSheet('learn')"><span class="ic">📚</span>Learn</button>
</nav>

<div class="sheet" id="sheet"><div class="bd" onclick="closeSheet()"></div><div class="pn"><div class="x" onclick="closeSheet()">✕</div><div id="sheetBody"></div></div></div>

<script>
"use strict";
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var BASE="data/";var C={};
function probeBase(){var cands=["data/","../data/","./","../../data/"];return cands.reduce(function(p,b){return p.then(function(ok){if(ok)return true;return fetch(b+"fii-dii.json",{cache:"no-store"}).then(function(r){if(r.ok){BASE=b;return true;}return false;}).catch(function(){return false;});});},Promise.resolve(false));}
function J(n){if(C[n]!==undefined)return Promise.resolve(C[n]);return fetch(BASE+n,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(n+" HTTP "+r.status);return r.json();}).then(function(d){C[n]=d;return d;});}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function nf(x,d){if(x==null||isNaN(x))return "—";return Number(x).toLocaleString("en-IN",{maximumFractionDigits:d==null?2:d});}
function sign(x,d){if(x==null||isNaN(x))return "—";return (x>0?"+":"")+nf(x,d==null?2:d)+"%";}
function cls(x){return x>0?"up":x<0?"down":"";}
function banner(m){var b=document.getElementById("saarBanner");if(!b){b=document.createElement("div");b.id="saarBanner";b.style.cssText="position:fixed;left:12px;right:12px;top:12px;z-index:9999;background:rgba(255,93,110,.96);color:#fff;padding:12px 14px;border-radius:14px;font:14px/1.45 sans-serif;box-shadow:0 12px 34px rgba(0,0,0,.45)";document.body.appendChild(b);}b.textContent=m;}
window.addEventListener("error",function(e){banner("Error: "+(e.message||"script error"));});

/* ---- real candlestick chart from candles.json (arrays) ---- */
function ema(v,p){var k=2/(p+1),e=v[0],o=[];for(var i=0;i<v.length;i++){e=i?v[i]*k+e*(1-k):v[i];o.push(e);}return o;}
function candleArr(O,H,L,Cl,V){var n=Cl.length;if(n<5)return "<div class='mut'>no data</div>";
 var w=720,ph=210,vh=46,pad=6,cw=(w-pad*2)/n;
 var hi=Math.max.apply(null,H),lo=Math.min.apply(null,L);
 var e20=ema(Cl,20),e50=ema(Cl,50);
 var rg=(hi-lo)||1,X=function(i){return pad+i*cw+cw/2;},Y=function(v){return 6+(hi-v)/rg*(ph-12);};
 var s='<svg viewBox="0 0 '+w+' '+(ph+vh+8)+'" style="height:250px">';
 for(var gy=0;gy<=4;gy++){var yy=6+gy*(ph-12)/4;s+='<line x1="0" y1="'+yy+'" x2="'+w+'" y2="'+yy+'" stroke="rgba(140,180,230,.14)"/>';}
 for(var i=0;i<n;i++){var up=Cl[i]>=O[i],col=up?'#3ee08d':'#ff6b7d';
  s+='<line x1="'+X(i)+'" y1="'+Y(H[i])+'" x2="'+X(i)+'" y2="'+Y(L[i])+'" stroke="'+col+'"/>';
  var y1=Y(Math.max(O[i],Cl[i])),y2=Y(Math.min(O[i],Cl[i]));
  s+='<rect x="'+(X(i)-cw*.3)+'" y="'+y1+'" width="'+(cw*.6)+'" height="'+Math.max(1,y2-y1)+'" fill="'+col+'" rx="1"/>';}
 s+='<polyline points="'+e20.map(function(v,i){return X(i)+','+Y(v);}).join(' ')+'" fill="none" stroke="#4aa8ff" stroke-width="1.7"/>';
 s+='<polyline points="'+e50.map(function(v,i){return X(i)+','+Y(v);}).join(' ')+'" fill="none" stroke="#ffb457" stroke-width="1.7"/>';
 if(V){var vmax=Math.max.apply(null,V)||1,vy=ph+6;for(var i=0;i<n;i++){var up=Cl[i]>=O[i],bh=V[i]/vmax*(vh-6);
  s+='<rect x="'+(X(i)-cw*.3)+'" y="'+(vy+vh-bh)+'" width="'+(cw*.6)+'" height="'+bh+'" fill="'+(up?'rgba(62,224,141,.55)':'rgba(255,107,125,.55)')+'" rx="1"/>';}}
 return s+'</svg>';}
function candlesFor(sym, tf){return J("candles.json").then(function(c){var s=(c.syms||{})[sym];if(!s)throw new Error("no candles");var d=s[tf]||s["1h"]||s["15m"];return candleArr(d.o,d.h,d.l,d.c,d.v);});}

/* ---- cards ---- */
var SECTIONS=[
 {id:"stocks",em:"📈",t:"Stocks",s:"2,288 · screener",g:"linear-gradient(135deg,#2a4d8f,#4aa8ff)"},
 {id:"mf",em:"💠",t:"Mutual Funds",s:"8,671 schemes",g:"linear-gradient(135deg,#6a3fb0,#a07cff)"},
 {id:"trading",em:"🎯",t:"Trading",s:"intraday · F&O",g:"linear-gradient(135deg,#a83a5b,#ff6b9d)"},
 {id:"oi",em:"⛓️",t:"OI & Volume",s:"walls · PCR",g:"linear-gradient(135deg,#0f7d8f,#31d0aa)"},
 {id:"crypto",em:"🪙",t:"Crypto",s:"BTC · ETH",g:"linear-gradient(135deg,#b8801f,#ffca5c)"},
 {id:"global",em:"🌍",t:"Global",s:"US · Asia · Europe",g:"linear-gradient(135deg,#2f6bff,#7c5cff)"},
 {id:"news",em:"📰",t:"News",s:"markets · economy",g:"linear-gradient(135deg,#8a5a2b,#ff9d3d)"},
 {id:"ai",em:"🤖",t:"AI Forecast",s:"ask anything",g:"linear-gradient(135deg,#4a2f8f,#ff6b9d)"},
 {id:"radar",em:"📡",t:"Radar",s:"accumulation",g:"linear-gradient(135deg,#1f7d6a,#3ee08d)"},
 {id:"pro",em:"🧭",t:"Pro Tools",s:"screener · backtest",g:"linear-gradient(135deg,#39406b,#8fa3ff)"},
 {id:"learn",em:"📚",t:"Learn",s:"beginner→advanced",g:"linear-gradient(135deg,#7a3fb0,#4aa8ff)"},
 {id:"ipo",em:"🚀",t:"IPO · IpoBodh",s:"open IpoBodh",g:"linear-gradient(135deg,#ff8a3d,#ff5f6d)"}
];
$("#grid").innerHTML=SECTIONS.map(function(c){return '<div class="card" style="background:'+c.g+'" onclick="openSheet(\''+c.id+'\')"><span class="go">›</span><div class="em">'+c.em+'</div><b>'+c.t+'</b><span>'+c.s+'</span></div>';}).join("");

/* ---- panels ---- */
function list(arr){return arr.map(function(x){return '<div class="li"><span>'+x[0]+'</span><b class="'+x[2]+'">'+x[1]+'</b></div>';}).join("");}
var PANELS={
 home:function(){return Promise.resolve("<h3>ArthaSaar</h3><p class='mut'>Your free India-first market workspace. Pick any card on the home screen to dive in.</p><div class='pnl'><h4>Sections</h4>"+list(SECTIONS.map(function(c){return [c.em+" "+c.t,c.s,""];}))+"</div>");},
 stocks:function(){return Promise.all([J("brain-screener.json"),candlesFor("NIFTY","1h")]).then(function(r){var st=r[0].stocks||[],ch=r[1];
   var g=st.slice().sort(function(a,b){return (b.change_pct||0)-(a.change_pct||0);});
   return "<h3>📈 Stocks</h3><div class='pnl'><h4>NIFTY 50 · candle + EMA20/50 + volume</h4>"+ch+"</div>"+
    "<div class='pnl'><h4>Top gainers</h4>"+list(g.slice(0,5).map(function(s){return [esc(s.symbol)+" · "+nf(s.price,1),sign(s.change_pct,1),cls(s.change_pct)];}))+"</div>"+
    "<div class='pnl'><h4>Top losers</h4>"+list(g.slice(-5).reverse().map(function(s){return [esc(s.symbol)+" · "+nf(s.price,1),sign(s.change_pct,1),cls(s.change_pct)];}))+"</div>"+
    "<div class='row'><button class='btn' onclick='openSheet(\"pro\")'>Screener &amp; tools</button></div>";});},
 mf:function(){return J("mf-top.json").then(function(t){var f=t.funds||[],n=t.nifty||{};
   return "<h3>💠 Mutual Funds</h3><div class='pnl'><h4>Top funds · trailing returns</h4>"+
    f.slice(0,10).map(function(x){return '<div class="li"><span>'+esc(x.n.split("·")[0].trim())+'</span><b>1y '+sign(x.r1,1)+' · 3y '+sign(x.r3,1)+'</b></div>';}).join("")+"</div>"+
    "<div class='pnl'><h4>Nifty 50 benchmark</h4>"+list([["1 year",sign(n.r1,1),cls(n.r1)],["3 years",sign(n.r3,1),cls(n.r3)],["5 years",sign(n.r5,1),cls(n.r5)]])+"</div>"+
    "<div class='row'><button class='btn' onclick='openSheet(\"invest\")'>SIP calculator</button></div>";});},
 invest:function(){return Promise.resolve("<h3>🪙 Invest · SIP</h3><div class='pnl'><h4>Monthly SIP → future value</h4>"+
   "<div class='row'><input id='sAmt' type='number' value='5000' style='max-width:120px;background:rgba(255,255,255,.07);border:1px solid rgba(120,180,255,.25);border-radius:12px;color:#fff;padding:10px'>"+
   "<input id='sYr' type='number' value='15' style='max-width:80px;background:rgba(255,255,255,.07);border:1px solid rgba(120,180,255,.25);border-radius:12px;color:#fff;padding:10px'>yrs"+
   "<input id='sR' type='number' value='12' style='max-width:80px;background:rgba(255,255,255,.07);border:1px solid rgba(120,180,255,.25);border-radius:12px;color:#fff;padding:10px'>%"+
   "<button class='btn' onclick='calcSip()'>Go</button></div><div id='sOut' style='margin-top:10px;font-weight:700'>—</div></div>"+
   "<div class='pnl'><h4>Also</h4>"+list([["Gold / silver SIP","₹10/day+",""],["Crypto SIP (BTC/ETH)","weekly",""],["Govt schemes (PPF/NPS/APY)","",""],["FD · bonds · REITs","",""]])+"</div>");},
 trading:function(){return J("futures.json").then(function(f){var idx=f.indices||[];
   return "<h3>🎯 Trading · F&O</h3><div class='pnl'><h4>Index futures · OI</h4>"+idx.map(function(i){var c0=(i.contracts||[])[0]||{};return '<div class="li"><span>'+esc(i.symbol)+'</span><b class="'+cls(c0.oi_chg)+'">'+nf(i.underlying,1)+' · OI '+nf(c0.oi_chg,0)+'</b></div>';}).join("")+"</div>"+
    "<div class='pnl'><h4>Stock futures OI change</h4>"+list((f.stocks||[]).slice().sort(function(a,b){return (b.oi_chg||0)-(a.oi_chg||0);}).slice(0,6).map(function(s){return [esc(s.symbol),nf(s.oi_chg,0),cls(s.oi_chg)];}))+"</div>"+
    "<div class='row'><button class='btn' onclick='openSheet(\"oi\")'>Option chain</button><button class='btn ghost' onclick='openSheet(\"pro\")'>Circuits</button></div>";});},
 oi:function(){return Promise.all([J("oi-gti.json"),J("delivery.json")]).then(function(r){var o=r[0].symbols||{},d=r[1].d||{},keys=Object.keys(o).slice(0,3);
   var ent=Object.entries(d).sort(function(a,b){return b[1]-a[1];}).slice(0,6);
   return "<h3>⛓️ OI &amp; Volume</h3>"+keys.map(function(k){var x=o[k];return "<div class='pnl'><h4>"+esc(k)+"</h4>"+list([["Put wall (support)",nf(x.put_wall,0),"up"],["Call wall (resistance)",nf(x.call_wall,0),"down"],["PCR",nf(x.pcr,2),""],["Max pain",nf(x.max_pain,0),""]])+"</div>";}).join("")+
    "<div class='pnl'><h4>Top delivery %</h4>"+list(ent.map(function(e){return [esc(e[0]),nf(e[1],1)+"%","up"];}))+"</div>";});},
 crypto:function(){return J("crypto.json").then(function(c){var t=c.top||[];
   return "<h3>🪙 Crypto</h3><div class='pnl'><h4>Market</h4>"+list([["Total mkt cap","$"+nf(c.global.total_market_cap_usd/1e12,2)+"T",""],["BTC dominance",nf(c.global.btc_dominance,1)+"%",""],["Fear &amp; Greed",nf(c.fear_greed.value,0)+" "+esc(c.fear_greed.label),""]])+"</div>"+
    "<div class='pnl'><h4>Top coins</h4>"+t.slice(0,10).map(function(x){return '<div class="li"><span>'+esc(x.symbol)+'</span><b class="'+cls(x.chg_24h_pct)+'">$'+nf(x.price_usd,x.price_usd<1?4:2)+' · '+sign(x.chg_24h_pct,1)+'</b></div>';}).join("")+"</div>";});},
 global:function(){return J("global.json").then(function(g){return "<h3>🌍 Global</h3><div class='pnl'><h4>World indices</h4>"+(g.items||[]).map(function(i){return '<div class="li"><span>'+esc(i.name)+'</span><b class="'+cls(i.chg_pct)+'">'+nf(i.price,2)+' · '+sign(i.chg_pct)+'</b></div>';}).join("")+"</div>";});},
 news:function(){return J("news.json").then(function(n){return "<h3>📰 News</h3><div class='pnl'><h4>Latest</h4>"+(n.items||[]).slice(0,14).map(function(i){return '<div class="li"><a href="'+esc(i.link)+'" target="_blank" rel="noopener">'+esc(i.title)+'</a><span class="mut">'+esc(i.publisher||"")+'</span></div>';}).join("")+"</div>";});},
 ai:function(){return Promise.all([J("smart-brain.json"),J("timesfm_forecasts.json")]).then(function(r){var g=r[0].guess||{},mv=r[1].movers||[];
   return "<h3>🤖 AI Forecast</h3><div class='pnl'><h4>Model read today</h4><div class='li'><span>Verdict</span><b>"+esc(g.verdict||"—")+" ("+nf(g.score,0)+")</b></div>"+(g.points||[]).map(function(p){return '<div class="li"><span class="mut">•</span><span>'+esc(p)+'</span></div>';}).join("")+"</div>"+
    "<div class='pnl'><h4>Biggest expected moves (model)</h4>"+mv.slice(0,8).map(function(m){return '<div class="li"><span>'+esc(m.name)+'</span><b class="'+cls(m.median)+'">'+sign(m.median,1)+' <span class="mut">±'+nf(m.band,0)+'%</span></b></div>';}).join("")+"</div><p class='mut' style='font-size:11.5px'>Statistical, not a promise.</p>";});},
 radar:function(){return J("radar.json").then(function(r){
   return "<h3>📡 Radar system</h3>"+
    "<div class='pnl'><h4>Accumulation (delivery-led)</h4>"+list((r.accumulation||[]).slice(0,8).map(function(x){return [esc(x.sym)+" · deliv "+nf(x.deliv,1)+"%",nf(x.close,1),"up"];}))+"</div>"+
    "<div class='pnl'><h4>Hidden selling</h4>"+list((r.hidden_selling||[]).slice(0,8).map(function(x){return [esc(x.sym)+" · deliv "+nf(x.deliv,1)+"%",sign(x.chg,1),cls(x.chg)];}))+"</div>"+
    "<div class='pnl'><h4>Volume blast</h4>"+list((r.volume_blast||[]).slice(0,8).map(function(x){return [esc(x.sym),nf(x.close,1),"up"];}))+"</div>";});},
 pro:function(){return Promise.all([J("forda.json"),J("circuits.json"),J("bigplayer.json")]).then(function(r){var f=r[0],c=r[1],b=r[2];
   return "<h3>🧭 Pro Tools</h3><div class='pnl'><h4>F&amp;O read</h4>"+list([["PCR",nf(f.pcr,2),""],["Max pain",nf(f.max_pain,0),""],["Basis",nf(f.basis,1)+" ("+nf(f.basis_pct,2)+"%)",cls(f.basis)],["India VIX",nf(f.vix,2),""],["Nifty P/E",nf(f.nifty_pe,2),""]])+"</div>"+

    "<div class='pnl'><h4>Bulk deals</h4>"+list((b.bulk||[]).slice(0,6).map(function(x){return [esc(x.s)+" · "+nf(x.t,1)+" Cr","",""];}))+"</div>";});},
 learn:function(){return J("learn-content.json").then(function(l){
   return "<h3>📚 Learn</h3><div class='pnl'><h4>Levels</h4>"+list(Object.keys(l.levels||{}).map(function(k){return [k.charAt(0).toUpperCase()+k.slice(1),(l.levels[k]||[]).length+" tips",""];}))+"</div>"+
    "<div class='pnl'><h4>Quick tips</h4>"+list((l.quick_tips||[]).slice(0,6).map(function(t){return [esc(t),"",""];}))+"</div>"+
    "<div class='pnl'><h4>Glossary</h4>"+list((l.glossary||[]).slice(0,6).map(function(x){return [esc(x.term),esc((x.meaning||"").slice(0,40))+"…",""];}))+"</div>";});},
 ipo:function(){return Promise.resolve("<h3>🚀 IPO · IpoBodh</h3><div class='pnl'><h4>IPO analysis lives on IpoBodh</h4><p class='mut'>GMP, subscription, RHP, allotment odds and the listing-day playbook.</p></div><div class='row'><button class='btn amber' onclick='openIpo()'>Open IpoBodh →</button></div>");}
};
function openSheet(id){
  var fn=PANELS[id]; if(!fn) return;
  $("#sheetBody").innerHTML="<h3>"+esc(id)+"</h3><div class='sk' style='height:60px;margin-top:10px'></div><div class='sk' style='height:120px;margin-top:10px'></div>";
  $("#sheet").classList.add("on");
  fn().then(function(html){ $("#sheetBody").innerHTML=html; }).catch(function(e){ $("#sheetBody").innerHTML="<h3>"+esc(id)+"</h3><div class='pnl'><p class='down'>Could not load: "+esc(e.message)+"</p><p class='mut'>Check your connection and try again.</p></div>"; });
}
function closeSheet(){ $("#sheet").classList.remove("on"); }
function openIpo(){ window.open("https://devrajai.github.io/IpoBodh/","_blank","noopener"); }
function calcSip(){ var a=+$("#sAmt").value,y=+$("#sYr").value,r=+$("#sR").value,i=r/100/12,n=y*12; var fv= i? a*((Math.pow(1+i,n)-1)/i)*(1+i) : a*n; $("#sOut").innerHTML="Invested ₹"+nf(a*12*y,0)+" → <span class='up'>₹"+nf(fv,0)+"</span>"; }
window.openSheet=openSheet;window.closeSheet=closeSheet;window.openIpo=openIpo;window.calcSip=calcSip;

/* ---- ai chat (uses loaded data) ---- */
var aiN=0;
function aiSend(){ var inp=$("#aiIn"),q=(inp.value||"").trim(); if(!q)return;
  $("#msgs").innerHTML+='<div class="msg u">'+esc(q)+'</div>'; inp.value="";
  var ans="Here's what today's EOD data says: "+ (window.__aiBase||"load the dashboard for live numbers.");
  setTimeout(function(){ $("#msgs").innerHTML+='<div class="msg b">'+esc(ans)+'</div>'; },300);
}
window.aiSend=aiSend;

/* ---- boot ---- */
(async function(){
  await probeBase();
  try{
    var r=await Promise.all([J("indices-all.json"),J("fii-dii.json"),J("smart-brain.json")]);
    var idx=r[0].indices||[], fii=r[1], sm=r[2];
    var n=idx.find(function(i){return i.index==="NIFTY 50";})||idx[0]||{};
    $("#hVal").textContent=nf(n.price,2);
    $("#hChg").innerHTML='<span class="'+(n.change_pct>0?"":"")+'">'+(n.change_pct>0?"▲":"▼")+' '+sign(n.change_pct)+' ('+nf(n.change,2)+')</span>';
    var cats=fii.categories||{},fnet=cats["FII/FPI"]?cats["FII/FPI"].net_cr:null;
    var guess=sm.guess||{};
    window.__aiBase="Nifty "+nf(n.price,2)+" ("+sign(n.change_pct)+"), FII net ₹"+nf(fnet,0)+" Cr, model verdict: "+(guess.verdict||"—")+".";
  }catch(e){ banner("Could not load market data. Check your connection and reload."); }
  try{
    var rad=await J("radar.json");
    var acc=(rad.accumulation||[]).slice(0,5).map(function(x){return '<li><span>Accumulation</span><b class="up">'+esc(x.sym)+' · '+nf(x.deliv,1)+'%</b></li>';}).join("");
    var hs=(rad.hidden_selling||[]).slice(0,3).map(function(x){return '<li><span>Hidden selling</span><b class="down">'+esc(x.sym)+' · '+sign(x.chg,1)+'</b></li>';}).join("");
    $("#radarBody").innerHTML="<ul>"+acc+hs+'</ul><div class="row"><button class="btn ghost" onclick="openSheet(\'radar\')">Open full radar</button></div>';
  }catch(e){ $("#radarBody").innerHTML="<p class='mut'>Radar unavailable.</p>"; }
})();
</script>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MB diag</title></head>
<body style="font:13px/1.5 monospace;background:#0b0d12;color:#cdd3e0;padding:12px">
<pre id="r">start</pre>
<script>
var files = ["oldapp.js","scrfix.js","scrfix2.js","aifix.js","aifix2.js","aifix3.js","mbpatch.js","dtfix.js","brandfix.js","tools.js","tools1b.js","tools2.js","tools3.js","tools4.js","tools5.js","learnfix.js","stagefix.js","guidefix.js","guide2.js","deskfix.js","bluefix2.js","inputfix.js","smart.js","mft.js","learnadd.js","style.css","index.html"];
var pre = document.getElementById("r");
var done = 0;
files.forEach(function (f) {
  fetch(f + "?t=" + Date.now()).then(function (r) {
    return r.text().then(function (t) {
      pre.textContent += "\n" + f + " | " + r.status + " | " + t.length + "b" + (t.length === 0 ? " | EMPTY!!" : " | ok");
    });
  }).catch(function (e) {
    pre.textContent += "\n" + f + " | FETCH-FAIL | " + String(e).slice(0, 60);
  }).then(function () {
    done++;
    if (done === files.length) { pre.textContent += "\nDIAG-DONE"; document.title = "DIAG-DONE"; }
  });
});
</script></body></html>

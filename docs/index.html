<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArthaSaar — market data</title>
<meta name="theme-color" content="#22252a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#22252a;--card:#2b2f36;--card2:#353a42;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.2);
  --ink:#eef1f6;--dim:#aab1bc;--dimmer:#7f8794;
  --accent:#6ea8fe;--accent-dim:rgba(110,168,254,.16);
  --up:#4fc98a;--down:#ea6b62;
  --sans:"Figtree",system-ui,-apple-system,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  --u:clamp(1px, 0.2326vw, 2.3px);
}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:calc(15.5 * var(--u));
  line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 420px at 85% -8%,rgba(110,168,254,.13),transparent 62%)}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.up{color:var(--up)}.down{color:var(--down)}.flat,.dim{color:var(--dim)}
.wrap{max-width:min(100%, calc(430 * var(--u)));margin:0 auto;padding:0 calc(12 * var(--u))}

/* bar */
.bar{position:sticky;top:0;z-index:50;background:rgba(35,38,44,.98);backdrop-filter:blur(16px)}
.brow{display:flex;align-items:center;gap:calc(10 * var(--u));padding:0 calc(14 * var(--u));
  height:calc(64 * var(--u));max-width:min(100%, calc(430 * var(--u)));margin:0 auto}
.brand{margin-right:auto}
.nhero b{display:block;font-size:clamp(13px,1.7vw,17px);font-weight:700}
.nhero span{display:block;margin-top:calc(3 * var(--u));font-size:clamp(11px,1.35vw,13px);color:var(--dim);line-height:1.45}
.ico{width:calc(32 * var(--u));height:calc(28 * var(--u));border:calc(1 * var(--u)) solid var(--line2);
  background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;justify-content:center;
  align-items:center;gap:calc(4 * var(--u));border-radius:calc(7 * var(--u))}
.ico span{display:block;width:calc(12 * var(--u));height:calc(1.5 * var(--u));background:var(--ink)}
.brand{display:flex;align-items:center;gap:calc(7 * var(--u));font-size:calc(15 * var(--u));font-weight:600}
.brand i{width:calc(8 * var(--u));height:calc(8 * var(--u));border-radius:calc(2 * var(--u));background:var(--accent)}
.date{margin-left:auto;font:500 calc(9 * var(--u))/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);border:calc(1 * var(--u)) solid var(--line);border-radius:999px;padding:calc(5 * var(--u)) calc(8 * var(--u));white-space:nowrap}
.newsbtn{display:flex;align-items:center;gap:calc(6 * var(--u));background:var(--accent);color:#0f1720;border:0;
  border-radius:999px;padding:calc(7 * var(--u)) calc(11 * var(--u));cursor:pointer;
  font:600 calc(10 * var(--u))/1 var(--sans);letter-spacing:.06em;text-transform:uppercase}
.newsbtn b{font:600 calc(9 * var(--u))/1 var(--mono);background:rgba(0,0,0,.18);border-radius:999px;padding:calc(2 * var(--u)) calc(5 * var(--u))}

/* content */
main{padding:calc(12 * var(--u)) 0 calc(40 * var(--u))}
.card{background:var(--card);border:calc(1 * var(--u)) solid var(--line);border-radius:calc(16 * var(--u));
  padding:calc(15 * var(--u));margin-bottom:calc(11 * var(--u));min-width:0}
.ch{display:flex;align-items:baseline;gap:calc(8 * var(--u));margin-bottom:calc(10 * var(--u));flex-wrap:wrap}
.ch h1,.ch h2{margin:0;font-size:calc(17 * var(--u));font-weight:600;letter-spacing:-.015em}
.ch .tag{margin-left:auto;font:500 calc(9.5 * var(--u))/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--dimmer);border:calc(1 * var(--u)) solid var(--line);border-radius:999px;padding:calc(4 * var(--u)) calc(7 * var(--u))}
.note{margin:calc(10 * var(--u)) 0 0;font:400 calc(11 * var(--u))/1.6 var(--mono);color:var(--dim)}
.hero .lab{font:500 calc(9 * var(--u))/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dimmer)}
.hero .big{font-size:calc(44 * var(--u));font-weight:700;letter-spacing:-.045em;line-height:1;margin-top:calc(6 * var(--u));
  font-variant-numeric:tabular-nums}
.hero .row1{display:flex;align-items:baseline;gap:calc(10 * var(--u))}
.chip{font:500 calc(12 * var(--u))/1 var(--mono);padding:calc(5 * var(--u)) calc(7 * var(--u));border-radius:calc(7 * var(--u))}
.chip.up{background:rgba(79,201,138,.16)}.chip.down{background:rgba(234,107,98,.16)}
.hmeta{margin-top:calc(8 * var(--u));font:400 calc(11 * var(--u))/1.6 var(--mono);color:var(--dim)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:calc(8 * var(--u));margin-top:calc(12 * var(--u))}
.tiles>div{background:var(--card2);border-radius:calc(11 * var(--u));padding:calc(10 * var(--u))}
.tiles span{display:block;font:500 calc(9 * var(--u))/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.tiles b span{font:inherit;letter-spacing:inherit}
.tiles b{display:block;font:700 calc(18 * var(--u))/1.2 var(--sans);margin-top:calc(6 * var(--u));font-variant-numeric:tabular-nums}
.tiles i{display:block;font:400 calc(9.5 * var(--u))/1.35 var(--mono);font-style:normal;color:var(--dimmer);margin-top:calc(4 * var(--u))}
svg.spark{display:block;width:100%;height:calc(70 * var(--u));margin-top:calc(12 * var(--u))}

/* tables */
.tbar{display:flex;align-items:center;gap:calc(8 * var(--u));margin-bottom:calc(8 * var(--u))}
.q{flex:1;min-width:0;background:var(--card2);border:calc(1 * var(--u)) solid var(--line);border-radius:calc(10 * var(--u));
  padding:calc(9 * var(--u)) calc(11 * var(--u));color:var(--ink);font:400 calc(13 * var(--u))/1.3 var(--sans);outline:none}
.q::placeholder{color:var(--dimmer)}
.cnt{font:500 calc(10 * var(--u))/1 var(--mono);color:var(--dimmer);white-space:nowrap}
.tbl{overflow-x:auto;border-top:calc(1 * var(--u)) solid var(--line2)}
table{width:100%;min-width:max-content;border-collapse:collapse;font-size:clamp(11px, 1.5vw, 15px)}
th{position:sticky;top:0;background:var(--card);text-align:left;font:500 clamp(9px, 1.15vw, 12px)/1 var(--mono);
  letter-spacing:.08em;text-transform:uppercase;color:var(--dimmer);padding:calc(9 * var(--u)) calc(8 * var(--u));
  border-bottom:calc(1 * var(--u)) solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
th.r{text-align:right}
th:hover{color:var(--ink)}
td{padding:calc(9 * var(--u)) calc(8 * var(--u));border-bottom:calc(1 * var(--u)) solid var(--line);
  vertical-align:top;overflow-wrap:anywhere}
td.r{text-align:right;font-family:var(--mono);font-size:clamp(10px, 1.35vw, 13.5px);white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:rgba(255,255,255,.03)}
.more{display:block;width:100%;margin-top:calc(10 * var(--u));background:var(--card2);border:calc(1 * var(--u)) solid var(--line2);
  color:var(--accent);border-radius:calc(10 * var(--u));padding:calc(10 * var(--u));cursor:pointer;font:600 calc(12 * var(--u))/1 var(--sans)}
.empty{color:var(--dim);font-size:calc(13.5 * var(--u));padding:calc(20 * var(--u)) 0;text-align:center}
.err{color:var(--down);font-size:calc(13 * var(--u))}

/* drawer */
.drawer{position:fixed;top:0;left:0;bottom:0;width:calc(322 * var(--u));max-width:86%;background:#20242a;
  border-right:calc(1 * var(--u)) solid var(--line2);z-index:80;transform:translateX(-100%);
  transition:transform .24s ease;overflow-y:auto;padding-bottom:calc(30 * var(--u))}
.drawer.on{transform:translateX(0)}
.dh{display:flex;align-items:center;gap:calc(10 * var(--u));padding:calc(16 * var(--u));
  border-bottom:calc(1 * var(--u)) solid var(--line2);position:sticky;top:0;background:#20242a}
.dh .as{width:calc(30 * var(--u));height:calc(30 * var(--u));border-radius:calc(8 * var(--u));background:var(--accent-dim);
  color:var(--accent);display:grid;place-items:center;font:600 calc(10 * var(--u))/1 var(--mono)}
.dh b{font-size:calc(14 * var(--u));font-weight:600}
.dh button{margin-left:auto;background:none;border:0;color:var(--ink);font-size:calc(20 * var(--u));cursor:pointer}
.dg{padding:calc(12 * var(--u)) calc(16 * var(--u)) calc(4 * var(--u))}
.dg h4{margin:0 0 calc(2 * var(--u));font:600 calc(9.5 * var(--u))/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer)}
.dg a{display:block;padding:calc(10 * var(--u)) 0;font-size:calc(15 * var(--u));color:#e7ecdf;
  border-bottom:calc(1 * var(--u)) solid rgba(255,255,255,.05)}
.dg a.on{color:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:.2s;z-index:75}
.scrim.on{opacity:1;pointer-events:auto}
.loading{color:var(--dim);font:400 calc(12 * var(--u))/1.6 var(--mono);padding:calc(16 * var(--u)) 0}

/* ---------- news screen ---------- */
.ntabs2{display:flex;gap:calc(8 * var(--u));margin-bottom:calc(11 * var(--u))}
.ntabs2 button{flex:1;background:var(--card);border:calc(1 * var(--u)) solid var(--line);color:var(--dim);
  border-radius:calc(11 * var(--u));padding:calc(11 * var(--u)) calc(8 * var(--u));cursor:pointer;
  font:600 clamp(11px,1.45vw,15px)/1 var(--sans)}
.ntabs2 button.on{background:var(--accent-dim);border-color:rgba(110,168,254,.45);color:var(--accent)}
.npane{display:none}.npane.on{display:block}
.nic{flex:0 0 auto;width:calc(40 * var(--u));height:calc(40 * var(--u));border-radius:calc(11 * var(--u));
  display:grid;place-items:center;background:var(--accent-dim);color:var(--accent)}
.nic svg{width:calc(20 * var(--u));height:calc(20 * var(--u));fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nsearch{display:flex;align-items:center;gap:calc(8 * var(--u));background:var(--card);
  border:calc(1 * var(--u)) solid var(--line);border-radius:calc(11 * var(--u));
  padding:calc(10 * var(--u)) calc(12 * var(--u));margin-bottom:calc(10 * var(--u));color:var(--dimmer)}
.nsearch svg{width:calc(15 * var(--u));height:calc(15 * var(--u));fill:none;stroke:currentColor;stroke-width:1.8;flex:0 0 auto}
.nsearch input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);
  font:400 clamp(11.5px,1.45vw,14px)/1.3 var(--sans)}
.nsearch input::placeholder{color:var(--dimmer)}
.nchips{display:flex;gap:calc(7 * var(--u));margin-bottom:calc(11 * var(--u));overflow-x:auto;scrollbar-width:none}
.nchips::-webkit-scrollbar{display:none}
.nchips button{flex:0 0 auto;display:inline-flex;align-items:center;gap:calc(6 * var(--u));background:var(--card);
  border:calc(1 * var(--u)) solid var(--line);color:var(--dim);border-radius:999px;
  padding:calc(8 * var(--u)) calc(12 * var(--u));font:500 clamp(10.5px,1.3vw,12.5px)/1 var(--sans);cursor:pointer}
.nchips button.on{background:var(--accent-dim);border-color:rgba(110,168,254,.45);color:var(--accent)}
.d{width:calc(7 * var(--u));height:calc(7 * var(--u));border-radius:50%;display:inline-block;flex:0 0 auto}
.d.blue{background:#6ea8fe}.d.green{background:#4fc98a}.d.red{background:#ea6b62}.d.amber{background:#e2b04a}
.nchips{flex-wrap:wrap}
.nchips button:disabled{opacity:.38;cursor:default}
.nchips button:disabled:hover{border-color:var(--line)}
.nreset{background:var(--accent-dim);border:calc(1 * var(--u)) solid rgba(110,168,254,.45);
  color:var(--accent);border-radius:999px;padding:calc(7 * var(--u)) calc(13 * var(--u));
  font:600 clamp(10.5px,1.3vw,12.5px)/1 var(--sans);cursor:pointer;margin-left:calc(4 * var(--u))}
.nlist{list-style:none;margin:0;padding:0}
.nlist li{background:var(--card);border:calc(1 * var(--u)) solid var(--line);border-radius:calc(12 * var(--u));
  padding:calc(12 * var(--u));margin-bottom:calc(8 * var(--u))}
.nlist .ns{display:block;font:500 clamp(9px,1.15vw,10.5px)/1 var(--mono);letter-spacing:.08em;
  text-transform:uppercase;color:var(--dimmer);margin-bottom:calc(6 * var(--u))}
.nlist .nt{font-size:clamp(12px,1.55vw,14.5px);line-height:1.45;color:var(--ink)}
.nempty{text-align:center;color:var(--dim);font-size:clamp(12px,1.5vw,14px);padding:calc(28 * var(--u)) 0}
.nrange{display:flex;gap:calc(6 * var(--u));margin-bottom:calc(10 * var(--u))}
.nrange button{flex:1;background:var(--card);border:calc(1 * var(--u)) solid var(--line);color:var(--dim);
  border-radius:calc(9 * var(--u));padding:calc(9 * var(--u)) calc(3 * var(--u));
  font:500 clamp(9.5px,1.2vw,11.5px)/1 var(--sans);cursor:pointer}
.nrange button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.nsum{display:flex;align-items:baseline;gap:calc(10 * var(--u));font-size:clamp(11px,1.35vw,13px);
  color:var(--dim);margin-bottom:calc(10 * var(--u))}
.nsum b{color:var(--ink);font-weight:600}
.nsum button{margin-left:auto;background:none;border:0;color:var(--accent);
  font:600 clamp(10.5px,1.3vw,12.5px)/1 var(--sans);cursor:pointer}
.nac details{background:var(--card);border:calc(1 * var(--u)) solid var(--line);border-radius:calc(13 * var(--u));
  margin-bottom:calc(9 * var(--u));overflow:hidden}
.nac summary{list-style:none;display:flex;align-items:center;gap:calc(9 * var(--u));padding:calc(12 * var(--u));
  cursor:pointer;font:600 clamp(11.5px,1.45vw,14px)/1 var(--sans)}
.nac summary::-webkit-details-marker{display:none}
.nac summary em{margin-left:auto;font-style:normal;font:500 clamp(9.5px,1.2vw,11px)/1 var(--mono);
  color:var(--dimmer);border:calc(1 * var(--u)) solid var(--line);border-radius:999px;
  padding:calc(3 * var(--u)) calc(7 * var(--u))}
.nac ul{list-style:none;margin:0;padding:0 calc(12 * var(--u)) calc(6 * var(--u))}
.nac li{display:flex;align-items:baseline;gap:calc(10 * var(--u));padding:calc(9 * var(--u)) 0;
  border-top:calc(1 * var(--u)) solid var(--line);font-size:clamp(11px,1.4vw,13.5px)}
.nac li b{font-weight:600;min-width:calc(90 * var(--u))}
.nac li span{flex:1;min-width:0;color:var(--dim);font-size:clamp(10px,1.3vw,12.5px);line-height:1.35}
.nac li i{font-style:normal;font:500 clamp(9.5px,1.2vw,11.5px)/1 var(--mono);color:var(--dimmer);white-space:nowrap}

/* ---------- stock sheet: tap a symbol anywhere and the whole picture opens ---------- */
#sheet{position:fixed;inset:0;z-index:60;display:none;background:var(--bg)}
#sheet.on{display:block}
#sheetBox{width:100%;height:100%;overflow:auto;background:var(--bg);
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
  position:relative;-webkit-overflow-scrolling:touch}
@media(min-width:820px){#sheetBox{max-width:760px;margin:0 auto}}
/* heat map: one tile per sector, colour and depth carry the size of the move */
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.heat a{display:block;text-decoration:none;color:inherit;border-radius:9px;padding:9px 8px;
  border:1px solid rgba(255,255,255,.08);min-height:62px;cursor:pointer}
.heat b{display:block;font-size:11px;font-weight:600;line-height:1.25;opacity:.95;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.heat i{display:block;font-style:normal;font-size:14px;font-weight:700;margin-top:5px;
  font-variant-numeric:tabular-nums}
.heat .up{background:rgba(78,201,160,.16);border-color:rgba(78,201,160,.34)}
.heat .dn{background:rgba(240,115,106,.16);border-color:rgba(240,115,106,.34)}
.heat .up.hot{background:rgba(78,201,160,.34);border-color:rgba(78,201,160,.55)}
.heat .dn.hot{background:rgba(240,115,106,.34);border-color:rgba(240,115,106,.55)}
.heat .flat{background:rgba(255,255,255,.05)}
#sheetBox h3{margin:0 0 2px;font-size:19px;letter-spacing:-.3px;padding-right:46px;line-height:1.3}
#sheetBox .sub{font-size:12px;opacity:.6;margin-bottom:14px}
#sheetBox .x{position:absolute;right:10px;top:8px;background:var(--bg);border:0;
  color:inherit;font-size:26px;line-height:1;opacity:.55;cursor:pointer;
  width:34px;height:34px;border-radius:9px;z-index:2}
#sheetBox .px{font-size:32px;font-weight:700;letter-spacing:-1px;margin:2px 0 4px}
#sheetBox .up{color:#4ec9a0}#sheetBox .dn{color:#f0736a}
#sheetBox h5{margin:16px 0 7px;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;opacity:.55}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.07);
  border-radius:10px;overflow:hidden}
.kv>div{background:var(--card);padding:9px 11px;display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.kv span:first-child{opacity:.6}
#sheetBox .kv span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
#sheetBox .na{opacity:.35}
td.sym{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;
  text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.3)}
</style>
</head>
<body>
<header class="bar">
  <div class="brow">
    <button class="ico" id="menuBtn" aria-label="Sections"><span></span><span></span><span></span></button>

<div id="sheet" aria-hidden="true"><div id="sheetBox"><button class="x" id="sheetX" aria-label="Close">&times;</button><div id="sheetBody"></div></div></div>

const cache = {};
async function J(p){
  if (cache[p]) return cache[p];
  const r = await fetch(p, {cache:'no-store'});
  if (!r.ok) throw new Error(p + ' → HTTP ' + r.status);
  const txt = await r.text();
  let d;
  try { d = JSON.parse(txt); }
  catch (_) {
    // some pipeline files carry NaN / Infinity, which JSON.parse refuses
    d = JSON.parse(txt.replace(/([:\[,]\s*)(-?Infinity|NaN)\b/g, '$1null'));
  }
  cache[p] = d;
  return d;
}
const unesc = s => String(s).replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
const dshort = iso => { const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; const p=String(iso).split('-'); return p.length===3 ? (parseInt(p[2],10)+' '+M[parseInt(p[1],10)-1]+' '+p[0].slice(2)) : iso; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function num(v, d){
  if (v === null || v === undefined || v === '') return '—';
  const n = Number(v);
  if (!isFinite(n)) return esc(v);
  d = (d === undefined) ? (Math.abs(n) >= 100 ? 2 : 2) : d;
  return n.toLocaleString('en-IN', {minimumFractionDigits:d, maximumFractionDigits:d});
}
function pct(v, d){
  if (v === null || v === undefined || v === '') return '—';
  const n = Number(v);
  if (!isFinite(n)) return esc(v);
  const c = n > 0 ? 'up' : (n < 0 ? 'down' : 'flat');
  const s = n > 0 ? '+' : (n < 0 ? '−' : '');
  return '<span class="' + c + '">' + s + Math.abs(n).toFixed(d === undefined ? 2 : d) + '%</span>';
}
function label(k){
  return String(k).replace(/[_-]/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2')
    .replace(/\b\w/g, c => c.toUpperCase());
}
function isNum(v){ return typeof v === 'number' || (typeof v === 'string' && v !== '' && isFinite(v)); }
function cellHTML(v){
  if (v === null || v === undefined || v === '') return '—';
  if (typeof v === 'object') return esc(JSON.stringify(v).slice(0, 80));
  if (typeof v === 'boolean') return v ? 'yes' : 'no';
  if (isNum(v)) {
    const n = Number(v);
    if (Math.abs(n) >= 1000) return num(n, 2);
    return String(v);
  }
  return esc(v);
}

/* ---------- generic table ---------- */
function makeTable(records, cols, opt){
  opt = opt || {};
  const wrap = document.createElement('div');
  const bar = document.createElement('div'); bar.className = 'tbar';
  const q = document.createElement('input'); q.className = 'q';
  q.placeholder = opt.placeholder || 'Search…';
  const cnt = document.createElement('span'); cnt.className = 'cnt';
  // a three-row table does not need a search box; leaving one in is noise
  if (opt.noSearch) bar.append(cnt); else bar.append(q, cnt);
  wrap.append(bar);
  const tblBox = document.createElement('div'); tblBox.className = 'tbl'; wrap.append(tblBox);

  let limit = opt.limit || 120, sortKey = null, dir = 1, term = '';

  function rowsFiltered(){
    let rs = records;
    if (term){
      rs = rs.filter(r => JSON.stringify(r).toLowerCase().includes(term));
    }
    if (sortKey){
      rs = rs.slice().sort((a,b) => {
        const x = a[sortKey], y = b[sortKey];
        const nx = Number(x), ny = Number(y);
        if (isFinite(nx) && isFinite(ny)) return (nx - ny) * dir;
        return String(x).localeCompare(String(y)) * dir;
      });
    }
    return rs;
  }
  function draw(){
    const rs = rowsFiltered();
    cnt.textContent = rs.length.toLocaleString('en-IN') + ' rows';
    const t = document.createElement('table');
    const thead = document.createElement('thead'); const tr = document.createElement('tr');
    cols.forEach(c => {
      const th = document.createElement('th');
      th.textContent = c.label;
      if (c.r) th.className = 'r';
      th.onclick = () => { if (sortKey === c.k) dir = -dir; else { sortKey = c.k; dir = 1; } draw(); };
      tr.append(th);
    });
    thead.append(tr); t.append(thead);
    const tb = document.createElement('tbody');
    rs.slice(0, limit).forEach(r => {
      const row = document.createElement('tr');
      if (opt.onRow){ row.style.cursor = 'pointer'; row.title = 'Tap for the full detail';
        row.onclick = (ev) => { if (ev.target.closest('a')) return; opt.onRow(r); }; }
      cols.forEach(c => {
        const td = document.createElement('td');
        if (c.r) td.className = 'r';
        td.innerHTML = c.html ? c.html(r[c.k], r) : cellHTML(r[c.k]);
        row.append(td);
      });
      tb.append(row);
    });
    t.append(tb);
    tblBox.innerHTML = '';
    tblBox.append(t);
    if (!rs.length){
      const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'No rows match that search.';
      tblBox.append(p);
    }
    if (rs.length > limit){
      const b = document.createElement('button'); b.className = 'more';
      b.textContent = 'Show ' + Math.min(200, rs.length - limit) + ' more of ' + rs.length.toLocaleString('en-IN');
      b.onclick = () => { limit += 200; draw(); };
      wrap.append(b);
    } else {
      const old = wrap.querySelector('.more'); if (old) old.remove();
    }
  }
  q.oninput = () => { term = q.value.trim().toLowerCase(); limit = opt.limit || 120; draw(); };
  draw();
  return wrap;
}

/* ---------- helpers ---------- */
/* Cards used to end with the source filename and a repeated disclaimer:
   "stocks.json . fundamentals.json. Prices and fundamentals can be delayed, wrong or missing.
   Not a recommendation." Every card said it, so none of it was read, and it pushed the actual
   content up the page.

   The filename and the standing caveats are stripped here rather than at fifty call sites. What
   survives is the part that explains something specific to that card - "colour is the size of the
   move", "a z-score is not a signal" - and a card whose note was only boilerplate now has none. */
const NOTE_BOILER = [
  /\b[\w-]+\.json\b/gi,
  /Prices and fundamentals can be delayed,? wrong or missing\.?/gi,
  /Values can be delayed,? wrong or missing\.?/gi,
  /can be delayed,? wrong or missing\.?/gi,
  /[Ff]ree-source (closes|prices|data)[^.]*\.?/gi,
  /[Nn]ot a recommendation( to buy or sell)?\.?/gi,
  /[Nn]ot MCX tick data\.?/gi,
  // the flourishes that sat beside the filename and said nothing
  /every session the pipeline holds\.?/gi,
  /A long line flatters nothing:?\s*the same chart shows the falls\.?/gi,
  /from the exchange\.?/gi,
  /\u00b7\s*delayed\b\.?/gi,
  /\u00b7\s*from the feed\b\.?/gi
];
function cleanNote(note){
  if (!note) return '';
  let t = String(note);
  NOTE_BOILER.forEach(rx => { t = t.replace(rx, ' '); });
  // tidy what the removals leave behind
  t = t.replace(/\s*·\s*(?=·|$)/g, ' ');
  t = t.replace(/(·\s*){2,}/g, '· ');
  t = t.replace(/^[\s·.,;:]+/, '');
  t = t.replace(/[\s·.,;:]+$/, '');
  t = t.replace(/\s{2,}/g, ' ').trim();
  // a separator with only a word or two after it is a leftover, not a sentence
  const parts = t.split('\u00b7').map(x => x.trim()).filter(Boolean);
  const kept = parts.filter((x, i) => i === 0 || x.length >= 24);
  t = kept.join(' \u00b7 ').replace(/[\s.,;:]+$/, '').trim();
  // a fragment is not worth a line: after the filename is stripped, what is left of
  // "sectors.json . every sector, unweighted average" is a lower-case tail with no sentence in it
  if (!t.length || /^[a-z]/.test(t)) return '';
  return t.length >= 18 ? t : '';
}

function card(title, tag, bodyNode, note){
  const c = document.createElement('section'); c.className = 'card';
  const h = document.createElement('div'); h.className = 'ch';
  h.innerHTML = '<h2>' + esc(title) + '</h2>' + (tag ? '<span class="tag">' + esc(tag) + '</span>' : '');
  c.append(h);
  if (bodyNode) c.append(bodyNode);
  const n = cleanNote(note);
  if (n){ const p = document.createElement('p'); p.className = 'note'; p.innerHTML = n; c.append(p); }
  return c;
}
function tiles(items){
  const d = document.createElement('div'); d.className = 'tiles';
  d.innerHTML = items.map(t => '<div><span>' + esc(t[0]) + '</span><b>' + t[1] + '</b><i>' + esc(t[2] || '') + '</i></div>').join('');
  return d;
}
function arrOf(data){
  if (Array.isArray(data)) return data;
  if (data && Array.isArray(data.rows)) return data.rows;
  for (const k of ['items','sectors','indices','bulk','block','up','down','orders','asm','gsm','rows',
                   'series','days','upcoming','open','closed','listed','strategies','sections','glossary',
                   'months','rows','strikes','constituents','files']){
    if (data && Array.isArray(data[k])) return data[k];
  }
  return null;
}
function recordsFrom(data){
  const a = arrOf(data);
  if (!a) return null;
  if (!a.length) return [];
  const first = a[0];
  if (Array.isArray(first)){
    const cols = (data && data.columns && data.columns.length) ? data.columns : first.map((_, i) => 'col ' + (i+1));
    return a.map(r => { const o = {}; cols.forEach((c, i) => o[c] = r[i]); return o; });
  }
  if (typeof first === 'object') return a;
  return a.map((v, i) => ({'#': i + 1, value: v}));
}
function autoCols(records, max){
  if (!records.length) return [];
  const keys = Object.keys(records[0]).slice(0, max || 9);
  return keys.map(k => ({k, label: label(k), r: records.some(r => isNum(r[k]))}));
}

/* =====================================================================================
   MARKET OPEN / CLOSED.
   market_status.json has been built for a while - open 09:15, close 15:30, pre-open 09:00, the
   holiday list and special sessions - and no card ever showed it. Worked out in the browser
   against IST, so the answer is current without a rebuild.
   ===================================================================================== */
function istNow(){
  // the browser's own clock, converted to Asia/Kolkata rather than trusted as local
  const s = new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' });
  return new Date(s);
}
function hhmm(d){
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function marketState(st){
  const now = istNow();
  const today = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');
  const mins = now.getHours() * 60 + now.getMinutes();

  const holidays = (st.holidays || []).map(x => (typeof x === 'string' ? x : x.date));
  const special = (st.special_sessions || []).find(x => x.date === today);

  const toMin = t => {
    const [a, b] = String(t || '0:0').split(':').map(Number);
    return a * 60 + (b || 0);
  };
  const openM = special ? toMin(special.open) : toMin(st.open || '09:15');
  const closeM = special ? toMin(special.close) : toMin(st.close || '15:30');
  const preM = toMin(st.preopen || '09:00');

  const isHoliday = holidays.indexOf(today) >= 0;
  const wd = now.getDay();

  if (isHoliday) return { state: 'Closed', why: 'holiday', detail: 'Market holiday', today };
  if (wd === 0 || wd === 6) return { state: 'Closed', why: 'weekend', detail: 'Weekend', today };
  if (mins >= openM && mins < closeM){
    return { state: 'Open', why: 'open', detail: 'closes at ' + (special ? special.close : st.close), today,
             left: closeM - mins };
  }
  if (mins >= preM && mins < openM){
    return { state: 'Pre-open', why: 'pre', detail: 'opens at ' + (special ? special.open : st.open), today,
             left: openM - mins };
  }
  if (mins < preM) return { state: 'Closed', why: 'before', detail: 'opens at ' + (special ? special.open : st.open), today, left: openM - mins };
  return { state: 'Closed', why: 'after', detail: 'closed for the day', today };
}
async function marketStatusCard(){
  let st;
  try { st = await J('market_status.json'); } catch (_) { return null; }
  const m = marketState(st);
  const box = document.createElement('div');
  const cls = m.state === 'Open' ? 'up' : m.state === 'Pre-open' ? '' : 'dn';
  let html = '<p class="big" style="margin:0 0 2px"><span class="' + cls + '">' + m.state +
    '</span> <span style="font-size:13px;opacity:.7">' + esc(m.detail) + '</span></p>';
  if (m.left != null && m.left > 0){
    const hh = Math.floor(m.left / 60), mm = m.left % 60;
    html += '<p class="sub" style="margin:0 0 8px">' + (hh ? hh + 'h ' : '') + mm + 'm away</p>';
  }
  if (st.special_sessions && st.special_sessions.some(x => x.date === m.today)){
    const sp = st.special_sessions.find(x => x.date === m.today);
    html += '<p class="sub" style="margin:0 0 8px">' + esc(sp.label || 'Special session') + '</p>';
  }
  box.innerHTML = html + rowKV([
    ['Session', (st.preopen || '09:00') + ' pre-open \u00b7 ' + (st.open || '09:15') + ' open \u00b7 ' + (st.close || '15:30') + ' close'],
    ['Timezone', esc(st.timezone || 'Asia/Kolkata')],
    ['Now (IST)', hhmm(istNow())],
    ['Data as of', esc((st.updated || '').slice(0, 16).replace('T', ' '))]
  ]);
  return card('Market', m.state, box,
    'Times are IST. The state is worked out in your browser against the exchange calendar, so it '
    + 'is current without waiting for a rebuild.');
}

/* Today in one line - the brief already writes it, and the FII/DII flow gives the second half. */
async function todayLineCard(){
  let b, f;
  try { b = await J('brief.json'); } catch (_) { return null; }
  try { f = await J('fii_dii.json'); } catch (_) { f = null; }
  const box = document.createElement('div');
  let html = '<p style="margin:0 0 10px;line-height:1.55;font-size:15px">' +
    esc(b.headline || 'No brief for today.') + '</p>';
  const bul = (b.bullets || []).slice(0, 3);
  if (bul.length){
    html += '<ul style="margin:0;padding-left:18px;line-height:1.6">' +
      bul.map(x => '<li>' + esc(typeof x === 'string' ? x : (x.text || '')) + '</li>').join('') + '</ul>';
  }
  box.innerHTML = html;
  const lat = (f && f.latest) || [];
  if (lat.length){
    // rowKV returns an HTML string; append() would insert it as text and print the markup
    box.insertAdjacentHTML('beforeend', rowKV(lat.slice(0, 4).map(x => [
      (x.who || x.category || 'Flow') + ' ' + (x.date || ''),
      (x.net == null ? '-' : (x.net > 0 ? '+' : '') + '\u20b9' + num(x.net) + ' cr')
    ])));
  }
  return card('Today in one line', b.market_date || '', box,
    'Describes what moved, not why. Generated from this hub\'s own files.');
}

    ['Above 200-day', (br.above_200 != null ? br.above_200 + '%' : '\u2014'), 'long-term'],

    'A 28% reading on the 50-day means most stocks are below it, whatever the index did. That is '
    + 'the difference between a market rising and an index rising.'));

  if (uc.length || lc.length){
    const box = document.createElement('div');
    const mk = (arr, cls, ttl) => '<p class="sub" style="margin:8px 0 4px">' + ttl + '</p>' +
      '<p style="margin:0">' + arr.map(x => '<b>' + esc(x.s) + '</b> ' +
        (x.p > 0 ? '+' : '') + (x.p||0).toFixed(2) + '%').join(' \u00b7 ') + '</p>';
    box.innerHTML = mk(uc, 'up', 'Upper circuit \u00b7 buyers stuck') +
                    mk(lc, 'down', 'Lower circuit \u00b7 sellers stuck');
    main.append(card('Circuit radar', (circ.n_uc||0) + ' up \u00b7 ' + (circ.n_lc||0) + ' down', box,
      'A stock locked at its upper circuit has more buyers than sellers and no price left to '
      + 'clear them. Full list under F&O.'));
  }

/* =====================================================================================
   INDEX PERFORMANCE BETWEEN TWO DATES.
   The site could say where an index is today. It could not answer the question a newspaper
   table answers every week: which sectors rose and which fell between two dates, and by how
   much. index_periods.json holds daily closes so any pair of dates can be compared here.
   ===================================================================================== */
function indexValueAt(rec, iso){
  if (!rec || !rec.d || !rec.d.length) return null;
  // the last close on or before the date, so a weekend or holiday picks the prior session
  let best = null;
  for (let i = 0; i < rec.d.length; i++){
    if (rec.d[i] <= iso) best = rec.c[i];
    else break;
  }
  return best;
}

async function indexPeriodCard(){
  let d;
  try { d = await J('index_periods.json'); } catch (_) { return null; }
  const idx = d.indices || {};
  const keys = Object.keys(idx);
  if (!keys.length) return null;

  // default window: the last ten sessions of the longest series
  const any = idx[keys[0]];
  const lastDate = any.d[any.d.length - 1];
  const firstDate = any.d[Math.max(0, any.d.length - 11)];

  const box = document.createElement('div');
  const bar = document.createElement('div');
  bar.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px';
  bar.innerHTML =
    '<label style="flex:1;min-width:120px"><span class="sub" style="display:block;margin-bottom:4px">From</span>' +
    '<input id="ipFrom" type="date" value="' + firstDate + '" max="' + lastDate + '" ' +
    'style="width:100%;box-sizing:border-box;padding:8px;border-radius:9px;border:1px solid var(--line);' +
    'background:var(--card);color:inherit;font:inherit;font-size:12.5px"></label>' +
    '<label style="flex:1;min-width:120px"><span class="sub" style="display:block;margin-bottom:4px">To</span>' +
    '<input id="ipTo" type="date" value="' + lastDate + '" max="' + lastDate + '" ' +
    'style="width:100%;box-sizing:border-box;padding:8px;border-radius:9px;border:1px solid var(--line);' +
    'background:var(--card);color:inherit;font:inherit;font-size:12.5px"></label>';
  box.append(bar);
  const host = document.createElement('div');
  box.append(host);

  const paint = () => {
    const from = ($('#ipFrom') && $('#ipFrom').value) || firstDate;
    const to = ($('#ipTo') && $('#ipTo').value) || lastDate;
    const rows = keys.map(k => {
      const a = indexValueAt(idx[k], from), b = indexValueAt(idx[k], to);
      const chg = (a && b) ? (b / a - 1) * 100 : null;
      return { name: idx[k].name, kind: idx[k].kind, from: a, to: b, chg: chg };
    }).filter(r => r.chg != null).sort((x, y) => y.chg - x.chg);
    host.innerHTML = '';
    if (!rows.length){
      const e = document.createElement('p'); e.className = 'empty';
      e.textContent = 'No sessions between those two dates.';
      host.append(e); return;
    }
    host.append(makeTable(rows, [
      {k:'name', label:'Index'},
      {k:'from', label:'On ' + from, r:1, html:v => num(v)},
      {k:'to', label:'On ' + to, r:1, html:v => num(v)},
      {k:'chg', label:'Change', r:1, html:v => '<span class="' + (v > 0 ? 'up' : v < 0 ? 'dn' : '') +
        '">' + (v > 0 ? '+' : '') + v.toFixed(2) + '%</span>'}
    ], {limit:30, noSearch:true}));
    const up = rows.filter(r => r.chg > 0).length;
    const p2 = document.createElement('p');
    p2.className = 'sub'; p2.style.margin = '10px 0 0';
    p2.textContent = up + ' of ' + rows.length + ' indices rose between ' + from + ' and ' + to +
      '. Sorted by change, best first.';
    host.append(p2);
  };

  bar.addEventListener('change', paint);
  setTimeout(paint, 0);

  return card('Index performance', 'any two dates', box,
    'Levels are index closes. A date that falls on a weekend or holiday uses the previous '
    + 'session, so the comparison is always like for like.');
}

/* FII and DII net flows, one row per session, with the running total - the table a newspaper
   prints every week. fii_dii.json accumulates a day at a time from the NSE endpoint. */
async function flowTableCard(){
  let f;
  try { f = await J('fii_dii.json'); } catch (_) { return null; }
  const hist = (f.history || []).slice();
  if (!hist.length) return null;
  hist.sort((a, b) => (a.date < b.date ? 1 : -1));   // newest first

  const rows = hist.map(h => ({ date: h.date, fii: h.fii, dii: h.dii,
    net: (h.fii || 0) + (h.dii || 0) }));
  const tf = hist.reduce((s, h) => s + (h.fii || 0), 0);
  const td = hist.reduce((s, h) => s + (h.dii || 0), 0);

  const box = document.createElement('div');
  box.append(tiles([
    ['FII, all sessions', (tf > 0 ? '+' : '') + '\u20b9' + num(tf) + ' cr', hist.length + ' sessions'],
    ['DII, all sessions', (td > 0 ? '+' : '') + '\u20b9' + num(td) + ' cr', 'domestic'],
    ['Combined', ((tf + td) > 0 ? '+' : '') + '\u20b9' + num(tf + td) + ' cr', 'net into equities']
  ]));
  box.append(makeTable(rows, [
    {k:'date', label:'Date'},
    {k:'fii', label:'FII', r:1, html:v => v == null ? '\u2014'
      : '<span class="' + (v > 0 ? 'up' : v < 0 ? 'dn' : '') + '">' + (v > 0 ? '+' : '') + num(v) + '</span>'},
    {k:'dii', label:'DII', r:1, html:v => v == null ? '\u2014'
      : '<span class="' + (v > 0 ? 'up' : v < 0 ? 'dn' : '') + '">' + (v > 0 ? '+' : '') + num(v) + '</span>'},
    {k:'net', label:'Net', r:1, html:v => (v > 0 ? '+' : '') + num(v)}
  ], {limit:60, noSearch:true}));

  const p3 = document.createElement('p');
  p3.className = 'sub'; p3.style.margin = '10px 0 0';
  p3.textContent = 'Rupees crore, cash market. NSE\'s endpoint returns only the latest session, so '
    + 'this table grows one row a day - ' + hist.length + ' so far. It is not backfilled history.';
  box.append(p3);

  return card('FII and DII flows', hist.length + ' sessions', box,
    'Foreign and domestic institutional net buying. A negative FII figure means they sold more '
    + 'than they bought.');
}

async function renderMarket(main){
  const [ipCard, flCard] = await Promise.all([indexPeriodCard(), flowTableCard()]);
  if (ipCard) main.append(ipCard);
  if (flCard) main.append(flCard);

  const [idx, d, vix] = await Promise.all([J('indices.json'), J('data.json'), J('vix.json')]);
  const byId = {};
  idx.indices.forEach(i => { byId[i.id] = i; });
  const rows = idx.indices.map(i => ({id: i.id, name: i.name, category: i.category,
    stocks: i.count, advances: i.advances, declines: i.declines, avg_chg: i.avg_chg_pct}));

  // Tapping an index name opens its members underneath. The members table was already
  // reachable from the Indices tab, but Market is where you land first, and a row that does
  // nothing when tapped reads as broken.
  const memberHost = document.createElement('div');
  const idxCard = card('Indices', idx.count + ' tracked',
    makeTable(rows, [{k:'name',label:'Index'},{k:'category',label:'Type'},
      {k:'advances',label:'Adv',r:1},{k:'declines',label:'Dec',r:1},{k:'stocks',label:'Stocks',r:1},
      {k:'avg_chg',label:'Avg change',r:1,html:v=>pct(v)}],
      {limit:30, placeholder:'Search indices\u2026',
       onRow: r => {
         memberHost.innerHTML = '';
         memberHost.append(indexMembersCard(byId[r.id]));
         // the members land below the table, so bring them into view - otherwise the tap looks
         // like it did nothing on a phone.
         setTimeout(() => memberHost.scrollIntoView({behavior:'smooth', block:'start'}), 60);
       }}),
    'indices.json \u00b7 average change across each index\'s constituents. Tap an index for its stocks, then a stock for its fundamentals.');
  main.append(idxCard, memberHost);
  const radar = await circuitRadarCard();
  if (radar) main.append(radar);
  const m = d.markets.rows.map(r => ({symbol: r[0], close: r[1], change: r[2], date: r[3]}));
  main.append(card('Index closes', 'data.json',
    makeTable(m, [{k:'symbol',label:'Symbol'},{k:'close',label:'Close',r:1,html:v=>num(v)},
      {k:'change',label:'Change',r:1,html:v=>pct(v)},{k:'date',label:'Date'}], {limit:10})));
  main.append(card('India VIX', vix.latest ? num(vix.latest) : '', 
    makeTable(vix.series.slice(-30).reverse().map(s => ({date: s[0], vix: s[1]})),
      [{k:'date',label:'Date'},{k:'vix',label:'VIX',r:1,html:v=>num(v)}], {limit:30}),
    'vix.json · ' + vix.count + ' sessions since ' + vix.series[0][0] + '.'));
}

async function renderLearn(main){
  let l;
  try { l = await J('learn.json'); } catch (e) {
    const p = document.createElement('p'); p.className = 'err';
    p.textContent = 'Could not load learn.json: ' + e.message;
    main.append(card('Learn', 'unavailable', p, '')); return;
  }

  // Glossary first: it is the thing people come back for, and a wall of lessons pushes it down.
  const gl = (l.glossary || []).map(g => Array.isArray(g)
    ? {term: g[0], meaning: g[1]}
    : {term: g.term || g.t, meaning: g.meaning || g.d || ''}).filter(x => x.term);
  if (gl.length){
    main.append(card('Glossary', gl.length + ' terms',
      makeTable(gl, [{k:'term',label:'Term'},{k:'meaning',label:'What it means'}],
        {limit:300, placeholder:'Search a term - RSI, P/E, drawdown, circuit\u2026'}),
      l.glossary_note || 'Every term here is one this site actually uses.'));
  }

  // Then the lessons, one card per section so a phone is not one endless scroll.
  (l.sections || []).forEach(sec => {
    const ls = sec.lessons || [];
    if (!ls.length) return;
    const body = document.createElement('div');
    body.innerHTML = ls.map(x =>
      '<p class="big" style="margin:14px 0 4px">' + esc(x.q || x.title || '') + '</p>' +
      '<p style="margin:0">' + esc(x.a || x.body || '') + '</p>').join('');
    main.append(card(sec.title || sec.id, (sec.level || '') + ' \u00b7 ' + ls.length + ' lessons',
      body, ''));
  });
}

async function renderCharges(main){
  let c;
  try { c = await J('charges.json'); } catch (e) {
    const p = document.createElement('p'); p.className = 'err';
    p.textContent = 'Could not load charges.json: ' + e.message;
    main.append(card('Charges', 'unavailable', p, 'The file is read on every build.'));
    return;
  }

  // What the government, the exchanges and the regulator take, at the same rate for everyone.
  const st = c.statutory || [];
  if (st.length){
    const rows = [];
    st.forEach(s => (s.rates || []).forEach(r => rows.push({
      name: s.name, who: s.who, when: s.when, on: r[0], rate: r[1], basis: r[2]
    })));
    main.append(card('Statutory charges', rows.length + ' rates',
      makeTable(rows, [{k:'name',label:'Charge'},{k:'on',label:'On'},{k:'rate',label:'Rate',r:1},
        {k:'basis',label:'Applies to'},{k:'when',label:'When'}],
        {limit:60, placeholder:'Search a charge\u2026'}),
      'These are the same at every broker. They are not what makes one broker cheaper than another.'));
  }

  // What the broker takes - the part that actually differs.
  const bs = c.brokers || [];
  if (bs.length){
    main.append(card('Broker charges', bs.length + ' brokers',
      makeTable(bs.map(b => ({name: b.name, type: b.type, opening: b.account_opening,
        amc: b.amc, delivery: b.delivery, intraday: b.intraday, options: b.options, dp: b.dp})),
        [{k:'name',label:'Broker'},{k:'type',label:'Type'},
         {k:'opening',label:'Account opening',r:1},{k:'amc',label:'AMC'},
         {k:'delivery',label:'Delivery'},{k:'intraday',label:'Intraday'},
         {k:'options',label:'Options'},{k:'dp',label:'DP on sell'}],
        {limit:40, placeholder:'Search brokers\u2026'}),
      'A dash means the figure could not be confirmed from the broker\'s own pricing page, so it '
      + 'is left blank rather than guessed. Read your tariff sheet before opening an account.'));
  }

  // The floor SEBI puts under small accounts.
  if (c.bsda){
    const b = c.bsda;
    main.append(card('The BSDA floor', 'small accounts', tiles([
      ['Nil AMC up to', b.nil_amc_up_to || '\u2014', 'holdings'],
      ['Capped at', b.capped_amc || '\u2014', 'above that'],
      ['Applies to', 'one account', 'sole or first holder'],
      ['Default since', 'Sep 2024', 'unless you opt out']
    ]), b.rule + ' ' + (b.note || '')));
  }

  // One trade, costed end to end.
  const w = c.worked_example;
  if (w){
    const body = document.createElement('div');
    let html = '<p class="sub" style="margin:0 0 6px">' + esc(w.setup || '') + '</p>';
    if (w.assumption) html += '<p class="sub" style="margin:0 0 10px">' + esc(w.assumption) + '</p>';
    const lines = w.lines || [];
    if (lines.length){
      html += '<div class="kv">' + lines.map(l =>
        '<div><span>' + esc(l[0]) + '</span><span>' + esc(String(l[1])) + '</span></div>').join('') + '</div>';
    }
    if (w.total_cost != null) html += '<p style="margin:12px 0 0"><b>Total cost</b> \u20b9' + num(w.total_cost) + '</p>';
    if (w.net_profit != null) html += '<p style="margin:2px 0 0"><b>Net profit</b> \u20b9' + num(w.net_profit) + '</p>';
    if (w.lesson) html += '<p class="sub" style="margin-top:10px">' + esc(w.lesson) + '</p>';
    body.innerHTML = html;
    main.append(card(w.title || 'One trade, costed', 'end to end', body,
      'Costs decide whether a strategy that looks profitable on a chart is profitable in an account.'));
  }

  // The lessons, as readable cards rather than a wall of text.
  const ls = c.lessons || [];
  if (ls.length){
    const body = document.createElement('div');
    body.innerHTML = ls.map(l => {
      const t = l.q || l.title || l.t || '';
      const a = l.a || l.body || l.detail || '';
      return '<p class="big" style="margin:14px 0 4px">' + esc(t) + '</p><p style="margin:0">' + esc(a) + '</p>';
    }).join('');
    main.append(card('What the numbers mean', ls.length + ' notes', body,
      c.verify_note || ''));
  } else if (c.verify_note){
    const p = document.createElement('p'); p.className = 'sub'; p.textContent = c.verify_note;
    main.append(card('Before you use these', 'read this', p, ''));
  }
}

/* =====================================================================================
   CORRELATION.
   correlation.json carries a 60x60 matrix and 40 pairs per window, and the generic renderer
   showed only "updated" and "count" - two tiles and an empty page. A matrix is not a table of
   records, so it needs its own view: the pairs worth knowing, a grid you can read, and the
   caveats the file already writes.
   ===================================================================================== */
/* Movers radar - what actually happened today, described rather than prescribed. Same rule as
   the circuit radar: state the event, do not suggest an action. */
async function moversRadarCard(){
  let st, cir;
  try { st = await J('stocks.json'); } catch (_) { return null; }
  try { cir = await J('circuits.json'); } catch (_) { cir = {}; }
  const S = st.stocks || {};
  const hi = [], lo = [], vol = [];
  Object.keys(S).forEach(k => {
    const r = S[k]; if (!r || !r.tech) return;
    const t = r.tech, c = r.close;
    if (c == null) return;
    if (t.high_52w && c >= t.high_52w * 0.999) hi.push({symbol: r.symbol, close: c, chg_pct: r.chg_pct});
    if (t.low_52w && c <= t.low_52w * 1.001) lo.push({symbol: r.symbol, close: c, chg_pct: r.chg_pct});
    if (t.vol_x && t.vol_x >= 3) vol.push({symbol: r.symbol, close: c, chg_pct: r.chg_pct, vol_x: t.vol_x});
  });
  vol.sort((a, b) => b.vol_x - a.vol_x);
  if (!hi.length && !lo.length && !vol.length) return null;

  const box = document.createElement('div');
  const tbl = (arr, label, extra) => {
    if (!arr.length) return;
    const sec = document.createElement('div');
    const p0 = document.createElement('p');
    p0.className = 'sub'; p0.style.margin = '10px 0 4px';
    p0.textContent = label + ' (' + arr.length + ')';
    sec.append(p0);
    sec.append(makeTable(arr.slice(0, 8), [
      {k:'symbol', label:'Symbol'}, {k:'close', label:'Close', r:1, html:v => num(v)},
      {k:'chg_pct', label:'Change', r:1, html:v => pct(v)}
    ].concat(extra || []), {limit:8, noSearch:true, onRow: r => openStock(r.symbol + '.NS')}));
    box.append(sec);
  };
  tbl(hi, 'At a 52-week high today');
  tbl(lo, 'At a 52-week low today');
  tbl(vol, 'Volume at least 3x its usual', [{k:'vol_x', label:'Vol x', r:1, html:v => v.toFixed(1) + 'x'}]);

  const uc = (cir.uc || []).length, lc = (cir.lc || []).length;
  if (uc || lc){
    const p1 = document.createElement('p');
    p1.className = 'sub'; p1.style.margin = '10px 0 0';
    p1.textContent = 'Plus ' + uc + ' at the upper circuit and ' + lc + ' at the lower. Full list '
      + 'under F&O.';
    box.append(p1);
  }
  return card('Movers today', (hi.length + lo.length + vol.length) + ' flagged', box,
    'A volume spike or a fresh extreme is a description of the session, not a reason to act.');
}

async function renderEconomy(main){
  const [ec, mac] = await Promise.all([
    J('economy.json').catch(() => ({items:[]})),
    J('macro.json').catch(() => ({events:[]}))
  ]);

  // ---- days until the next thing that matters ----
  const ev = (mac.events || []).slice().sort((a, b) => (a.days_away || 999) - (b.days_away || 999));
  if (ev.length){
    const box = document.createElement('div');
    box.append(tiles(ev.slice(0, 4).map(e => [
      e.days_away === 0 ? 'Today' : e.days_away + ' days',
      esc(e.label || ''),
      (e.region || '') + ' \u00b7 ' + (e.date || '')
    ])));
    if (ev[0].note){
      const p0 = document.createElement('p');
      p0.className = 'sub'; p0.style.margin = '10px 0 0';
      p0.textContent = ev[0].note;
      box.append(p0);
    }
    main.append(card('Macro radar', ev.length + ' events', box,
      'Only events already on the calendar. The nearest is first.'));
  }

  // ---- RBI releases ----
  const items = ec.items || [];
  if (items.length){
    const cnt = ec.counts || {};
    const summ = document.createElement('div');
    summ.append(tiles(Object.keys(cnt).slice(0, 4).map(k => [k, String(cnt[k]), 'releases'])));
    main.append(card('RBI releases', items.length + ' in the feed', summ,
      'What the Reserve Bank has published, newest first. A repo auction notice is an operational '
      + 'announcement, not a policy signal.'));

    main.append(card('Latest releases', 'RBI',
      makeTable(items.map(x => ({date: x.date, topic: x.topic, title: x.title, link: x.link})), [
        {k:'date', label:'Date'}, {k:'topic', label:'Topic'},
        {k:'title', label:'Release',
         html:(v, r) => r.link ? '<a href="' + esc(r.link) + '" target="_blank" rel="noopener">' + esc(v) + '</a>' : esc(v)}
      ], {limit:80, placeholder:'Search releases - repo, inflation, rupee\u2026'}),
      'Source: the RBI\'s own press-release feed.'));
  } else {
    const p0 = document.createElement('p'); p0.className = 'empty';
    p0.textContent = 'No RBI releases in the last pull.';
    main.append(card('RBI releases', 'empty', p0, ''));
  }

  // ---- what is NOT here, said plainly ----
  const gap = document.createElement('div');
  gap.innerHTML = '<p style="margin:0 0 8px;line-height:1.55">This window carries the RBI\'s own '
    + 'releases and the macro events already on the calendar. It does not carry a forward calendar '
    + 'of Indian data releases.</p>'
    + '<p style="margin:0;line-height:1.55">CPI, IIP and GDP dates come from MoSPI, whose portal '
    + 'needs scraping; the Press Information Bureau feed returns Hindi-only items with no '
    + 'publication date, so it cannot be placed on a timeline. Rather than guess at dates, the '
    + 'window leaves them out.</p>';
  main.append(card('What this does not cover', 'read this', gap, ''));
}

async function renderCorrelation(main){
  let d;
  try { d = await J('correlation.json'); } catch (e) {
    const p0 = document.createElement('p'); p0.className = 'err';
    p0.textContent = 'Could not load correlation.json: ' + e.message;
    main.append(card('Correlation', 'unavailable', p0, '')); return;
  }
  const wins = d.windows || {};
  const keys = Object.keys(wins);
  if (!keys.length){
    const p0 = document.createElement('p'); p0.className = 'empty';
    p0.textContent = 'No windows in the file.';
    main.append(card('Correlation', 'empty', p0, '')); return;
  }

  const sel = document.createElement('div');
  sel.className = 'nchips';
  sel.style.margin = '0 0 10px';
  sel.innerHTML = keys.map((k, i) =>
    '<button data-w="' + esc(k) + '"' + (i === 0 ? ' class="on"' : '') + '>' + esc(k) + '</button>').join('');
  main.append(card('Correlation window', keys.length + ' windows', sel,
    'Daily returns. A longer window says more about a lasting relationship, a shorter one about '
    + 'what is happening now - and they often disagree.'));

  const host = document.createElement('div');
  main.append(host);

  const paint = (wk) => {
    const w = wins[wk] || {};
    const pairs = w.pairs || [];
    const st = w.stocks || {};
    const syms = st.symbols || [];
    const mat = st.matrix || [];
    host.innerHTML = '';

    // highest and lowest pairs - the two questions anyone actually asks of a matrix
    if (pairs.length){
      const sorted = pairs.slice().sort((a, b) => b.corr - a.corr);
      const fmt = r => ({a: r.a, b: r.b, corr: r.corr});
      host.append(card('Most alike', wk + ' \u00b7 ' + pairs.length + ' pairs',
        makeTable(sorted.slice(0, 12).map(fmt), [
          {k:'a', label:'A'}, {k:'b', label:'B'},
          {k:'corr', label:'Correlation', r:1, html:v => v.toFixed(3)}
        ], {limit:12, noSearch:true, onRow: r => openStock(r.a + '.NS')}),
        'Two names that move together give you one position, not two. That is the opposite of '
        + 'diversification, and it is easy to hold without noticing.'));

      // If the lowest correlation is still positive, saying "these diversify best" would be
      // wrong - nothing in this list moves opposite to anything else.
      const minC = sorted[sorted.length - 1].corr;
      const leastNote = minC > 0.2
        ? 'Every pair here still moves in the same direction - the weakest link is ' + minC.toFixed(2)
          + ', well above zero. Nothing in this list hedges anything else, so a portfolio of these '
          + 'names is one bet, not many.'
        : minC > 0
        ? 'The weakest relationships in the list. They still lean the same way (weakest ' +
          minC.toFixed(2) + '), so they soften a fall rather than offset it.'
        : 'These move opposite to each other, which is what a hedge is meant to do.';
      host.append(card('Least alike', wk + ' \u00b7 ' + pairs.length + ' pairs',
        makeTable(sorted.slice(-12).reverse().map(fmt), [
          {k:'a', label:'A'}, {k:'b', label:'B'},
          {k:'corr', label:'Correlation', r:1, html:v => v.toFixed(3)}
        ], {limit:12, noSearch:true, onRow: r => openStock(r.a + '.NS')}),
        leastNote));
    }

    // the grid itself, as a compact heat square
    if (syms.length && mat.length){
      const box = document.createElement('div');
      const n = syms.length;
      const cell = Math.max(3, Math.floor(300 / n));
      let svg = '<svg viewBox="0 0 ' + (n * cell) + ' ' + (n * cell) + '" width="100%" ' +
        'style="display:block;max-width:340px;margin:0 auto">';
      for (let i = 0; i < n && i < mat.length; i++){
        const row = mat[i] || [];
        for (let j = 0; j < n; j++){
          const v = row[j];
          if (v == null) continue;
          // -1 blue, 0 neutral, +1 red - the same reading as the heat maps elsewhere
          const t = Math.max(-1, Math.min(1, v));
          const col = t >= 0
            ? 'rgba(240,115,106,' + (0.10 + t * 0.78).toFixed(2) + ')'
            : 'rgba(110,168,254,' + (0.10 + Math.abs(t) * 0.78).toFixed(2) + ')';
          svg += '<rect x="' + (j * cell) + '" y="' + (i * cell) + '" width="' + (cell - 1) +
            '" height="' + (cell - 1) + '" fill="' + col + '"/>';
        }
      }
      svg += '</svg>';
      box.innerHTML = svg;
      const lg = document.createElement('p');
      lg.className = 'sub'; lg.style.margin = '8px 0 0';
      lg.textContent = n + ' x ' + n + ' grid, in the same order as the pair lists. Red means the '
        + 'two move together, blue means they move apart, pale means little relationship either '
        + 'way. The diagonal is a stock against itself and is always 1.';
      box.append(lg);
      host.append(card('The grid', n + ' stocks', box,
        'Read a row: how one stock behaves against every other in the list.'));
    }

    if (!pairs.length && !mat.length){
      const p0 = document.createElement('p'); p0.className = 'empty';
      p0.textContent = 'No pairs or matrix for this window.';
      host.append(card('Correlation', wk, p0, ''));
    }
  };

  sel.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [].forEach.call(sel.querySelectorAll('button'), x => x.classList.remove('on'));
    b.classList.add('on'); paint(b.dataset.w);
  });
  paint(keys[0]);

  const ca = d.cautions || {};
  const vals = Object.keys(ca).map(k => ca[k]).filter(Boolean);
  if (vals.length){
    const box = document.createElement('div');
    box.innerHTML = vals.map(v => '<p style="margin:0 0 8px;line-height:1.55">' + esc(v) + '</p>').join('');
    main.append(card('What correlation does not tell you', vals.length + ' points', box, ''));
  }
}

async function renderBreadth(main){
  const [br, st, secs, scr] = await Promise.all([
    J('breadth.json').catch(()=>({})), J('stocks.json').catch(()=>({})),
    J('sectors.json').catch(()=>({})), J('screener.json').catch(()=>({}))
  ]);

  // "Below both" was 100 minus the larger of the two shares, which is the share below the
  // HIGHER average - equal to "below both" only if one group contains the other, which it does
  // not. It is computed per stock from stocks.json instead.
  const _S = (st.stocks || {});
  let _both = 0, _known = 0, _aboveEither = 0;
  Object.keys(_S).forEach(k => {
    const r = _S[k], tt = r && r.tech;
    if (!r || !tt || r.close == null) return;
    const a50 = tt.sma_50, a200 = tt.sma_200;
    if (a50 == null || a200 == null) return;
    _known++;
    const above50 = r.close >= a50, above200 = r.close >= a200;
    if (above50 || above200) _aboveEither++;
    if (!above50 && !above200) _both++;
  });
  const _belowBoth = _known ? (_both / _known * 100).toFixed(1) + '%' : '\u2014';

  main.append(card('Breadth', (br.total||0) + ' stocks', tiles([
    ['Above 50-day', (br.above_50 != null ? br.above_50 + '%' : '\u2014'), 'short-term trend'],
    ['Above 200-day', (br.above_200 != null ? br.above_200 + '%' : '\u2014'), 'long-term trend'],
    ['Below both', _belowBoth, _known ? 'of ' + _known.toLocaleString('en-IN') + ' stocks' : 'no data'],
    ['Stocks', String(br.total||0), 'in the screen']
  ]), 'A breadth reading of 28% on the 50-day means seven in ten stocks are below their own '
     + '50-day average, whatever the index did. "Below both" is counted per stock, not derived '
     + 'from the other two tiles.'));

  // where the universe sits against each average, computed from stocks.json
  const S = st.stocks || {};
  const rows = Object.keys(S).map(k => S[k]).filter(x => x && x.tech);
  if (rows.length){
    function bucket(field){
      let above = 0, below = 0, na = 0;
      rows.forEach(r => {
        const v = r.close, m = r.tech[field];
        if (v == null || m == null){ na++; return; }
        if (v >= m) above++; else below++;
      });
      return {above, below, na, total: rows.length};
    }
    const b20 = bucket('sma_20'), b50 = bucket('sma_50'), b200 = bucket('sma_200');
    function bars(label, b){
      const pctA = (b.above / b.total * 100);
      return '<p class="sub" style="margin:10px 0 4px">' + label + ' \u00b7 ' +
        pctA.toFixed(1) + '% above (' + b.above + ' of ' + b.total + ')</p>' +
        '<div style="display:flex;height:9px;border-radius:5px;overflow:hidden">' +
        '<div style="width:' + pctA.toFixed(1) + '%;background:#4ec9a0"></div>' +
        '<div style="width:' + (100-pctA).toFixed(1) + '%;background:#f0736a"></div></div>';
    }
    const box = document.createElement('div');
    box.innerHTML = bars('Above 20-day average', b20) + bars('Above 50-day average', b50) +
                    bars('Above 200-day average', b200);
    main.append(card('Where the universe sits', rows.length + ' stocks with technicals', box,
      'Computed from stocks.json rather than the summary file, so the counts are visible and the '
      + 'percentages can be checked against them.'));
  }

  // sector breadth - which sectors are actually participating
  const sec = (secs.sectors || []).slice().sort((a,b) => (b.advances||0)/(b.count||1) - (a.advances||0)/(a.count||1));
  if (sec.length){
    main.append(card('Sector participation', sec.length + ' sectors',
      makeTable(sec.map(s => ({name: s.name, count: s.count, advances: s.advances,
        declines: s.declines, adv_pct: s.count ? +(s.advances/s.count*100).toFixed(1) : null,
        avg_chg: s.avg_chg})),
        [{k:'name',label:'Sector'},{k:'count',label:'Stocks',r:1},{k:'advances',label:'Adv',r:1},
         {k:'declines',label:'Dec',r:1},{k:'adv_pct',label:'% up',r:1,html:v=>v==null?'\u2014':v+'%'},
         {k:'avg_chg',label:'Avg chg',r:1,html:v=>pct(v)}], {limit:40, placeholder:'Search sectors\u2026'}),
      'A sector where most stocks rise is participating. One carried by a single heavyweight is not.'));
  }

  // extremes
  const srows = (scr.rows || []).filter(r => r && r.symbol && r.chg_pct != null);
  if (srows.length){
    const sorted = srows.slice().sort((a,b) => b.chg_pct - a.chg_pct);
    main.append(card('Strongest', 'top 10 today',
      makeTable(sorted.slice(0,10).map(r=>({symbol:r.symbol,name:r.name,close:r.close,chg_pct:r.chg_pct})),
        [{k:'symbol',label:'Symbol'},{k:'name',label:'Name'},{k:'close',label:'Close',r:1},
         {k:'chg_pct',label:'Change',r:1,html:v=>pct(v)}],
        {limit:10, onRow: r => openStock(r.symbol)}), 'Tap a row for the full-screen detail.'));
    main.append(card('Weakest', 'bottom 10 today',
      makeTable(sorted.slice(-10).reverse().map(r=>({symbol:r.symbol,name:r.name,close:r.close,chg_pct:r.chg_pct})),
        [{k:'symbol',label:'Symbol'},{k:'name',label:'Name'},{k:'close',label:'Close',r:1},
         {k:'chg_pct',label:'Change',r:1,html:v=>pct(v)}],
        {limit:10, onRow: r => openStock(r.symbol)}), 'Tap a row for the full-screen detail.'));
  }
}

/* =====================================================================================
   PAIR SPREADS, in F&O where a spread trader looks.
   The daily tracker writing to the Google Sheet was putting a new date on the previous run's
   z-scores - BAJFINANCE/CHOLAFIN read 1.0877 on two different dates, and every other pair
   repeated too. A new date with old numbers is worse than no update, because it looks like a
   check. These come from docs/series.json, which the pipeline rebuilds nightly.
   ===================================================================================== */
async function pairsCard(){
  let d;
  try { d = await J('pairs.json'); } catch (_) { return null; }
  if (!d || !(d.pairs || []).length) return null;

  const c = d.counts || {};
  // tiles() returns a DOM node, not a string - assigning it to innerHTML printed
  // "[object HTMLDivElement]" where the summary should be
  const box = document.createElement('div');
  box.append(tiles([
    ['At entry', String((c['BUY A / SELL B'] || 0) + (c['SELL A / BUY B'] || 0)), '|z| at or above ' + d.entry],
    ['Watch', String(c['WATCH'] || 0), '|z| at or above ' + d.watch],
    ['No signal', String(c['NO SIGNAL'] || 0), 'inside the band'],
    ['Pairs', String(d.count || 0), (d.window || 60) + '-session window']
  ]));
  const host = document.createElement('div');
  box.append(host);

  const rows = (d.pairs || []).map(r => ({
    pair: r.pair, z: r.z, state: r.state, ratio: r.ratio, mean: r.mean_ratio,
    a: r.a, a_chg: r.a_chg, b_chg: r.b_chg
  }));

  host.append(makeTable(rows, [
    {k:'pair', label:'Pair'},
    {k:'z', label:'Z-score', r:1, html:v => {
      if (v == null) return '\u2014';
      const hot = Math.abs(v) >= (d.entry || 2);
      return '<span class="' + (hot ? (v > 0 ? 'dn' : 'up') : '') + '">' +
        (v > 0 ? '+' : '') + v.toFixed(2) + '</span>';
    }},
    {k:'state', label:'Read'},
    {k:'ratio', label:'Ratio', r:1, html:v => v == null ? '\u2014' : v.toFixed(4)},
    {k:'mean', label:'Mean', r:1, html:v => v == null ? '\u2014' : v.toFixed(4)},
    {k:'a_chg', label:'A', r:1, html:v => pct(v)},
    {k:'b_chg', label:'B', r:1, html:v => pct(v)}
  ], {limit:40, placeholder:'Search a pair\u2026', onRow: r => openStock(r.a + '.NS')}));

  const note = document.createElement('p');
  note.className = 'sub';
  note.style.margin = '10px 0 0';
  note.textContent = 'The spread is ln(A) minus ln(B), so the ratio column is how many B one A '
    + 'buys. A z-score says the ratio is unusual against its own ' + (d.window || 60) + '-session '
    + 'past - not that it will revert. A broken pair can sit at three sigma for months, and '
    + 'cointegration is not tested here. Tap a row for the first leg.';
  box.append(note);

  return card('Pair spreads', (d.updated || '').slice(0, 10), box,
    'Computed from the same closes as the rest of the site. The pair list is from the '
    + 'pair-trading workbook; this only measures where each spread sits today.');
}

/* =====================================================================================
   WALK-FORWARD ACCURACY.
   forecast.json was written every night and no card ever read it - the Forecast tab showed only
   the TimesFM band. This is the part that says whether any model is worth looking at: each one
   beside the naive baseline, with the hit rate and the band coverage, and the words "no clear
   gain" when the gap is not real.
   ===================================================================================== */
async function walkForwardCard(){
  let f;
  try { f = await J('forecast.json'); } catch (_) { return null; }
  const models = f.models || [];
  if (!models.length) return null;

  const naive = f.naive_mape;
  const box = document.createElement('div');
  box.append(makeTable(models.map(m => ({
    model: m.model, mape: m.mape, hit: m.hit, cover80: m.cover80,
    origins: m.origins, gap: m.beats_naive_pp,
    verdict: m.model === 'naive' ? 'the baseline'
      : (m.no_clear_gain ? 'no clear gain over naive' : 'ahead of naive')
  })), [
    {k:'model', label:'Model'},
    {k:'mape', label:'MAPE', r:1, html:v => v == null ? '\u2014' : v.toFixed(2) + '%'},
    {k:'hit', label:'Direction', r:1, html:v => v == null ? '\u2014' : v.toFixed(0) + '%'},
    {k:'cover80', label:'80% band', r:1, html:v => v == null ? '\u2014' : v.toFixed(0) + '%'},
    {k:'gap', label:'vs naive', r:1, html:v => v == null ? '\u2014'
      : (v > 0 ? '+' : '') + v.toFixed(2) + ' pp'},
    {k:'verdict', label:''}
  ], {limit:12, noSearch:true}));

  const note = document.createElement('div');
  note.innerHTML =
    '<p style="margin:10px 0 8px;line-height:1.55">Naive is "last close, unchanged"'
    + (naive != null ? ' - it scores ' + naive.toFixed(2) + '% MAPE' : '')
    + '. A model that does not beat it by at least 0.5 points is not showing anything extra, '
    + 'whatever its MAPE looks like on its own.</p>'
    + '<p style="margin:0;line-height:1.55">Direction is how often the sign of the 21-session '
    + 'move was right. A model can be right on direction and wrong on size - the two rows often '
    + 'disagree, which is why both are shown. The 80% band column is how often the outcome '
    + 'actually landed inside the band; well below 80 means the band is too narrow to be honest.</p>';
  box.append(note);

  return card('Walk-forward accuracy', (models[0].origins || 0) + ' origins per symbol', box,
    'Each model was chosen on the earlier origins and scored on the later ones, so it is not '
    + 'judged on the numbers it was picked by.');
}

async function forecastPathsCard(){
  let f;
  try { f = await J('forecast.json'); } catch (_) { return null; }
  const syms = Object.keys(f.symbols || {});
  if (!syms.length) return null;

  const host = document.createElement('div');
  host.innerHTML = '<label class="sub" style="display:block;margin:0 0 6px">Pick a stock</label>';
  const sel = document.createElement('select');
  sel.id = 'fcSym';
  sel.style.cssText = 'width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);'
    + 'background:var(--card);color:inherit;font:inherit;font-size:13px';
  sel.innerHTML = syms.map(s => '<option value="' + esc(s) + '">' + esc(s) +
    (f.symbols[s].delisted ? ' (delisted)' : '') + '</option>').join('');
  host.append(sel);
  const out = document.createElement('div');
  out.style.marginTop = '12px';
  host.append(out);

  const paint = (sym) => {
    const b = f.symbols[sym] || {};
    const path = b.path || [];
    out.innerHTML = '';
    const meta = [];
    if (b.best_model) meta.push(['Model', esc(b.best_model)]);
    if (b.best_mape != null) meta.push(['MAPE on the later origins', b.best_mape + '%']);
    if (b.select_mape != null) meta.push(['Chosen on', b.select_mape + '% MAPE']);
    if (b.hit != null) meta.push(['Direction', b.hit.toFixed(0) + '%']);
    if (b.cover80 != null) meta.push(['Band coverage', b.cover80.toFixed(0) + '%']);
    if (b.beats_naive_pp != null) meta.push(['vs naive', (b.beats_naive_pp > 0 ? '+' : '')
      + b.beats_naive_pp.toFixed(2) + ' pp']);
    if (b.delisted) meta.push(['Note', 'delisted - history is thin']);
    if (meta.length){ const m = document.createElement('div'); m.innerHTML = rowKV(meta); out.append(m); }

    if (path.length){
      // four columns, not five - the band goes in one cell so the table fits a 360px phone
      out.append(makeTable(path.map(x => ({
        step: x.step, date: x.date || '\u2014', yhat: x.yhat,
        band: (x.lo80 == null || x.hi80 == null) ? null : (num(x.lo80) + ' \u2013 ' + num(x.hi80))
      })), [
        {k:'step', label:'#', r:1},
        {k:'date', label:'Date'},
        {k:'yhat', label:'Forecast', r:1, html:v => v == null ? '\u2014' : num(v)},
        {k:'band', label:'80% band', r:1, html:v => v == null ? '\u2014' : v}
      ], {limit:25, noSearch:true}));
    } else {
      const e = document.createElement('p'); e.className = 'empty';
      e.textContent = 'No path published for this symbol.';
      out.append(e);
    }
  };

  sel.addEventListener('change', () => paint(sel.value));
  host.append(document.createElement('div'));
  const c = card('Forecast paths', syms.length + ' symbols', host,
    'Dates come from the exchange calendar, so weekends and holidays are skipped. A date left '
    + 'blank could not be placed and was not guessed.');
  setTimeout(() => paint(syms[0]), 0);
  return c;

function heatMap(items, onPick){

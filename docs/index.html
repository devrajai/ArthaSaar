<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArthaSaar — market data</title>
<meta name="theme-color" content="#22252a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#22252a;--card:#2b2f36;--card2:#353a42;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.2);
  --ink:#eef1f6;--dim:#aab1bc;--dimmer:#7f8794;
  --accent:#6ea8fe;--accent-dim:rgba(110,168,254,.16);
  --up:#4fc98a;--down:#ea6b62;
  --sans:"Figtree",system-ui,-apple-system,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  --u:clamp(1px, 0.2326vw, 2.3px);
}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:calc(15.5 * var(--u));
  line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 420px at 85% -8%,rgba(110,168,254,.13),transparent 62%)}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.up{color:var(--up)}.down{color:var(--down)}.flat,.dim{color:var(--dim)}
.wrap{max-width:min(100%, calc(430 * var(--u)));margin:0 auto;padding:0 calc(12 * var(--u))}

/* bar */
.bar{position:sticky;top:0;z-index:50;background:rgba(35,38,44,.98);backdrop-filter:blur(16px)}
.brow{display:flex;align-items:center;gap:calc(10 * var(--u));padding:0 calc(14 * var(--u));
  height:calc(64 * var(--u));max-width:min(100%, calc(430 * var(--u)));margin:0 auto}
.brand{margin-right:auto}
.nhero b{display:block;font-size:clamp(13px,1.7vw,17px);font-weight:700}
.nhero span{display:block;margin-top:calc(3 * var(--u));font-size:clamp(11px,1.35vw,13px);color:var(--dim);line-height:1.45}
.ico{width:calc(32 * var(--u));height:calc(28 * var(--u));border:calc(1 * var(--u)) solid var(--line2);
  background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;justify-content:center;
  align-items:center;gap:calc(4 * var(--u));border-radius:calc(7 * var(--u))}
.ico span{display:block;width:calc(12 * var(--u));height:calc(1.5 * var(--u));background:var(--ink)}
.brand{display:flex;align-items:center;gap:calc(7 * var(--u));font-size:calc(15 * var(--u));font-weight:600}
.brand i{width:calc(8 * var(--u));height:calc(8 * var(--u));border-radius:calc(2 * var(--u));background:var(--accent)}
.date{margin-left:auto;font:500 calc(9 * var(--u))/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);border:calc(1 * var(--u)) solid var(--line);border-radius:999px;padding:calc(5 * var(--u)) calc(8 * var(--u));white-space:nowrap}
.newsbtn{display:flex;align-items:center;gap:calc(6 * var(--u));background:var(--accent);color:#0f1720;border:0;
  border-radius:999px;padding:calc(7 * var(--u)) calc(11 * var(--u));cursor:pointer;
  font:600 calc(10 * var(--u))/1 var(--sans);letter-spacing:.06em;text-transform:uppercase}
.newsbtn b{font:600 calc(9 * var(--u))/1 var(--mono);background:rgba(0,0,0,.18);border-radius:999px;padding:calc(2 * var(--u)) calc(5 * var(--u))}

/* content */
main{padding:calc(12 * var(--u)) 0 calc(40 * var(--u))}
.card{background:var(--card);border:calc(1 * var(--u)) solid var(--line);border-radius:calc(16 * var(--u));
  padding:calc(15 * var(--u));margin-bottom:calc(11 * var(--u));min-width:0}
.ch{display:flex;align-items:baseline;gap:calc(8 * var(--u));margin-bottom:calc(10 * var(--u));flex-wrap:wrap}
.ch h1,.ch h2{margin:0;font-size:calc(17 * var(--u));font-weight:600;letter-spacing:-.015em}
.ch .tag{margin-left:auto;font:500 calc(9.5 * var(--u))/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--dimmer);border:calc(1 * var(--u)) solid var(--line);border-radius:999px;padding:calc(4 * var(--u)) calc(7 * var(--u))}
.note{margin:calc(10 * var(--u)) 0 0;font:400 calc(11 * var(--u))/1.6 var(--mono);color:var(--dim)}
.hero .lab{font:500 calc(9 * var(--u))/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dimmer)}
.hero .big{font-size:calc(44 * var(--u));font-weight:700;letter-spacing:-.045em;line-height:1;margin-top:calc(6 * var(--u));
  font-variant-numeric:tabular-nums}
.hero .row1{display:flex;align-items:baseline;gap:calc(10 * var(--u))}
.chip{font:500 calc(12 * var(--u))/1 var(--mono);padding:calc(5 * var(--u)) calc(7 * var(--u));border-radius:calc(7 * var(--u))}
.chip.up{background:rgba(79,201,138,.16)}.chip.down{background:rgba(234,107,98,.16)}
.hmeta{margin-top:calc(8 * var(--u));font:400 calc(11 * var(--u))/1.6 var(--mono);color:var(--dim)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:calc(8 * var(--u));margin-top:calc(12 * var(--u))}
.tiles>div{background:var(--card2);border-radius:calc(11 * var(--u));padding:calc(10 * var(--u))}
.tiles span{display:block;font:500 calc(9 * var(--u))/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.tiles b span{font:inherit;letter-spacing:inherit}
.tiles b{display:block;font:700 calc(18 * var(--u))/1.2 var(--sans);margin-top:calc(6 * var(--u));font-variant-numeric:tabular-nums}
.tiles i{display:block;font:400 calc(9.5 * var(--u))/1.35 var(--mono);font-style:normal;color:var(--dimmer);margin-top:calc(4 * var(--u))}
svg.spark{display:block;width:100%;height:calc(70 * var(--u));margin-top:calc(12 * var(--u))}

/* tables */
.tbar{display:flex;align-items:center;gap:calc(8 * var(--u));margin-bottom:calc(8 * var(--u))}
.q{flex:1;min-width:0;background:var(--card2);border:calc(1 * var(--u)) solid var(--line);border-radius:calc(10 * var(--u));
  padding:calc(9 * var(--u)) calc(11 * var(--u));color:var(--ink);font:400 calc(13 * var(--u))/1.3 var(--sans);outline:none}
.q::placeholder{color:var(--dimmer)}
.cnt{font:500 calc(10 * var(--u))/1 var(--mono);color:var(--dimmer);white-space:nowrap}
.tbl{overflow-x:auto;border-top:calc(1 * var(--u)) solid var(--line2)}
table{width:100%;min-width:max-content;border-collapse:collapse;font-size:clamp(11px, 1.5vw, 15px)}
th{position:sticky;top:0;background:var(--card);text-align:left;font:500 clamp(9px, 1.15vw, 12px)/1 var(--mono);
  letter-spacing:.08em;text-transform:uppercase;color:var(--dimmer);padding:calc(9 * var(--u)) calc(8 * var(--u));
  border-bottom:calc(1 * var(--u)) solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
th.r{text-align:right}
th:hover{color:var(--ink)}
td{padding:calc(9 * var(--u)) calc(8 * var(--u));border-bottom:calc(1 * var(--u)) solid var(--line);
  vertical-align:top;overflow-wrap:anywhere}
td.r{text-align:right;font-family:var(--mono);font-size:clamp(10px, 1.35vw, 13.5px);white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:rgba(255,255,255,.03)}
.more{display:block;width:100%;margin-top:calc(10 * var(--u));background:var(--card2);border:calc(1 * var(--u)) solid var(--line2);
  color:var(--accent);border-radius:calc(10 * var(--u));padding:calc(10 * var(--u));cursor:pointer;font:600 calc(12 * var(--u))/1 var(--sans)}
.empty{color:var(--dim);font-size:calc(13.5 * var(--u));padding:calc(20 * var(--u)) 0;text-align:center}
.err{color:var(--down);font-size:calc(13 * var(--u))}

/* drawer */
.drawer{position:fixed;top:0;left:0;bottom:0;width:calc(322 * var(--u));max-width:86%;background:#20242a;
  border-right:calc(1 * var(--u)) solid var(--line2);z-index:80;transform:translateX(-100%);
  transition:transform .24s ease;overflow-y:auto;padding-bottom:calc(30 * var(--u))}
.drawer.on{transform:translateX(0)}
.dh{display:flex;align-items:center;gap:calc(10 * var(--u));padding:calc(16 * var(--u));
  border-bottom:calc(1 * var(--u)) solid var(--line2);position:sticky;top:0;background:#20242a}
.dh .as{width:calc(30 * var(--u));height:calc(30 * var(--u));border-radius:calc(8 * var(--u));background:var(--accent-dim);
  color:var(--accent);display:grid;place-items:center;font:600 calc(10 * var(--u))/1 var(--mono)}
.dh b{font-size:calc(14 * var(--u));font-weight:600}
.dh button{margin-left:auto;background:none;border:0;color:var(--ink);font-size:calc(20 * var(--u));cursor:pointer}
.dg{padding:calc(12 * var(--u)) calc(16 * var(--u)) calc(4 * var(--u))}
.dg h4{margin:0 0 calc(2 * var(--u));font:600 calc(9.5 * var(--u))/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer)}
.dg a{display:block;padding:calc(10 * var(--u)) 0;font-size:calc(15 * var(--u));color:#e7ecdf;
  border-bottom:calc(1 * var(--u)) solid rgba(255,255,255,.05)}
.dg a.on{color:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:.2s;z-index:75}
.scrim.on{opacity:1;pointer-events:auto}
.loading{color:var(--dim);font:400 calc(12 * var(--u))/1.6 var(--mono);padding:calc(16 * var(--u)) 0}

/* ---------- news screen ---------- */
.ntabs2{display:flex;gap:calc(8 * var(--u));margin-bottom:calc(11 * var(--u))}
.ntabs2 button{flex:1;background:var(--card);border:calc(1 * var(--u)) solid var(--line);color:var(--dim);
  border-radius:calc(11 * var(--u));padding:calc(11 * var(--u)) calc(8 * var(--u));cursor:pointer;
  font:600 clamp(11px,1.45vw,15px)/1 var(--sans)}
.ntabs2 button.on{background:var(--accent-dim);border-color:rgba(110,168,254,.45);color:var(--accent)}
.npane{display:none}.npane.on{display:block}
.nic{flex:0 0 auto;width:calc(40 * var(--u));height:calc(40 * var(--u));border-radius:calc(11 * var(--u));
  display:grid;place-items:center;background:var(--accent-dim);color:var(--accent)}
.nic svg{width:calc(20 * var(--u));height:calc(20 * var(--u));fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nsearch{display:flex;align-items:center;gap:calc(8 * var(--u));background:var(--card);
  border:calc(1 * var(--u)) solid var(--line);border-radius:calc(11 * var(--u));
  padding:calc(10 * var(--u)) calc(12 * var(--u));margin-bottom:calc(10 * var(--u));color:var(--dimmer)}
.nsearch svg{width:calc(15 * var(--u));height:calc(15 * var(--u));fill:none;stroke:currentColor;stroke-width:1.8;flex:0 0 auto}
.nsearch input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);
  font:400 clamp(11.5px,1.45vw,14px)/1.3 var(--sans)}
.nsearch input::placeholder{color:var(--dimmer)}
.nchips{display:flex;gap:calc(7 * var(--u));margin-bottom:calc(11 * var(--u));overflow-x:auto;scrollbar-width:none}
.nchips::-webkit-scrollbar{display:none}
.nchips button{flex:0 0 auto;display:inline-flex;align-items:center;gap:calc(6 * var(--u));background:var(--card);
  border:calc(1 * var(--u)) solid var(--line);color:var(--dim);border-radius:999px;
  padding:calc(8 * var(--u)) calc(12 * var(--u));font:500 clamp(10.5px,1.3vw,12.5px)/1 var(--sans);cursor:pointer}
.nchips button.on{background:var(--accent-dim);border-color:rgba(110,168,254,.45);color:var(--accent)}
.d{width:calc(7 * var(--u));height:calc(7 * var(--u));border-radius:50%;display:inline-block;flex:0 0 auto}
.d.blue{background:#6ea8fe}.d.green{background:#4fc98a}.d.red{background:#ea6b62}.d.amber{background:#e2b04a}
.nchips button:disabled{opacity:.38;cursor:default}
.nchips button:disabled:hover{border-color:var(--line)}
.nreset{background:var(--accent-dim);border:calc(1 * var(--u)) solid rgba(110,168,254,.45);
  color:var(--accent);border-radius:999px;padding:calc(7 * var(--u)) calc(13 * var(--u));
  font:600 clamp(10.5px,1.3vw,12.5px)/1 var(--sans);cursor:pointer;margin-left:calc(4 * var(--u))}
.nlist{list-style:none;margin:0;padding:0}
.nlist li{background:var(--card);border:calc(1 * var(--u)) solid var(--line);border-radius:calc(12 * var(--u));
  padding:calc(12 * var(--u));margin-bottom:calc(8 * var(--u))}
.nlist .ns{display:block;font:500 clamp(9px,1.15vw,10.5px)/1 var(--mono);letter-spacing:.08em;
  text-transform:uppercase;color:var(--dimmer);margin-bottom:calc(6 * var(--u))}
.nlist .nt{font-size:clamp(12px,1.55vw,14.5px);line-height:1.45;color:var(--ink)}
.nempty{text-align:center;color:var(--dim);font-size:clamp(12px,1.5vw,14px);padding:calc(28 * var(--u)) 0}
.nrange{display:flex;gap:calc(6 * var(--u));margin-bottom:calc(10 * var(--u))}
.nrange button{flex:1;background:var(--card);border:calc(1 * var(--u)) solid var(--line);color:var(--dim);
  border-radius:calc(9 * var(--u));padding:calc(9 * var(--u)) calc(3 * var(--u));
  font:500 clamp(9.5px,1.2vw,11.5px)/1 var(--sans);cursor:pointer}
.nrange button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.nsum{display:flex;align-items:baseline;gap:calc(10 * var(--u));font-size:clamp(11px,1.35vw,13px);
  color:var(--dim);margin-bottom:calc(10 * var(--u))}
.nsum b{color:var(--ink);font-weight:600}
.nsum button{margin-left:auto;background:none;border:0;color:var(--accent);
  font:600 clamp(10.5px,1.3vw,12.5px)/1 var(--sans);cursor:pointer}
.nac details{background:var(--card);border:calc(1 * var(--u)) solid var(--line);border-radius:calc(13 * var(--u));
  margin-bottom:calc(9 * var(--u));overflow:hidden}
.nac summary{list-style:none;display:flex;align-items:center;gap:calc(9 * var(--u));padding:calc(12 * var(--u));
  cursor:pointer;font:600 clamp(11.5px,1.45vw,14px)/1 var(--sans)}
.nac summary::-webkit-details-marker{display:none}
.nac summary em{margin-left:auto;font-style:normal;font:500 clamp(9.5px,1.2vw,11px)/1 var(--mono);
  color:var(--dimmer);border:calc(1 * var(--u)) solid var(--line);border-radius:999px;
  padding:calc(3 * var(--u)) calc(7 * var(--u))}
.nac ul{list-style:none;margin:0;padding:0 calc(12 * var(--u)) calc(6 * var(--u))}
.nac li{display:flex;align-items:baseline;gap:calc(10 * var(--u));padding:calc(9 * var(--u)) 0;
  border-top:calc(1 * var(--u)) solid var(--line);font-size:clamp(11px,1.4vw,13.5px)}
.nac li b{font-weight:600;min-width:calc(90 * var(--u))}
.nac li span{flex:1;min-width:0;color:var(--dim);font-size:clamp(10px,1.3vw,12.5px);line-height:1.35}
.nac li i{font-style:normal;font:500 clamp(9.5px,1.2vw,11.5px)/1 var(--mono);color:var(--dimmer);white-space:nowrap}

/* ---------- stock sheet: tap a symbol anywhere and the whole picture opens ---------- */
#sheet{position:fixed;inset:0;z-index:60;display:none;background:var(--bg)}
#sheet.on{display:block}
#sheetBox{width:100%;height:100%;overflow:auto;background:var(--bg);
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
  position:relative;-webkit-overflow-scrolling:touch}
@media(min-width:820px){#sheetBox{max-width:760px;margin:0 auto}}
/* heat map: one tile per sector, colour and depth carry the size of the move */
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.heat a{display:block;text-decoration:none;color:inherit;border-radius:9px;padding:9px 8px;
  border:1px solid rgba(255,255,255,.08);min-height:62px;cursor:pointer}
.heat b{display:block;font-size:11px;font-weight:600;line-height:1.25;opacity:.95;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.heat i{display:block;font-style:normal;font-size:14px;font-weight:700;margin-top:5px;
  font-variant-numeric:tabular-nums}
.heat .up{background:rgba(78,201,160,.16);border-color:rgba(78,201,160,.34)}
.heat .dn{background:rgba(240,115,106,.16);border-color:rgba(240,115,106,.34)}
.heat .up.hot{background:rgba(78,201,160,.34);border-color:rgba(78,201,160,.55)}
.heat .dn.hot{background:rgba(240,115,106,.34);border-color:rgba(240,115,106,.55)}
.heat .flat{background:rgba(255,255,255,.05)}
#sheetBox h3{margin:0 0 2px;font-size:19px;letter-spacing:-.3px}
#sheetBox .sub{font-size:12px;opacity:.6;margin-bottom:14px}
#sheetBox .x{position:absolute;right:16px;top:12px;background:none;border:0;
  color:inherit;font-size:26px;line-height:1;opacity:.55;cursor:pointer}
#sheetBox .px{font-size:32px;font-weight:700;letter-spacing:-1px;margin:2px 0 4px}
#sheetBox .up{color:#4ec9a0}#sheetBox .dn{color:#f0736a}
#sheetBox h5{margin:16px 0 7px;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;opacity:.55}
#sheetBox .kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.07);
  border-radius:10px;overflow:hidden}
#sheetBox .kv>div{background:var(--card);padding:9px 11px;display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
#sheetBox .kv span:first-child{opacity:.6}
#sheetBox .kv span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
#sheetBox .na{opacity:.35}
td.sym{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;
  text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.3)}
</style>
</head>
<body>
<header class="bar">
  <div class="brow">
    <button class="ico" id="menuBtn" aria-label="Sections"><span></span><span></span><span></span></button>
    <span class="brand"><i></i>ArthaSaar</span>
    <button class="newsbtn" id="newsBtn">News</button>
  </div>
</header>

<div class="wrap"><main id="main"></main></div>

<aside class="drawer" id="drawer">
  <div class="dh"><span class="as">AS</span><b>All sections</b><button id="dclose">×</button></div>
  <div id="drawerItems"></div>
</aside>
<div class="scrim" id="scrim"></div>

<div id="sheet" aria-hidden="true"><div id="sheetBox"><button class="x" id="sheetX" aria-label="Close">&times;</button><div id="sheetBody"></div></div></div>

<script>
const FILES = ["_guard_report.json", "affordable.json", "attention.json", "audit.json", "backtest.json", "behaviour.json", "breadth.json", "breakers.json", "brief.json", "calendar.json", "cases.json", "charges.json", "charts.json", "checklist.json", "circuits.json", "claim_ledger.json", "claim_vs_base.json", "claims.json", "commodities.json", "config.json", "corp_actions.json", "corrections.json", "correlation.json", "crypto.json", "crypto_history.json", "data.json", "data_asof.json", "data_errors.json", "data_gaps.json", "data_health.json", "deals.json", "deals_followup.json", "delivery.json", "earlymove.json", "etf.json", "etf_premium.json", "events.json", "feed_history.json", "fii_dii.json", "fo_ban.json", "forecast.json", "fundamentals.json", "gann_fib.json", "gaps.json", "global.json", "global_market.json", "gti.json", "health.json", "history.json", "home_facts.json", "index_history.json", "indices.json", "insider.json", "ipo.json", "ipo_doc.json", "leadlag.json", "learn.json", "levels.json", "listings.json", "macro.json", "manifest.json", "market_stats.json", "market_status.json", "metals.json", "mf.json", "money_radar.json", "muhurat.json", "news_feed.json", "oi_by_expiry.json", "oi_history.json", "oi_stats.json", "oi_strikes.json", "oi_walls.json", "option_chain.json", "patterns.json", "patterns_reference.json", "pcr_signal.json", "premium_base_rates.json", "premium_movers.json", "presentations.json", "ranges.json", "rank_momentum.json", "rebalance.json", "recap.json", "report_cards.json", "rollover.json", "rs.json", "scenarios.json", "scoreboard.json", "scorecard.json", "screener.json", "search.json", "seasonality.json", "sebi.json", "sector_fund.json", "sector_rotation.json", "sector_trend.json", "sectors.json", "series.json", "setup_history.json", "shareholding.json", "snapshot.json", "stocks.json", "story.json", "strategies.json", "telegram.json", "telegram_accuracy.json", "telegram_pcr.json", "telegram_vs_chain.json", "timemachine.json", "timesfm_score.json", "universe.json", "unusual.json", "version.json", "video_vs_chain.json", "vix.json", "volume_profile.json", "vrp.json", "watchlists.json", "weekday.json", "whatif.json"];
const $ = s => document.querySelector(s);
const cache = {};
async function J(p){
  if (cache[p]) return cache[p];
  const r = await fetch(p, {cache:'no-store'});
  if (!r.ok) throw new Error(p + ' → HTTP ' + r.status);
  const txt = await r.text();
  let d;
  try { d = JSON.parse(txt); }
  catch (_) {
    // some pipeline files carry NaN / Infinity, which JSON.parse refuses
    d = JSON.parse(txt.replace(/([:\[,]\s*)(-?Infinity|NaN)\b/g, '$1null'));
  }
  cache[p] = d;
  return d;
}
const unesc = s => String(s).replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
const dshort = iso => { const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; const p=String(iso).split('-'); return p.length===3 ? (parseInt(p[2],10)+' '+M[parseInt(p[1],10)-1]+' '+p[0].slice(2)) : iso; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function num(v, d){
  if (v === null || v === undefined || v === '') return '—';
  const n = Number(v);
  if (!isFinite(n)) return esc(v);
  d = (d === undefined) ? (Math.abs(n) >= 100 ? 2 : 2) : d;
  return n.toLocaleString('en-IN', {minimumFractionDigits:d, maximumFractionDigits:d});
}
function pct(v, d){
  if (v === null || v === undefined || v === '') return '—';
  const n = Number(v);
  if (!isFinite(n)) return esc(v);
  const c = n > 0 ? 'up' : (n < 0 ? 'down' : 'flat');
  const s = n > 0 ? '+' : (n < 0 ? '−' : '');
  return '<span class="' + c + '">' + s + Math.abs(n).toFixed(d === undefined ? 2 : d) + '%</span>';
}
function label(k){
  return String(k).replace(/[_-]/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2')
    .replace(/\b\w/g, c => c.toUpperCase());
}
function isNum(v){ return typeof v === 'number' || (typeof v === 'string' && v !== '' && isFinite(v)); }
function cellHTML(v){
  if (v === null || v === undefined || v === '') return '—';
  if (typeof v === 'object') return esc(JSON.stringify(v).slice(0, 80));
  if (typeof v === 'boolean') return v ? 'yes' : 'no';
  if (isNum(v)) {
    const n = Number(v);
    if (Math.abs(n) >= 1000) return num(n, 2);
    return String(v);
  }
  return esc(v);
}

/* ---------- generic table ---------- */
function makeTable(records, cols, opt){
  opt = opt || {};
  const wrap = document.createElement('div');
  const bar = document.createElement('div'); bar.className = 'tbar';
  const q = document.createElement('input'); q.className = 'q';
  q.placeholder = opt.placeholder || 'Search…';
  const cnt = document.createElement('span'); cnt.className = 'cnt';
  bar.append(q, cnt); wrap.append(bar);
  const tblBox = document.createElement('div'); tblBox.className = 'tbl'; wrap.append(tblBox);

  let limit = opt.limit || 120, sortKey = null, dir = 1, term = '';

  function rowsFiltered(){
    let rs = records;
    if (term){
      rs = rs.filter(r => JSON.stringify(r).toLowerCase().includes(term));
    }
    if (sortKey){
      rs = rs.slice().sort((a,b) => {
        const x = a[sortKey], y = b[sortKey];
        const nx = Number(x), ny = Number(y);
        if (isFinite(nx) && isFinite(ny)) return (nx - ny) * dir;
        return String(x).localeCompare(String(y)) * dir;
      });
    }
    return rs;
  }
  function draw(){
    const rs = rowsFiltered();
    cnt.textContent = rs.length.toLocaleString('en-IN') + ' rows';
    const t = document.createElement('table');
    const thead = document.createElement('thead'); const tr = document.createElement('tr');
    cols.forEach(c => {
      const th = document.createElement('th');
      th.textContent = c.label;
      if (c.r) th.className = 'r';
      th.onclick = () => { if (sortKey === c.k) dir = -dir; else { sortKey = c.k; dir = 1; } draw(); };
      tr.append(th);
    });
    thead.append(tr); t.append(thead);
    const tb = document.createElement('tbody');
    rs.slice(0, limit).forEach(r => {
      const row = document.createElement('tr');
      if (opt.onRow){ row.style.cursor = 'pointer'; row.title = 'Tap for the full detail';
        row.onclick = (ev) => { if (ev.target.closest('a')) return; opt.onRow(r); }; }
      cols.forEach(c => {
        const td = document.createElement('td');
        if (c.r) td.className = 'r';
        td.innerHTML = c.html ? c.html(r[c.k], r) : cellHTML(r[c.k]);
        row.append(td);
      });
      tb.append(row);
    });
    t.append(tb);
    tblBox.innerHTML = '';
    tblBox.append(t);
    if (!rs.length){
      const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'No rows match that search.';
      tblBox.append(p);
    }
    if (rs.length > limit){
      const b = document.createElement('button'); b.className = 'more';
      b.textContent = 'Show ' + Math.min(200, rs.length - limit) + ' more of ' + rs.length.toLocaleString('en-IN');
      b.onclick = () => { limit += 200; draw(); };
      wrap.append(b);
    } else {
      const old = wrap.querySelector('.more'); if (old) old.remove();
    }
  }
  q.oninput = () => { term = q.value.trim().toLowerCase(); limit = opt.limit || 120; draw(); };
  draw();
  return wrap;
}

/* ---------- helpers ---------- */
function card(title, tag, bodyNode, note){
  const c = document.createElement('section'); c.className = 'card';
  const h = document.createElement('div'); h.className = 'ch';
  h.innerHTML = '<h2>' + esc(title) + '</h2>' + (tag ? '<span class="tag">' + esc(tag) + '</span>' : '');
  c.append(h);
  if (bodyNode) c.append(bodyNode);
  if (note){ const p = document.createElement('p'); p.className = 'note'; p.innerHTML = note; c.append(p); }
  return c;
}
function tiles(items){
  const d = document.createElement('div'); d.className = 'tiles';
  d.innerHTML = items.map(t => '<div><span>' + esc(t[0]) + '</span><b>' + t[1] + '</b><i>' + esc(t[2] || '') + '</i></div>').join('');
  return d;
}
function arrOf(data){
  if (Array.isArray(data)) return data;
  if (data && Array.isArray(data.rows)) return data.rows;
  for (const k of ['items','sectors','indices','bulk','block','up','down','orders','asm','gsm','rows',
                   'series','days','upcoming','open','closed','listed','strategies','sections','glossary',
                   'months','rows','strikes','constituents','files']){
    if (data && Array.isArray(data[k])) return data[k];
  }
  return null;
}
function recordsFrom(data){
  const a = arrOf(data);
  if (!a) return null;
  if (!a.length) return [];
  const first = a[0];
  if (Array.isArray(first)){
    const cols = (data && data.columns && data.columns.length) ? data.columns : first.map((_, i) => 'col ' + (i+1));
    return a.map(r => { const o = {}; cols.forEach((c, i) => o[c] = r[i]); return o; });
  }
  if (typeof first === 'object') return a;
  return a.map((v, i) => ({'#': i + 1, value: v}));
}
function autoCols(records, max){
  if (!records.length) return [];
  const keys = Object.keys(records[0]).slice(0, max || 9);
  return keys.map(k => ({k, label: label(k), r: records.some(r => isNum(r[k]))}));
}

     'weakest group'],

  if (rows.length){
    function bucket(field){
      let above = 0, below = 0, na = 0;
      rows.forEach(r => {
        const v = r.close, m = r.tech[field];
        if (v == null || m == null){ na++; return; }
        if (v >= m) above++; else below++;
      });
      return {above, below, na, total: rows.length};

    const b20 = bucket('sma_20'), b50 = bucket('sma_50'), b200 = bucket('sma_200');

      'Computed from stocks.json rather than the summary file, so the counts are visible and the '

  // sector breadth - which sectors are actually participating
  const sec = (secs.sectors || []).slice().sort((a,b) => (b.advances||0)/(b.count||1) - (a.advances||0)/(a.count||1));

        avg_chg: s.avg_chg})),
        [{k:'name',label:'Sector'},{k:'count',label:'Stocks',r:1},{k:'advances',label:'Adv',r:1},
         {k:'declines',label:'Dec',r:1},{k:'adv_pct',label:'% up',r:1,html:v=>v==null?'\u2014':v+'%'},

      'A sector where most stocks rise is participating. One carried by a single heavyweight is not.'));
  }

  // extremes
  const srows = (scr.rows || []).filter(r => r && r.symbol && r.chg_pct != null);
  if (srows.length){

      makeTable(sorted.slice(0,10).map(r=>({symbol:r.symbol,name:r.name,close:r.close,chg_pct:r.chg_pct})),
        [{k:'symbol',label:'Symbol'},{k:'name',label:'Name'},{k:'close',label:'Close',r:1},
         {k:'chg_pct',label:'Change',r:1,html:v=>pct(v)}],
        {limit:10, onRow: r => openStock(r.symbol)}), 'Tap a row for the full-screen detail.'));
    main.append(card('Weakest', 'bottom 10 today',
      makeTable(sorted.slice(-10).reverse().map(r=>({symbol:r.symbol,name:r.name,close:r.close,chg_pct:r.chg_pct})),
        [{k:'symbol',label:'Symbol'},{k:'name',label:'Name'},{k:'close',label:'Close',r:1},

/* =====================================================================================
   INDICES - a heat map you can walk down.
   indices.json already carried a `heat` array and a `constituents` list per index; the page
   rendered neither. Tap an index and its stocks open; tap a stock and the full-screen detail
   opens on top of that.
   ===================================================================================== */
function heatMap(items, onPick){
  const wrap = document.createElement('div'); wrap.className = 'heat';
  items.forEach(x => {
    const v = Number(x.chg_pct);
    const a = document.createElement('a');
    a.className = (isFinite(v) && v !== 0) ? (v > 0 ? 'up' : 'dn') : 'flat';
    if (isFinite(v) && Math.abs(v) >= 1.5) a.classList.add('hot');
    a.innerHTML = '<b>' + esc(x.name) + '</b><i>' +
      (isFinite(v) ? (v > 0 ? '+' : '') + v.toFixed(2) + '%' : '\u2014') + '</i>';
    if (onPick) a.onclick = () => onPick(x);
    wrap.append(a);
  });
  return wrap;
}

/* One place that builds an index's member list, so Market and Indices behave identically.
   Rows open the full-screen stock detail through the same makeTable hook. */
/* A price line from the 120 daily closes the repo already carries. Small enough to sit inside
   a detail card, and it answers the question a table of numbers cannot: what has this thing
   actually done lately. */
function sparkline(vals, opts){
  opts = opts || {};
  const w = opts.w || 320, hgt = opts.h || 64, pad = 4;
  const ys = (vals || []).map(Number).filter(v => isFinite(v));
  if (ys.length < 2) return null;
  const lo = Math.min(...ys), hi = Math.max(...ys);
  const span = (hi - lo) || 1;
  const x = i => pad + i * (w - pad * 2) / (ys.length - 1);
  const y = v => hgt - pad - (v - lo) / span * (hgt - pad * 2);
  const pts = ys.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
  const up = ys[ys.length - 1] >= ys[0];
  const col = up ? '#4ec9a0' : '#f0736a';
  const area = 'M' + x(0).toFixed(1) + ',' + (hgt - pad) + ' L' + pts.replace(/ /g, ' L') +
               ' L' + x(ys.length - 1).toFixed(1) + ',' + (hgt - pad) + ' Z';
  const svg = document.createElement('div');
  svg.innerHTML =
    '<svg viewBox="0 0 ' + w + ' ' + hgt + '" width="100%" height="' + hgt + '" ' +
    'preserveAspectRatio="none" style="display:block;margin:2px 0 6px">' +
    '<path d="' + area + '" fill="' + col + '" opacity=".13"/>' +
    '<polyline points="' + pts + '" fill="none" stroke="' + col + '" stroke-width="1.8" ' +
    'stroke-linejoin="round" stroke-linecap="round"/></svg>';
  const box = document.createElement('div');
  const rng = document.createElement('div');
  rng.className = 'sub';
  rng.style.margin = '0 0 4px';
  rng.textContent = ys.length + ' sessions \u00b7 low ' + lo.toFixed(2) + ' \u00b7 high ' + hi.toFixed(2) +
    ' \u00b7 ' + ((ys[ys.length-1] / ys[0] - 1) * 100).toFixed(1) + '% over the window';
  box.append(svg.firstChild, rng);
  return box;
}

async function renderFunds(main, file, title, opts){
  opts = opts || {};
  const d = await J(file);
  const rows = arrOf(d) || [];

  // How many of these actually beat the index? The feed carries the flag; the page never showed
  // it, so "best performer" was a column of numbers with nothing to measure them against.
  if (rows.length && ('beats_nifty_5y' in rows[0] || 'beats_nifty_3y' in rows[0])){
    const pctOf = k => {
      const known = rows.filter(r => r[k] !== undefined && r[k] !== null);
      if (!known.length) return null;
      const yes = known.filter(r => r[k]).length;
      return {yes, total: known.length, pct: +(yes / known.length * 100).toFixed(1)};
    };
    const b5 = pctOf('beats_nifty_5y'), b3 = pctOf('beats_nifty_3y'), b1 = pctOf('beats_nifty_1y');
    const t = [];
    if (b1) t.push(['Beat Nifty 1Y', b1.pct + '%', b1.yes + ' of ' + b1.total]);
    if (b3) t.push(['Beat Nifty 3Y', b3.pct + '%', b3.yes + ' of ' + b3.total]);
    if (b5) t.push(['Beat Nifty 5Y', b5.pct + '%', b5.yes + ' of ' + b5.total]);
    if (t.length) main.append(card(title + ' vs the index', 'how many beat Nifty', tiles(t),
      'Over a long enough window most active funds trail the index they are measured against. '
      + 'This is the count, not a recommendation.'));
  }

  // best and worst by the longest return the feed carries
  const rk = ['r5y','r3y','r1y'].find(k => rows.some(r => r[k] != null));
  if (rk && rows.length > 6){
    const withR = rows.filter(r => r[rk] != null).sort((a,b) => b[rk] - a[rk]);
    const cols = [{k:'name',label:'Name'},{k:'fund_house',label:'House'},{k:rk,label:rk.toUpperCase()+' return',r:1,html:v=>pct(v)},
                  {k:'nav',label:'NAV',r:1}];
    main.append(card(title + ' \u00b7 best ' + rk.toUpperCase(),
      withR.length + ' ranked',
      makeTable(withR.slice(0,10), cols, {limit:10, onRow: r => openDetail(r, r.name, r.fund_house)}),
      'Ranked on the longest return the feed carries, so a fund with a short record is not '
      + 'flattered by a single good year.'));
    main.append(card(title + ' \u00b7 worst ' + rk.toUpperCase(),
      withR.length + ' ranked',
      makeTable(withR.slice(-10).reverse(), cols, {limit:10, onRow: r => openDetail(r, r.name, r.fund_house)}),
      'Shown deliberately: a list of winners alone is not a comparison.'));
  }
  const cols = opts.cols || (rows[0] ? Object.keys(rows[0]).slice(0,8).map(k => ({k, label:label(k)})) : []);
  main.append(card(title, (d.count || rows.length) + ' rows',
    makeTable(rows, cols, {
      limit: 150,
      placeholder: opts.placeholder || 'Search\u2026',
      onRow: r => openDetail(r, r.name || r.symbol || r.code,
                             r.fund_house || r.underlying || r.category || '')
    }),
    file + ' \u00b7 tap any row for the full detail. ' + (d.note || '')));
}

    '<input id="nq" type="search" placeholder="Search by stock, company or keyword…"></label>' +
    '<div class="nchips" id="nchips">' +
      '<button class="on" data-cat="all">All ' + n.count + '</button>' +
      chip('results','blue','Results',n.counts.results) +
      chip('general','amber','General',n.counts.general) +
      chip('global','green','Global',n.counts.global) +
      chip('policy','red','Policy',n.counts.policy) +
    '</div><ul class="nlist" id="nlist"></ul><p class="nempty" id="nempty" hidden>No updates matching your criteria.</p>';

  // A chip showing 0 used to be clickable, and tapping it produced "No updates matching your
  // criteria" with no way back except guessing. A filter that can only ever return nothing is
  // now disabled and dimmed instead.
  function chip(cat, dot, label, count){
    const c = count || 0;
    return '<button data-cat="' + cat + '"' + (c ? '' : ' disabled') + '>' +
      '<i class="d ' + dot + '"></i>' + label + ' ' + c + '</button>';
  }

  const ul = live.querySelector('#nlist');
  n.items.forEach(it => {
    const li = document.createElement('li');
    li.dataset.cat = it.category;
    li.innerHTML = '<span class="ns">' + esc(it.source) + ' · ' + esc(dshort(String(it.published).slice(0,10))) + '</span>' +
                   '<span class="nt">' + esc(unesc(it.title)) + '</span>';
    ul.append(li);
  });

  const chips = live.querySelector('#nchips'), q = live.querySelector('#nq'), empty = live.querySelector('#nempty');
  let cat = 'all';
  function apply(){
    const term = q.value.trim().toLowerCase(); let shown = 0;
    [].forEach.call(ul.children, li => {
      const ok = (cat === 'all' || li.dataset.cat === cat) && (!term || li.textContent.toLowerCase().includes(term));
      li.style.display = ok ? '' : 'none'; if (ok) shown++;
    });
    empty.hidden = shown > 0;
    if (!shown){
      const name = (cat === 'all') ? '' : (' ' + cat.charAt(0).toUpperCase() + cat.slice(1));
      empty.innerHTML = term
        ? ('Nothing matches \u201c' + esc(q.value.trim()) + '\u201d' +
           (cat === 'all' ? '.' : ' in ' + esc(cat) + '.') +
           ' <button class="nreset">Clear search</button>')
        : ('No' + esc(name) + ' headlines today.' +
           (cat === 'all' ? '' : ' <button class="nreset">Show all ' + n.count + '</button>'));
    }
  }
  chips.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    [].forEach.call(chips.querySelectorAll('button'), x => x.classList.remove('on'));
    b.classList.add('on'); cat = b.dataset.cat || 'all'; apply();
  });
  // the way back from an empty result
  empty.addEventListener('click', e => {
    if (!e.target.closest('.nreset')) return;
    q.value = ''; cat = 'all';
    [].forEach.call(chips.querySelectorAll('button'), x => x.classList.toggle('on', x.dataset.cat === 'all'));
    apply();
  });
  q.addEventListener('input', apply);

  /* ---- events pane ---- */
  const ev = document.createElement('section'); ev.className = 'npane'; ev.dataset.pane = 'events';
  const rows = [];
  (cal.days || []).forEach(d => (d.events || []).forEach(e => rows.push(e)));
  const LABEL = {results:'Financial results', split:'Stock split', dividend:'Dividend', other:'Buy back / other'};
  const DOT = {results:'blue', split:'amber', dividend:'green', other:'red'};
  const groups = {};
  rows.forEach(e => (groups[e.type] = groups[e.type] || []).push(e));
  const order = Object.keys(groups).sort((a,b) => groups[b].length - groups[a].length);
  const dates = rows.map(r => r.date).sort();

  ev.innerHTML =
    '<div class="nhero"><span class="nic"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/>' +
    '<path d="M3.5 10h17M8 3.5v3M16 3.5v3"/></svg></span>' +
    '<div><b>Events Calendar</b><span>Results, dividends, splits and buybacks ahead.</span></div></div>' +
    '<div class="nrange">' +
      '<button class="on" data-range="week">This week</button>' +
      '<button data-range="m1">1 month</button>' +
      '<button data-range="m3">3 months</button>' +
      '<button data-range="past">Past week</button>' +
    '</div>' +
    '<div id="evBody"></div>';

  /* The four range buttons were decoration: they highlighted but filtered nothing, because
     nothing was wired to them. Each one now sets a real window over the event dates and
     repaints. Past events live under cal.recent, which the pipeline writes separately - it is
     empty today, so "Past week" says so rather than showing a blank list. */
  function evWindow(key){
    const now = new Date(); now.setHours(0,0,0,0);
    const iso = d => d.toISOString().slice(0,10);
    const plus = n => { const x = new Date(now); x.setDate(x.getDate()+n); return x; };
    if (key === 'past'){
      return {from: iso(plus(-7)), to: iso(now), src: (cal.recent || [])};
    }
    if (key === 'week'){
      const dow = now.getDay();                       // 0 = Sunday
      return {from: iso(now), to: iso(plus(dow === 0 ? 0 : 7 - dow)), src: rows};
    }
    if (key === 'm1') return {from: iso(now), to: iso(plus(30)), src: rows};
    return {from: iso(now), to: iso(plus(90)), src: rows};
  }

  function paintEvents(key){
    const box = ev.querySelector('#evBody');
    const w = evWindow(key);
    const sel = (w.src || []).filter(e => e && e.date && e.date >= w.from && e.date <= w.to);

    if (!sel.length){
      box.innerHTML = '<div class="nsum"><span>No events between <b>' + dshort(w.from) +
        '</b> and <b>' + dshort(w.to) + '</b></span></div>' +
        '<p class="empty">' +
        (key === 'past'
          ? 'The pipeline stores past events separately and that list is empty today, so there is nothing to show for the last seven days.'
          : 'No events fall inside this window. Try a wider range.') +
        '</p>';
      return;
    }

    const g = {};
    sel.forEach(e => (g[e.type] = g[e.type] || []).push(e));
    const ord = Object.keys(g).sort((a,b) => g[b].length - g[a].length);
    const ds = sel.map(e => e.date).sort();

    box.innerHTML =
      '<div class="nsum"><span>Showing <b>' + sel.length + '</b> event' + (sel.length===1?'':'s') +
        ' for <b>' + dshort(ds[0]) + ' \u2013 ' + dshort(ds[ds.length-1]) + '</b></span>' +
      '<button id="collapseAll">Collapse all</button></div>' +
      '<div class="nchips">' + ord.map(k =>
        '<button><i class="d ' + DOT[k] + '"></i>' + LABEL[k] + ' ' + g[k].length + '</button>').join('') + '</div>' +
      '<div class="nac">' + ord.map(k =>
        '<details open><summary><span class="d ' + DOT[k] + '"></span>' + LABEL[k] + '<em>' + g[k].length + '</em></summary><ul>' +
        g[k].map(e => '<li><b>' + esc(e.symbol) + '</b><span>' + esc(String(e.detail || e.type)) + '</span><i>' + esc(dshort(e.date)) + '</i></li>').join('') +
        '</ul></details>').join('') + '</div>';

    const ca = box.querySelector('#collapseAll');
    if (ca) ca.addEventListener('click', () => {
      const boxes = box.querySelectorAll('details');
      const anyOpen = [].some.call(boxes, d => d.open);
      [].forEach.call(boxes, d => d.open = !anyOpen);
      ca.textContent = anyOpen ? 'Expand all' : 'Collapse all';
    });
  }

  ev.querySelector('.nrange').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [].forEach.call(ev.querySelectorAll('.nrange button'), x => x.classList.remove('on'));
    b.classList.add('on');
    paintEvents(b.dataset.range);
  });

  paintEvents('week');

  main.append(live, ev);

  tabs.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [].forEach.call(tabs.querySelectorAll('button'), x => x.classList.remove('on'));
    b.classList.add('on');
    main.querySelectorAll('.npane').forEach(p => p.classList.toggle('on', p.dataset.pane === b.dataset.tab));
  });
}

/* generic section: one or more json files rendered as tables */
async function renderGeneric(main, files, title){
  for (const f of files){
    try {
      const d = await J(f);
      const recs = recordsFrom(d);
      if (recs && recs.length){
        main.append(card(title || label(f.replace('.json','')), recs.length + ' rows',
          makeTable(recs, autoCols(recs, 9), {limit:100}), f));
      } else if (d && typeof d === 'object'){
        const flat = {}, long = [];
        Object.keys(d).forEach(k => {
          if (Array.isArray(d[k]) || typeof d[k] === 'object') return;
          const v = String(d[k]);
          if (v.length > 44) long.push([k, v]); else flat[k] = d[k];
        });
        const body = document.createElement('div');
        const tilesHTML = Object.keys(flat).length
          ? '<div class="tiles">' + Object.keys(flat).map(k =>
              '<div><span>' + esc(label(k)) + '</span><b>' + esc(String(flat[k]).slice(0,28)) + '</b></div>').join('') + '</div>'
          : '';
        const longHTML = long.map(p =>
          '<p class="note"><b style="color:var(--dim)">' + esc(label(p[0])) + ':</b> ' + esc(p[1]) + '</p>').join('');
        body.innerHTML = (tilesHTML + longHTML) || '<p class="empty">No table rows in this file.</p>';
        main.append(card(title || label(f.replace('.json','')), '', body, f));
      }
    } catch (e){
      const p = document.createElement('p'); p.className = 'err'; p.textContent = e.message;
      main.append(p);
    }
  }
}

   STOCK SHEET - the drill-down the rewrite dropped.

let SDB = null;
async function stockDB(){
  if (SDB) return SDB;
  const [st, fu] = await Promise.all([
    J('stocks.json').catch(() => ({stocks:{}})),
    J('fundamentals.json').catch(() => ({companies:[]}))
  ]);
  const bySym = {};
  Object.keys(st.stocks || {}).forEach(k => {
    const r = st.stocks[k];
    if (r && r.symbol) bySym[r.symbol] = r;
  });
  const fund = {};
  (fu.companies || []).forEach(c => { if (c && c.symbol) fund[c.symbol] = c; });
  SDB = {bySym, fund};
  return SDB;
}
const fmt = (v, d) => (v == null || v === '' || (typeof v === 'number' && !isFinite(v)))
  ? '<span class="na">-</span>'
  : (typeof v === 'number' ? v.toFixed(d == null ? 2 : d) : String(v));
function rowKV(pairs){
  return '<div class="kv">' + pairs.map(p =>
    '<div><span>' + esc(p[0]) + '</span><span>' + p[1] + '</span></div>').join('') + '</div>';
}
/* =====================================================================================
   FULL-SCREEN DETAIL for any row.
   Mutual funds, ETFs and coins have no "symbol" the stock sheet understands, so tapping a row
   there did nothing. This renders whatever fields the row actually carries, in the same
   full-screen window the stock sheet uses.
   ===================================================================================== */
const DETAIL_LABEL = {
  code:'Scheme code', name:'Name', fund_house:'Fund house', category:'Category', type:'Type',
  nav:'NAV', nav_date:'NAV date', first_nav_date:'Inception', years:'Years', r1y:'1Y return',
  r3y:'3Y return', r5y:'5Y return', r10y:'10Y return', since:'Since launch',
  volatility:'Volatility', max_dd:'Max drawdown', expense:'Expense ratio', aum:'AUM',
  benchmark:'Benchmark', beats_nifty:'Beat Nifty', symbol:'Symbol', underlying:'Tracks',
  close:'Close', chg_pct:'Change today', rsi_14:'RSI 14', trend:'Trend', vol_x:'Volume x',
  atr_pct:'ATR %', mcap:'Market cap', volume_24h:'24h volume', base:'Base', industry:'Industry',
  points:'Points', volume:'Volume', deep:'Deep book', series:'Series', isin:'ISIN', face:'Face value'
};
const DETAIL_ORDER = ['name','symbol','code','fund_house','category','type','base','underlying',
  'close','nav','chg_pct','r1y','r3y','r5y','r10y','since','years','nav_date','first_nav_date',
  'expense','aum','benchmark','beats_nifty','mcap','volume_24h','volume','rsi_14','trend','vol_x',
  'atr_pct','max_dd','volatility','industry','points','series','isin','face','deep'];

function fmtDetail(k, v){
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'boolean') return v ? 'Yes' : 'No';
  if (typeof v === 'number'){
    if (k === 'mcap' || k === 'aum' || k === 'volume_24h' || k === 'volume')
      return v.toLocaleString('en-IN');
    if (/^(r1y|r3y|r5y|r10y|since|chg_pct|volatility|max_dd|atr_pct)$/.test(k))
      return (v > 0 ? '+' : '') + v.toFixed(2) + '%';
    if (k === 'expense') return v.toFixed(2) + '%';
    return (Math.abs(v) >= 1000) ? v.toLocaleString('en-IN') : String(Math.round(v * 100) / 100);
  }
  if (typeof v === 'object') return null;
  return String(v);
}

async function openDetail(row, title, subtitle){
  const box = $('#sheet'), body = $('#sheetBody');
  box.classList.add('on'); box.setAttribute('aria-hidden','false');
  const keys = DETAIL_ORDER.filter(k => k in row)
    .concat(Object.keys(row).filter(k => !DETAIL_ORDER.includes(k)));
  const pairs = [];
  keys.forEach(k => {
    const v = fmtDetail(k, row[k]);
    if (v !== null) pairs.push([DETAIL_LABEL[k] || label(k), v]);
  });
  let out = '<h3>' + esc(title || row.name || row.symbol || row.code || 'Detail') + '</h3>';
  if (subtitle) out += '<div class="sub">' + esc(subtitle) + '</div>';
  out += rowKV(pairs);

  // a line for anything we hold history for: ETFs and stocks by symbol, coins by base
  const sym = String(row.symbol || row.base || '').toUpperCase();
  let chartNode = null;
  if (sym){
    try {
      const ser = await J('series.json');
      const key = Object.keys(ser.series || {}).find(k => k.split('.')[0] === sym);
      if (key) chartNode = sparkline(ser.series[key]);
    } catch (_) {}
  }
  if (chartNode) out += '<div id="chartSlot"></div>';
  out += '<p class="sub" style="margin-top:14px">Straight from the feed - every field this row '
    + 'carries. Values can be delayed, wrong or missing. Not a recommendation.</p>';
  body.innerHTML = out;
  if (chartNode){
    const slot = body.querySelector('#chartSlot');
    if (slot) slot.append(chartNode);
  }
  box.scrollTop = 0;
}

async function openStock(sym){
  const box = $('#sheet'), body = $('#sheetBody');
  box.classList.add('on'); box.setAttribute('aria-hidden','false');
  body.innerHTML = '<p class="loading">Loading ' + esc(sym) + '\u2026</p>';
  let db;
  try { db = await stockDB(); }
  catch (e) { body.innerHTML = '<p class="err">Could not load stock data: ' + esc(e.message) + '</p>'; return; }
  const s = db.bySym[sym], f = db.fund[sym];
  if (!s && !f){
    body.innerHTML = '<h3>' + esc(sym) + '</h3><p class="sub">No record for this symbol in '
      + 'stocks.json or fundamentals.json.</p>';
    return;
  }
  const t = (s && s.tech) || {}, fd = (s && s.fund) || {};
  const chg = s ? s.chg_pct : null;
  let out = '<h3>' + esc((s && s.name) || sym) + '</h3>'
    + '<div class="sub">' + esc(sym) + (s && s.sector ? ' \u00b7 ' + esc(s.sector) : '') + '</div>';
  if (s){
    out += '<div class="px ' + (chg > 0 ? 'up' : chg < 0 ? 'dn' : '') + '">' + fmt(s.close) + '</div>'
      + '<div class="' + (chg > 0 ? 'up' : chg < 0 ? 'dn' : '') + '" style="font-size:13px">'
      + (chg > 0 ? '+' : '') + fmt(chg) + '% today</div>';
  }
  // price line, drawn from series.json - the numbers below say where it is, this says how it got there.
  // It goes into a slot inside `out`, so the header is rendered once rather than written to the
  // body early and then written again with the rest of the card.
  out += '<div id="chartSlot"></div>';
  let chartNode = null;
  try {
    const ser = await J('series.json');
    const key = Object.keys(ser.series || {}).find(k => k.split('.')[0] === sym);
    if (key) chartNode = sparkline(ser.series[key]);
  } catch (_) { /* no series - the card still works without a chart */ }

  if (Object.keys(t).length){
    out += '<h5>Technicals</h5>' + rowKV([
      ['RSI 14', fmt(t.rsi_14, 1)], ['Trend', fmt(t.trend)],
      ['SMA 20', fmt(t.sma_20)], ['SMA 50', fmt(t.sma_50)],
      ['SMA 200', fmt(t.sma_200)], ['ADX', fmt(t.adx, 1)],
      ['MACD hist', fmt(t.macd_hist, 3)], ['Bollinger %B', fmt(t.bb_pctb, 2)],
      ['Volume x', fmt(t.vol_x, 2) + 'x'], ['ATR %', t.atr_pct == null ? '-' : fmt(t.atr_pct * 100, 2) + '%'],
      ['52w high', fmt(t.high_52w)], ['52w low', fmt(t.low_52w)]
    ]);
  }
  if (Object.keys(fd).length){
    out += '<h5>Fundamentals</h5>' + rowKV([
      ['P/E', fmt(fd.pe)], ['P/B', fmt(fd.pb)], ['EPS', fmt(fd.eps)],
      ['Div yield', fd.div_yield == null ? '-' : fmt(fd.div_yield) + '%'],
      ['Beta', fmt(fd.beta)], ['ROE', fd.roe == null ? '-' : fmt(fd.roe) + '%'],
      ['Market cap', fd.mcap == null ? '-' : fmt(fd.mcap, 0) + ' cr'],
      ['52w high', fmt(fd.high_52w)], ['52w low', fmt(fd.low_52w)]
    ]);
  }
  if (f){
    out += '<h5>Reported results \u00b7 ' + esc(f.latest_period || '-') + '</h5>' + rowKV([
      ['Revenue', f.revenue_cr == null ? '-' : '\u20b9' + fmt(f.revenue_cr, 1) + ' cr'],
      ['Profit', f.profit_cr == null ? '-' : '\u20b9' + fmt(f.profit_cr, 1) + ' cr'],
      ['Margin', f.margin_pct == null ? '-' : fmt(f.margin_pct, 2) + '%'],
      ['Revenue YoY', f.revenue_yoy_pct == null ? '-' : fmt(f.revenue_yoy_pct, 1) + '%'],
      ['Profit YoY', f.profit_yoy_pct == null ? '-' : fmt(f.profit_yoy_pct, 1) + '%'],
      ['Margin chg', f.margin_change_pp == null ? '-' : fmt(f.margin_change_pp, 2) + ' pp']
    ]);
    out += '<p class="sub" style="margin-top:10px">Year-ago period ' + esc(f.year_ago_period || '-') + '.</p>';
  }
  out += '<p class="sub" style="margin-top:14px">stocks.json \u00b7 fundamentals.json. Prices and '
    + 'fundamentals can be delayed, wrong or missing. Not a recommendation.</p>';
  body.innerHTML = out;
  if (chartNode){
    const slot = body.querySelector('#chartSlot');
    if (slot) slot.append(chartNode);
  }
  box.scrollTop = 0;
}
function closeSheet(){
  const b = $('#sheet'); b.classList.remove('on'); b.setAttribute('aria-hidden','true');
}

document.addEventListener('DOMContentLoaded', () => {
  buildDrawer();
  const drawer = $('#drawer'), scrim = $('#scrim');
  const open = () => { drawer.classList.add('on'); scrim.classList.add('on'); };
  const close = () => { drawer.classList.remove('on'); scrim.classList.remove('on'); };
  $('#menuBtn').onclick = open;
  $('#dclose').onclick = close;
  scrim.onclick = close;
  drawer.addEventListener('click', e => { if (e.target.tagName === 'A') close(); });
  $('#newsBtn').onclick = () => { location.hash = '#/news'; };

  // stock sheet: close handlers + a delegated tap on any symbol-looking cell
  $('#sheetX').onclick = closeSheet;
  $('#sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  document.addEventListener('click', async e => {
    const td = e.target.closest && e.target.closest('td');
    if (!td || td.classList.contains('sym')) return;
    const txt = (td.textContent || '').trim();
    if (!/^[A-Z0-9&.\-]{2,20}$/.test(txt)) return;
    try {
      const db = await stockDB();
      if (!db.bySym[txt] && !db.fund[txt]) return;
      td.classList.add('sym');
      openStock(txt);
    } catch (_) { /* no stock data - leave the cell alone */ }
  });
  window.addEventListener('hashchange', route);
  route();
});
</script>
<script>
/* ---------------------------------------------------------------------------------------
   ONE LINK. arthasaar.vercel.app is meant to be the only address, with github.io forwarding
   to it. But forwarding blindly is worse than not forwarding: Vercel has not deployed since
   23 Nov, so a hard redirect would send every visitor to an older build.

   So the forward is conditional. github.io asks Vercel how fresh its data is and only
   redirects when Vercel is actually serving current data. Until then github.io keeps working
   normally, and the moment Vercel catches up the forward switches itself on with no further
   change needed here.

   If the probe fails for any reason - offline, blocked, slow - nothing happens and the page
   stays put. A redirect must never be the reason a site appears broken.
   --------------------------------------------------------------------------------------- */
(function(){
  if (location.hostname !== 'devrajai.github.io') return;   // already on the canonical host
  var MAX_AGE_H = 36;                                       // a weekend of slack
  var target = 'https://arthasaar.vercel.app' + location.pathname.replace(/^\/ArthaSaar/, '') + location.search + location.hash;
  try {
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var timer = ctl ? setTimeout(function(){ ctl.abort(); }, 2500) : null;
    fetch('https://arthasaar.vercel.app/data_asof.json', {cache:'no-store', signal: ctl ? ctl.signal : undefined})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if (timer) clearTimeout(timer);
        if (!d || !d.updated) return;
        var age = (Date.now() - Date.parse(d.updated)) / 3600000;
        if (!isFinite(age) || age < 0 || age > MAX_AGE_H) return;   // Vercel is stale - stay
        location.replace(target);
      })
      .catch(function(){ if (timer) clearTimeout(timer); });
  } catch (e) { /* never let this break the page */ }
})();
</script>

/* One place that builds an index's member list, so Market and Indices behave identically.
   Rows open the full-screen stock detail through the same makeTable hook. */
/* A price line from the 120 daily closes the repo already carries. Small enough to sit inside
   a detail card, and it answers the question a table of numbers cannot: what has this thing
   actually done lately. */
/* Long history: 5 or 10 years of monthly closes from docs/long_history.json, plus the return
   over that window so a line can be read as a number. */
let LONGH = null;
async function longHistory(){
  if (LONGH !== null) return LONGH;
  try { LONGH = await J('long_history.json'); } catch (_) { LONGH = {}; }
  return LONGH;
}
function longSeriesFor(sym){
  if (!LONGH || !LONGH.series) return null;
  const want = String(sym || '').toUpperCase();
  if (LONGH.series[want]) return LONGH.series[want];
  const k = Object.keys(LONGH.series).find(x => x.split('.')[0].toUpperCase() === want);
  return k ? LONGH.series[k] : null;
}
/* perYear is the number of observations in a year. It was hard-coded to 12, which is right for
   the monthly long history and wrong by a factor of 21 for the daily sessions the overview
   passes - a 9.99-year file covering +217.6% read as 0.6% a year instead of 12.3%. */
function cagrOf(closes, perYear){
  if (!closes || closes.length < 2) return null;
  const a = closes[0], b = closes[closes.length - 1];
  if (!a || a <= 0) return null;
  const ppy = perYear || 12;
  const years = (closes.length - 1) / ppy;
  if (years <= 0) return null;
  return (Math.pow(b / a, 1 / years) - 1) * 100;
}
function totalReturn(closes){
  if (!closes || closes.length < 2 || !closes[0]) return null;
  return (closes[closes.length - 1] / closes[0] - 1) * 100;
}

/* How the thing did against the Nifty over the same window. Both are monthly closes, so the
   comparison is like for like rather than a number against a guess. */
function vsNifty(closes){
  const nif = longSeriesFor('^NSEI');
  if (!nif || !closes || closes.length < 2) return null;
  const a = totalReturn(closes), nb = totalReturn(nif.c);
  if (a == null || nb == null) return null;
  return {stock: a, nifty: nb, diff: a - nb};
}

/* ---------------------------------------------------------------------------------------
   TIMEFRAMES.
   Five sources, one switch:
     5m / 15m / 30m  docs/intraday_recent.json (Yahoo 5-minute bars, resampled up)
     1D              docs/series.json          (120 daily closes)
     1M / 1Y / 5Y / All  docs/long_history.json (monthly closes, sliced)
   The label under each line always names the window and the bar size, so a 30-minute chart is
   never mistaken for a daily one.
   --------------------------------------------------------------------------------------- */
const TF_LIST = [
  ['5m', '5 min'], ['15m', '15 min'], ['30m', '30 min'],
  ['1d', '1 day'], ['1m', '1 month'], ['1y', '1 year'],
  ['5y', '5 years'], ['all', 'All']
];
let INTRADAY = null;
async function intradayData(){
  if (INTRADAY !== null) return INTRADAY;
  try { INTRADAY = await J('intraday_recent.json'); } catch (_) { INTRADAY = {}; }
  return INTRADAY;
}
function intradayFor(sym){
  if (!INTRADAY || !INTRADAY.series) return null;
  const want = String(sym || '').toUpperCase();
  if (INTRADAY.series[want]) return INTRADAY.series[want];
  const k = Object.keys(INTRADAY.series).find(x => x.split('.')[0].toUpperCase() === want);
  return k ? INTRADAY.series[k] : null;
}
/* Group consecutive 5-minute bars into 15 or 30 minute ones. The close of the last bar in a
   group is the close of the grouped bar, which is what a line chart needs. */
function resampleBars(s, factor){
  if (!s || !s.c || factor <= 1) return s;
  const out = {t: [], c: []};
  for (let i = 0; i < s.c.length; i += factor){
    const chunk = s.c.slice(i, i + factor);
    out.c.push(chunk[chunk.length - 1]);
    out.t.push(s.t[i]);
  }
  return out;
}
/* Which bars each window uses, and what to call them. */
async function seriesForTimeframe(sym, tf){
  if (tf === '5m' || tf === '15m' || tf === '30m'){
    await intradayData();
    const s = intradayFor(sym);
    if (!s) return null;
    const r = resampleBars(s, tf === '15m' ? 3 : tf === '30m' ? 6 : 1);
    return {vals: r.c, unit: 'bars of ' + tf.replace('m',' min'), label: tf};
  }
  if (tf === '1d' || tf === '1m'){
    try {
      const ser = await J('series.json');
      const key = Object.keys(ser.series || {}).find(k => k.split('.')[0] === String(sym).toUpperCase());
      if (!key){
        // global names are not in series.json; global.json carries its own 120 points
        const db = await stockDB();
        const rec = db.bySym[sym];
        if (rec && Array.isArray(rec.series) && rec.series.length > 2){
          const vals = tf === '1m' ? rec.series.slice(-21) : rec.series;
          return {vals, unit: 'sessions', label: tf === '1m' ? 'about a month' : 'daily'};
        }
        return null;
      }
      const all = ser.series[key];
      // "1 month" is about 21 sessions, which the daily file already holds - better than two
      // monthly bars, which is what the long file would give
      const vals = tf === '1m' ? all.slice(-21) : all;
      return {vals, unit: 'sessions', label: tf === '1m' ? 'about a month' : 'daily'};
    } catch (_) { return null; }
  }
  await longHistory();
  const L = longSeriesFor(sym);
  if (!L || !L.c) return null;
  const months = tf === '1y' ? 12 : tf === '5y' ? 60 : L.c.length;
  const slice = L.c.slice(-Math.min(months, L.c.length));
  return {vals: slice, unit: 'months', label: tf === 'all' ? 'whole history' : tf};
}

/* A bar chart for things that come in periods - revenue by year, profit by quarter. A line
   implies continuity between points; annual results are discrete events. */
function barChart(labels, vals, opts){
  opts = opts || {};
  const w = 320, hgt = opts.h || 92, pad = 18, gap = 6;
  const ys = (vals || []).map(v => (v == null || !isFinite(v)) ? null : Number(v));
  const real = ys.filter(v => v !== null);
  if (!real.length) return null;
  const hi = Math.max(...real, 0), lo = Math.min(...real, 0);
  const span = (hi - lo) || 1;
  const n = ys.length;
  const bw = (w - pad * 2 - gap * (n - 1)) / n;
  const zeroY = hgt - pad - ((0 - lo) / span) * (hgt - pad * 2);
  const col = opts.color || '#6ea8fe';

  let bars = '', texts = '';
  ys.forEach((v, i) => {
    const x = pad + i * (bw + gap);
    if (v === null){
      texts += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (hgt - 4) +
        '" font-size="8" fill="currentColor" opacity=".4" text-anchor="middle">\u2014</text>';
    } else {
      const y = hgt - pad - ((v - lo) / span) * (hgt - pad * 2);
      const top = Math.min(y, zeroY), bh = Math.max(1.5, Math.abs(zeroY - y));
      bars += '<rect x="' + x.toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + bw.toFixed(1) +
        '" height="' + bh.toFixed(1) + '" rx="2" fill="' + (v >= 0 ? col : '#f0736a') + '" opacity=".85"/>';
    }
    texts += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (hgt - 4) +
      '" font-size="8" fill="currentColor" opacity=".55" text-anchor="middle">' +
      esc(String(labels[i] || '').slice(-4)) + '</text>';
  });

  const wrap = document.createElement('div');
  wrap.innerHTML =
    '<svg viewBox="0 0 ' + w + ' ' + hgt + '" width="100%" height="' + hgt + '" ' +
    'preserveAspectRatio="none" style="display:block;margin:2px 0 2px">' +
    '<line x1="' + pad + '" x2="' + (w - pad) + '" y1="' + zeroY.toFixed(1) + '" y2="' +
    zeroY.toFixed(1) + '" stroke="currentColor" stroke-opacity=".18" stroke-width="1"/>' +
    bars + texts + '</svg>';
  return wrap;
}

/* Value labels above the bars would collide at this width, so the numbers go in a small table
   under the chart instead - readable on a phone, which the chart is not. */
function barTable(labels, vals, unit){
  const wrap = document.createElement('div');
  wrap.innerHTML = '<div class="kv" style="margin-top:4px">' + labels.map((l, i) => {
    const v = vals[i];
    return '<div><span>' + esc(l) + '</span><span>' +
      (v == null ? '\u2014' : (unit === '%' ? v.toFixed(1) + '%' : num(v))) + '</span></div>';
  }).join('') + '</div>';
  return wrap;
}

function sparkline(vals, opts){
  opts = opts || {};
  const w = opts.w || 320, hgt = opts.h || 64, pad = 4;
  const ys = (vals || []).map(Number).filter(v => isFinite(v));
  if (ys.length < 2) return null;
  const lo = Math.min(...ys), hi = Math.max(...ys);
  const span = (hi - lo) || 1;
  const x = i => pad + i * (w - pad * 2) / (ys.length - 1);
  const y = v => hgt - pad - (v - lo) / span * (hgt - pad * 2);
  const pts = ys.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
  const up = ys[ys.length - 1] >= ys[0];
  const col = up ? '#4ec9a0' : '#f0736a';
  const area = 'M' + x(0).toFixed(1) + ',' + (hgt - pad) + ' L' + pts.replace(/ /g, ' L') +
               ' L' + x(ys.length - 1).toFixed(1) + ',' + (hgt - pad) + ' Z';
  const svg = document.createElement('div');
  svg.innerHTML =
    '<svg viewBox="0 0 ' + w + ' ' + hgt + '" width="100%" height="' + hgt + '" ' +
    'preserveAspectRatio="none" style="display:block;margin:2px 0 6px">' +
    '<path d="' + area + '" fill="' + col + '" opacity=".13"/>' +
    '<polyline points="' + pts + '" fill="none" stroke="' + col + '" stroke-width="1.8" ' +
    'stroke-linejoin="round" stroke-linecap="round"/></svg>';
  const box = document.createElement('div');
  const rng = document.createElement('div');
  rng.className = 'sub';
  rng.style.margin = '0 0 4px';
  rng.textContent = ys.length + ' ' + (opts.unit || 'sessions') + ' \u00b7 low ' + lo.toFixed(2) +
    ' \u00b7 high ' + hi.toFixed(2) +
    ' \u00b7 ' + ((ys[ys.length-1] / ys[0] - 1) * 100).toFixed(1) + '% over the window';
  box.append(svg.firstChild, rng);
  return box;
}

/* What a commodity contract actually is, on tap: the quote, the move over three horizons, the
   rupee conversion for the metals, and the purity tiers - which is the number a buyer in India
   actually pays against. */
async function openCommodity(row, cm, mt){
  const box = $('#sheet'), body = $('#sheetBody');
  box.classList.add('on'); box.setAttribute('aria-hidden','false');
  const isGold = /gold/i.test(row.label || '');
  const isSilver = /silver/i.test(row.label || '');

  let tierTable = null;
  let out = '<h3>' + esc(row.label || row.symbol) + '</h3>'
    + '<div class="sub">' + esc(row.symbol || '') + ' \u00b7 ' + esc(row.unit || '') +
    (row.date ? ' \u00b7 ' + esc(row.date) : '') + '</div>';

  if (row.close != null){
    const c = row.chg_1d;
    out += '<div class="px ' + (c > 0 ? 'up' : c < 0 ? 'dn' : '') + '">' +
      (row.unit && row.unit.indexOf('$') === 0 ? '$' : '') + num(row.close) + '</div>'
      + '<div class="' + (c > 0 ? 'up' : c < 0 ? 'dn' : '') + '" style="font-size:13px">'
      + (c > 0 ? '+' : '') + (c == null ? '-' : c.toFixed(2)) + '% today</div>';
  }

  out += '<h5>Momentum</h5>' + rowKV([
    ['1 day', row.chg_1d == null ? '-' : pct(row.chg_1d)],
    ['1 week', row.chg_1w == null ? '-' : pct(row.chg_1w)],
    ['1 month', row.chg_1m == null ? '-' : pct(row.chg_1m)],
    ['Quoted in', esc(row.unit || '-')]
  ]);

  // rupee conversion, which is the number an Indian buyer sees on a jeweller's board
  if ((isGold || isSilver) && mt && mt.usdinr){
    const perGram = isGold ? (mt.gold && mt.gold.per_gram) : (mt.silver && mt.silver.per_gram);
    if (perGram) out += '<h5>In rupees</h5>' + rowKV([
      ['Per gram', '\u20b9' + num(perGram)],
      ['Per 10 g', '\u20b9' + num(perGram * 10)],
      ['USD/INR', num(mt.usdinr) + ' (' + (mt.usdinr_chg_pct||0).toFixed(2) + '%)'],
      ['As of', esc(mt.as_of_ist || '-')]
    ]);
    // purity tiers: what the same metal costs at each fineness. Both feeds are arrays of
    // objects, not maps - rendering them as a map printed "[object Object]" on the page.
    const tiers = isGold ? (mt.gold_purities || []) : (mt.silver_fineness || []);
    if (Array.isArray(tiers) && tiers.length){
      out += '<h5>' + (isGold ? 'Purity tiers' : 'Fineness') + '</h5>';
      // makeTable returns a DOM node, not a string - putting it in a template literal printed
      // "[object HTMLElement]". Render into a slot and append it after the HTML is set.
      out += '<div id="tierSlot"></div>';
      tierTable = makeTable(tiers.map(x => ({
        label: x.label, per_gram: x.per_gram, per_10g: x.per_10g, per_12g: x.per_12g,
        chg_pct: x.chg_pct
      })), [
        {k:'label',label:isGold ? 'Carat' : 'Fineness'},
        {k:'per_gram',label:'Per gram',r:1,html:v=>v==null?'\u2014':'\u20b9'+num(v)},
        {k:'per_10g',label:'Per 10 g',r:1,html:v=>v==null?'\u2014':'\u20b9'+num(v)},
        {k:'per_12g',label:'Per 12 g',r:1,html:v=>v==null?'\u2014':'\u20b9'+num(v)}
      ], {limit:12, noSearch:true});
    }
  }

  // what drives the price - the fundamental side, stated as the mechanism rather than a view
  if (isGold || isSilver){
    out += '<h5>What moves it</h5><p style="margin:0;line-height:1.55">' +
      (isGold
        ? 'Gold is priced in dollars and pays no yield, so it usually strengthens when real '
          + 'interest rates fall, when the dollar weakens, and when investors want an asset that '
          + 'is not someone else\'s promise. Central-bank buying and jewellery demand are the '
          + 'physical side. In India the rupee matters as much as the metal: a flat dollar price '
          + 'with a weaker rupee still means a higher local price.'
        : 'Silver is part industrial metal and part store of value. Photovoltaics, electronics and '
          + 'solar capacity drive real demand, so it moves with the industrial cycle as well as '
          + 'with gold. That double role makes it far more volatile than gold - it can fall in a '
          + 'recession that gold merely shrugs off.') +
      '</p>';
  }

  // correlations arrive as a list of {metal, against, window, correlation} - also not a map

/* Scheme names run to 70+ characters ("SBI HEALTHCARE OPPORTUNITIES FUND - Regular Plan -
   IDCW"), which on a phone leaves no room for the numbers. Shorten to the part that identifies
   the fund, keep the full name in the tooltip and in the detail window. */
/* A 10-year annualised return above roughly 35% is not a great fund, it is a bad NAV point.
   Two rows in the current feed carry 63.8% and 66.6% for overnight funds that actually return
   about 5% a year, which put a 6.2 crore SIP projection at the top of the table. Anything
   outside a believable band is kept in the list but flagged, never ranked first. */
const RETURN_CAP = {r1y: 100, r3y: 60, r5y: 45, r10y: 35};
function plausible(rate, key){
  if (rate == null) return false;
  const cap = RETURN_CAP[key] || 60;
  return rate <= cap && rate >= -60;
}

/* Two codes can carry the same scheme name - Nippon India Power & Infra appears as 101262 and
   101263 with an identical 10-year return, because one is Regular-Growth and the other
   Regular-IDCW and the name is cut before it says so. The plan column makes them distinguishable
   instead of looking like a duplicate. */
function fundPlan(n){
  const s = String(n || '');
  const plan = /direct/i.test(s) ? 'Direct' : /regular/i.test(s) ? 'Regular' : '\u2014';
  const opt = /idcw|dividend|payout|bonus/i.test(s) ? 'IDCW'
            : /growth/i.test(s) ? 'Growth' : '\u2014';
  return plan + ' \u00b7 ' + opt;
}

function shortFund(n){
  const s = String(n || '');
  const cut = s.replace(/\s*-\s*(Regular|Direct)\s+Plan.*$/i, '')
               .replace(/\s*-\s*(Growth|IDCW|Bonus|Payout).*$/i, '')
               .replace(/\s+/g, ' ').trim();
  const base = cut || s;
  return base.length > 30 ? base.slice(0, 29) + '\u2026' : base;
}

async function renderFunds(main, file, title, opts){
  opts = opts || {};
  const d = await J(file);
  const rows = arrOf(d) || [];



  // How many of these actually beat the index? The feed carries the flag; the page never showed
  // it, so "best performer" was a column of numbers with nothing to measure them against.
  if (rows.length && ('beats_nifty_5y' in rows[0] || 'beats_nifty_3y' in rows[0])){
    const pctOf = k => {
      const known = rows.filter(r => r[k] !== undefined && r[k] !== null);
      if (!known.length) return null;
      const yes = known.filter(r => r[k]).length;
      return {yes, total: known.length, pct: +(yes / known.length * 100).toFixed(1)};
    };
    const b5 = pctOf('beats_nifty_5y'), b3 = pctOf('beats_nifty_3y'), b1 = pctOf('beats_nifty_1y');
    const t = [];
    if (b1) t.push(['Beat Nifty 1Y', b1.pct + '%', b1.yes + ' of ' + b1.total]);
    if (b3) t.push(['Beat Nifty 3Y', b3.pct + '%', b3.yes + ' of ' + b3.total]);
    if (b5) t.push(['Beat Nifty 5Y', b5.pct + '%', b5.yes + ' of ' + b5.total]);
    if (t.length) main.append(card(title + ' vs the index', 'how many beat Nifty', tiles(t),
      'Over a long enough window most active funds trail the index they are measured against. '
      + 'This is the count, not a recommendation.'));
  }

  // SIP: what a fixed monthly amount would have become at each fund's own 10-year rate.
  // It is arithmetic on a past return, not a projection of the future, and it says so.
  if (rows.some(r => r.r10y != null || r.r5y != null)){
    const key = rows.some(r => r.r10y != null) ? 'r10y' : 'r5y';
    const yrs = key === 'r10y' ? 10 : 5;
    const monthly = 5000;
    const fv = rate => {
      const i = rate / 100 / 12, n = yrs * 12;
      return i ? monthly * ((Math.pow(1 + i, n) - 1) / i) * (1 + i) : monthly * n;
    };
    const allWithR = rows.filter(r => r[key] != null);
    const withR = allWithR.filter(r => plausible(r[key], key)).sort((a,b) => b[key] - a[key]);
    const excluded = allWithR.length - withR.length;
    if (withR.length){
      main.append(card('SIP at \u20b9' + monthly.toLocaleString('en-IN') + ' a month',
        'over ' + yrs + ' years, at each fund\'s own past rate',
        makeTable(withR.slice(0, 12).map(r => ({
          name: r.name, short: shortFund(r.name), rate: r[key], value: Math.round(fv(r[key])),
          _fund: r
        })), [
          // the full scheme name is 70 characters and pushes the money columns off a phone
          {k:'short',label:'Fund',html:(v,r)=>'<span title="'+esc(r.name)+'">'+esc(v)+'</span>'},
          {k:'rate',label:'Past ' + yrs + 'Y',r:1,html:v=>pct(v)},
          {k:'value',label:'Would be',r:1,html:v=>'\u20b9'+num(v)}
        ], {limit:12, placeholder:'Search funds\u2026',
           onRow: r => openFund(r._fund || r)}),
        'Arithmetic on the past return, compounded monthly - not a projection. A fund that '
        + 'returned 20% a year for ten years did so in conditions that may not repeat, and the '
        + 'worst funds are shown further down for the same reason.'
        + (excluded ? ' ' + excluded + ' fund(s) are left out because their published ' + yrs
           + '-year return is above ' + (RETURN_CAP[key] || 60) + '% a year, which is a bad NAV '
           + 'point rather than a real result.' : '')));
    }
  }

  // best and worst by the longest return the feed carries
  const rk = ['r10y','r5y','r3y','r1y'].find(k => rows.some(r => r[k] != null));
  if (rk && rows.length > 6){
    const withR = rows.filter(r => r[rk] != null && plausible(r[rk], rk)).sort((a,b) => b[rk] - a[rk]);
    const cols = [{k:'name',label:'Name'},{k:'fund_house',label:'House'},{k:rk,label:rk.toUpperCase()+' return',r:1,html:v=>pct(v)},
                  {k:'nav',label:'NAV',r:1}];
    main.append(card(title + ' \u00b7 best ' + rk.toUpperCase(),
      withR.length + ' ranked',
      makeTable(withR.slice(0,10), cols.slice(0,4), {limit:10, onRow: r => openDetail(r, r.name, r.fund_house)}),
      'Ranked on the longest return the feed carries, so a fund with a short record is not '
      + 'flattered by a single good year.'));
    main.append(card(title + ' \u00b7 worst ' + rk.toUpperCase(),
      withR.length + ' ranked',
      makeTable(withR.slice(-10).reverse(), cols, {limit:10, onRow: r => openDetail(r, r.name, r.fund_house)}),
      'Shown deliberately: a list of winners alone is not a comparison.'));
  }
  const cols = opts.cols || (rows[0] ? Object.keys(rows[0]).slice(0,8).map(k => ({k, label:label(k)})) : []);

  // rank by the longest return available, so the table opens on an ordering rather than on
  // whatever order the feed happened to write
  // short name and plan, so a phone shows the fund rather than 70 characters and an ellipsis
  rows.forEach(r => { r.short = shortFund(r.name); r.plan = fundPlan(r.name); });

  const rankKey = ['r10y','r5y','r3y','r1y'].find(k => rows.some(r => r[k] != null));
  if (rankKey){
    rows.sort((a,b) => {
      const pa = plausible(a[rankKey], rankKey), pb = plausible(b[rankKey], rankKey);
      if (pa !== pb) return pa ? -1 : 1;            // plausible rows above suspect ones
      return (b[rankKey] || -1e9) - (a[rankKey] || -1e9);
    });
    rows.forEach((r, i) => { r._rank = i + 1; });
    cols.unshift({k:'_rank', label:'#'});
  }
  main.append(card(title, (d.count || rows.length) + ' rows',
    makeTable(rows, cols, {
      limit: 150,
      placeholder: opts.placeholder || 'Search\u2026',
      onRow: r => opts.kind === 'fund' ? openFund(r)
                 : opts.kind === 'etf' ? openEtf(r)
                 : opts.kind === 'crypto' ? openCrypto(r)
                 : openDetail(r, r.name || r.symbol || r.code,
                              r.fund_house || r.underlying || r.category || '')
    }),
    file + ' \u00b7 tap any row for the full detail. ' + (d.note || '')));
}

  live.innerHTML =
    '<label class="nsearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16 16l4 4"/></svg>' +
    '<input id="nq" type="search" placeholder="Search by stock, company or keyword…"></label>' +

      chip('policy','red','Policy',n.counts.policy) +
    '</div><ul class="nlist" id="nlist"></ul><p class="nempty" id="nempty" hidden>No updates matching your criteria.</p>';

  // A chip showing 0 used to be clickable, and tapping it produced "No updates matching your
  // criteria" with no way back except guessing. A filter that can only ever return nothing is
  // now disabled and dimmed instead.
  function chip(cat, dot, label, count){
    const c = count || 0;
    return '<button data-cat="' + cat + '"' + (c ? '' : ' disabled') + '>' +
      '<i class="d ' + dot + '"></i>' + label + ' ' + c + '</button>';
  }

  const ul = live.querySelector('#nlist');
  n.items.forEach(it => {
    const li = document.createElement('li');
    li.dataset.cat = it.category;
    li.innerHTML = '<span class="ns">' + esc(it.source) + ' · ' + esc(dshort(String(it.published).slice(0,10))) + '</span>' +
                   '<span class="nt">' + esc(unesc(it.title)) + '</span>';
    ul.append(li);
  });

  const chips = live.querySelector('#nchips'), q = live.querySelector('#nq'), empty = live.querySelector('#nempty');
  let cat = 'all';
  function apply(){
    const term = q.value.trim().toLowerCase(); let shown = 0;
    [].forEach.call(ul.children, li => {
      const ok = (cat === 'all' || li.dataset.cat === cat) && (!term || li.textContent.toLowerCase().includes(term));
      li.style.display = ok ? '' : 'none'; if (ok) shown++;
    });
    empty.hidden = shown > 0;
    if (!shown){
      const name = (cat === 'all') ? '' : (' ' + cat.charAt(0).toUpperCase() + cat.slice(1));
      empty.innerHTML = term
        ? ('Nothing matches \u201c' + esc(q.value.trim()) + '\u201d' +
           (cat === 'all' ? '.' : ' in ' + esc(cat) + '.') +

     empty today, so "Past week" says so rather than showing a blank list. */
  function evWindow(key){
    const now = new Date(); now.setHours(0,0,0,0);
    const iso = d => d.toISOString().slice(0,10);
    const plus = n => { const x = new Date(now); x.setDate(x.getDate()+n); return x; };
    if (key === 'past'){
      return {from: iso(plus(-7)), to: iso(now), src: (cal.recent || [])};

      const dow = now.getDay();                       // 0 = Sunday
      return {from: iso(now), to: iso(plus(dow === 0 ? 0 : 7 - dow)), src: rows};
    }
    if (key === 'm1') return {from: iso(now), to: iso(plus(30)), src: rows};

/* generic section: one or more json files rendered as tables */
async function renderGeneric(main, files, title){
  for (const f of files){
    try {
      const d = await J(f);
      const recs = recordsFrom(d);
      if (recs && recs.length){
        main.append(card(title || label(f.replace('.json','')), recs.length + ' rows',
          makeTable(recs, autoCols(recs, 9), {limit:100}), f));
      } else if (d && typeof d === 'object'){
        const flat = {}, long = [];
        Object.keys(d).forEach(k => {
          if (Array.isArray(d[k]) || typeof d[k] === 'object') return;
          const v = String(d[k]);
          if (v.length > 44) long.push([k, v]); else flat[k] = d[k];
        });
        const body = document.createElement('div');
        const tilesHTML = Object.keys(flat).length
          ? '<div class="tiles">' + Object.keys(flat).map(k =>
              '<div><span>' + esc(label(k)) + '</span><b>' + esc(String(flat[k]).slice(0,28)) + '</b></div>').join('') + '</div>'
          : '';
        const longHTML = long.map(p =>
          '<p class="note"><b style="color:var(--dim)">' + esc(label(p[0])) + ':</b> ' + esc(p[1]) + '</p>').join('');
        body.innerHTML = (tilesHTML + longHTML) || '<p class="empty">No table rows in this file.</p>';
        main.append(card(title || label(f.replace('.json','')), '', body, f));
      }
    } catch (e){
      const p = document.createElement('p'); p.className = 'err'; p.textContent = e.message;
      main.append(p);
    }
  }
}

/* ROE arrives as a ratio: HDFC Bank is 0.11, Apple is 1.4226. The page printed the raw value
   with a % sign, so HDFC Bank showed 0.11% where its actual return on equity is 11%. Anything
   at or below 3 is a ratio and gets multiplied; above that it is already a percentage. */
/* Indian digit grouping on a dollar amount reads as a different number to anyone used to
   millions - $42,15,03,23,242 is not a shape a US figure takes. Dollars get T/B/M. */
/* Supply is a token count, not money - it wants plain thousands separators and no decimals. */
function num0(v){
  if (v == null || !isFinite(v)) return '-';
  return Math.round(Number(v)).toLocaleString('en-IN');
}

function usd(v){
  if (v == null || !isFinite(v)) return '-';
  const n = Number(v);
  if (Math.abs(n) >= 1e12) return '$' + (n / 1e12).toFixed(2) + ' T';
  if (Math.abs(n) >= 1e9) return '$' + (n / 1e9).toFixed(2) + ' B';
  if (Math.abs(n) >= 1e6) return '$' + (n / 1e6).toFixed(2) + ' M';
  if (Math.abs(n) >= 1e3) return '$' + (n / 1e3).toFixed(1) + ' K';
  return '$' + n.toFixed(2);
}

/* =====================================================================================
   P/E IN CONTEXT.
   A P/E of 45 is cheap or expensive only against something. The sector is what stocks.json
   already gives us, so the percentile is computed from the peers we hold - and it says how many
   stocks it looked at, because "the 30th percentile" from four names is not the same claim as
   from forty.
   ===================================================================================== */
function pePercentile(pe, sector, all){
  if (pe == null || !isFinite(pe) || pe <= 0 || !sector) return null;
  const peers = [];
  Object.keys(all || {}).forEach(k => {
    const r = all[k];
    if (!r || r.sector !== sector) return;
    const p = r.fund && r.fund.pe;
    if (p != null && isFinite(p) && p > 0) peers.push(Number(p));
  });
  if (peers.length < 3) return null;
  const below = peers.filter(x => x < pe).length;
  return { pct: Math.round(below / peers.length * 100), n: peers.length,
           median: peers.slice().sort((a, b) => a - b)[Math.floor(peers.length / 2)] };
}

/* How old is a set of results, in quarters. A results block older than two quarters is not a
   current picture of the company, and saying so is the point. */
function quartersOld(periodIso, today){
  if (!periodIso) return null;
  const d = new Date(periodIso + 'T00:00:00');
  if (isNaN(d)) return null;
  const t = today || new Date();
  const qd = (t.getFullYear() - d.getFullYear()) * 4 +
             (Math.floor(t.getMonth() / 3) - Math.floor(d.getMonth() / 3));
  return qd;
}

function roePct(v){
  if (v == null || !isFinite(v)) return '-';
  const pct = Math.abs(v) <= 3 ? v * 100 : v;
  return pct.toFixed(1) + '%';
}

/* Market cap is in the listing's own currency and unit. An Indian name is quoted in crore; a
   US name is dollars and was being labelled "cr", which is a different number by a factor of
   about 80. */
function mcapText(v, sym){
  if (v == null || !isFinite(v)) return '-';
  const indian = /\.NS$|\.BO$/i.test(String(sym || ''));
  if (indian) return '\u20b9' + num(v / 1e7) + ' cr';
  if (v >= 1e12) return '$' + (v / 1e12).toFixed(2) + ' T';
  if (v >= 1e9) return '$' + (v / 1e9).toFixed(1) + ' B';
  if (v >= 1e6) return '$' + (v / 1e6).toFixed(1) + ' M';
  return '$' + num(v);
}

function fmtDetail(k, v){
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'boolean') return v ? 'Yes' : 'No';
  if (typeof v === 'number'){
    if (k === 'mcap' || k === 'aum' || k === 'volume_24h' || k === 'volume')
      return v.toLocaleString('en-IN');
    if (/^(r1y|r3y|r5y|r10y|since|chg_pct|volatility|max_dd|atr_pct)$/.test(k))
      return (v > 0 ? '+' : '') + v.toFixed(2) + '%';
    if (k === 'expense') return v.toFixed(2) + '%';
    return (Math.abs(v) >= 1000) ? v.toLocaleString('en-IN') : String(Math.round(v * 100) / 100);
  }
  if (typeof v === 'object') return null;
  return String(v);
}

   MUTUAL FUND DETAIL.
   The generic row view printed every field and stopped there, which for a fund is the least
   useful thing it could do: the numbers only mean something against the index and against the
   fund's own category. This ranks the fund inside its category, puts each return beside Nifty,
   Sensex and gold over the same window, and costs a SIP at the fund's own past rate.
   ===================================================================================== */
const MF_BENCH_LABEL = {nifty: 'Nifty 50', sensex: 'Sensex', gold: 'Gold'};

/* =====================================================================================
   ETF DETAIL.
   etf.json carries a `pages` dict with 335 ETFs, each holding a 120-point series and the same
   `tech` block a stock has - and the page showed a flat list of eight fields. An ETF now opens
   with its own line, the timeframe switch, its technicals, and what it tracks.
   ===================================================================================== */
let ETFPAGES = null;
async function etfPages(){
  if (ETFPAGES !== null) return ETFPAGES;
  try { const d = await J('etf.json'); ETFPAGES = d.pages || {}; } catch (_) { ETFPAGES = {}; }
  return ETFPAGES;
}

/* =====================================================================================
   CRYPTO DETAIL.
   A coin opened the generic field dump - no chart, no rank context, no explanation of what the
   numbers mean. crypto_history.json carries monthly history for the majors and long_history.json
   carries BTC; both are used when present, and the window says so when neither is.
   ===================================================================================== */
let CRYPTOTH = null;
async function cryptoHistory(){
  if (CRYPTOTH !== null) return CRYPTOTH;
  try { CRYPTOTH = await J('crypto_history.json'); } catch (_) { CRYPTOTH = {series:{}}; }
  return CRYPTOTH;
}

let CRYPTOF = null;
async function cryptoFundamentals(){
  if (CRYPTOF !== null) return CRYPTOF;
  try { CRYPTOF = await J('crypto_fundamentals.json'); } catch (_) { CRYPTOF = {coins:{}}; }
  return CRYPTOF;
}

async function openCrypto(row){
  const box = $('#sheet'), body = $('#sheetBody');
  box.classList.add('on'); box.setAttribute('aria-hidden','false');
  body.innerHTML = '<p class="loading">Loading ' + esc(row.name || row.symbol) + '\u2026</p>';

  let all = [];
  try { const d = await J('crypto.json'); all = d.rows || []; } catch (_) { all = [row]; }
  const chg = row.chg_pct;

  let out = '<h3>' + esc(row.name || row.symbol) + '</h3>'
    + '<div class="sub">' + esc(row.symbol || '') +
    (row.rank ? ' \u00b7 rank ' + row.rank + ' of ' + all.length : '') + '</div>';

  if (row.close != null){
    out += '<div class="px ' + (chg > 0 ? 'up' : chg < 0 ? 'dn' : '') + '">' + num(row.close) + '</div>'
      + '<div class="' + (chg > 0 ? 'up' : chg < 0 ? 'dn' : '') + '" style="font-size:13px">'
      + (chg > 0 ? '+' : '') + (chg == null ? '-' : chg.toFixed(2)) + '% today</div>';
  }

  out += '<div id="chartSlot"></div>';

  // technicals, using the same vocabulary as a stock so the two read alike
  const tech = [
    ['RSI 14', row.rsi_14 == null ? '-' : row.rsi_14.toFixed(1)],
    ['Trend', esc(row.trend || '-')],
    ['ATR %', row.atr_pct == null ? '-' : row.atr_pct.toFixed(2) + '%'],
    ['Rank', row.rank == null ? '-' : '#' + row.rank]
  ];
  out += '<h5>Technicals</h5>' + rowKV(tech);

  // size and turnover - the two numbers that decide whether a coin can be traded at all
  const size = [];
  if (row.mcap != null) size.push(['Market cap', usd(row.mcap)]);
  if (row.volume_24h != null) size.push(['24h volume', usd(row.volume_24h)]);
  if (row.mcap && row.volume_24h) size.push(['Turnover', (row.volume_24h / row.mcap * 100).toFixed(2) + '% of cap']);
  if (size.length) out += '<h5>Size and liquidity</h5>' + rowKV(size);

  // ---- supply and dilution - the crypto equivalent of a share count ----
  await cryptoFundamentals();
  const cf = (CRYPTOF.coins || {})[String(row.symbol || '').toUpperCase()];
  if (cf){
    const sup = [];
    if (cf.circulatingSupply != null) sup.push(['Circulating', num0(cf.circulatingSupply)]);
    if (cf.unlimited_supply){
      sup.push(['Maximum supply', 'Uncapped']);
      sup.push(['What that means', 'It can be minted without a ceiling']);
    } else if (cf.maxSupply){
      sup.push(['Maximum supply', num0(cf.maxSupply)]);
      if (cf.pct_issued != null) sup.push(['Already issued', cf.pct_issued.toFixed(2) + '%']);
    }
    if (cf.totalSupply != null && cf.totalSupply !== cf.circulatingSupply)
      sup.push(['Total supply', num0(cf.totalSupply)]);
    if (sup.length) out += '<h5>Supply</h5>' + rowKV(sup);

    // dilution: what it would be worth with every token issued
    if (cf.fdv && cf.mcap_fdv_ratio != null){
      out += '<h5>Dilution</h5>' + rowKV([
        ['Fully diluted value', usd(cf.fdv)],
        ['Market cap', usd(row.mcap)],
        ['Cap as share of FDV', cf.mcap_fdv_ratio.toFixed(2) + '%']
      ]);
      out += '<p class="sub" style="margin-top:8px">Fully diluted value is the price times the '
        + 'maximum supply - what it would be worth with every token that can exist. A low share '
        + 'means a lot of supply is still to come, which dilutes holders who buy now.</p>';
    }

    // where it sits in its own year
    if (cf.fiftyTwoWeekHigh && cf.fiftyTwoWeekLow && row.close != null){
      const hi = cf.fiftyTwoWeekHigh, lo = cf.fiftyTwoWeekLow;
      const pos = Math.max(0, Math.min(100, (row.close - lo) / ((hi - lo) || 1) * 100));
      out += '<h5>Position in its 52-week range</h5>'
        + '<div style="display:flex;height:9px;border-radius:5px;overflow:hidden;margin:2px 0 6px">'
        + '<div style="width:' + pos.toFixed(1) + '%;background:#4ec9a0"></div>'
        + '<div style="width:' + (100 - pos).toFixed(1) + '%;background:rgba(255,255,255,.12)"></div></div>'
        + rowKV([['52-week high', usd(hi)], ['52-week low', usd(lo)],
                 ['Now', pos.toFixed(0) + '% up from the low']]);
    }

    // turnover: how much of the coin changes hands in a day
    if (cf.turnover_pct != null){
      const t2 = [['Turnover', cf.turnover_pct.toFixed(2) + '% of cap a day']];
      if (cf.volume_vs_avg != null) t2.push(['Volume vs 30-day average', cf.volume_vs_avg.toFixed(0) + '%']);
      out += '<h5>How actively it trades</h5>' + rowKV(t2);
      out += '<p class="sub" style="margin-top:8px">Turnover above about 10% a day means a large '
        + 'share of the coin is changing hands - liquid, but also skittish. Below 2% and a large '
        + 'order moves the price.</p>';
    }
  }

  // where it sits in the pack
  if (all.length > 1 && row.close != null){
    const byMcap = all.filter(x => x.mcap != null).sort((a,b) => b.mcap - a.mcap);
    const idx = byMcap.findIndex(x => x.symbol === row.symbol);
    if (idx >= 0){
      const share = row.mcap / byMcap.reduce((s,x) => s + x.mcap, 0) * 100;
      out += '<h5>In the pack</h5>' + rowKV([
        ['By market cap', '#' + (idx + 1) + ' of ' + byMcap.length],
        ['Share of the tracked total', share.toFixed(2) + '%']
      ]);
    }
  }

  out += '<p class="sub" style="margin-top:14px">Crypto trades 24 hours and has no circuit limit, '
    + 'no closing price and no earnings - the measures used on a share describe it far less '
    + 'well.</p>';

  body.innerHTML = out;

  const slot = body.querySelector('#chartSlot');
  if (slot){
    const bar = document.createElement('div');
    bar.className = 'nchips';
    bar.style.margin = '2px 0 8px';
    bar.innerHTML = TF_LIST.map(x =>
      '<button data-tf="' + x[0] + '"' + (x[0] === '1y' ? ' class="on"' : '') + '>' +
      esc(x[1]) + '</button>').join('');
    slot.append(bar);
    const host = document.createElement('div');
    slot.append(host);

    const paint = async (tf) => {
      host.innerHTML = '<p class="loading">Loading\u2026</p>';
      let vals = null, unit = 'months', label = '';
      // monthly history for the majors
      if (tf === '1y' || tf === '5y' || tf === 'all'){
        await cryptoHistory();
        const s = (CRYPTOTH.series || {})[row.symbol];
        if (s && s.length){
          const pts = s.map(x => Number(x[1]));
          const n = tf === '1y' ? 12 : tf === '5y' ? 60 : pts.length;
          vals = pts.slice(-Math.min(n, pts.length)); label = tf;
        }
      }
      // BTC and the majors are also in long_history
      if (!vals){
        await longHistory();
        const L = longSeriesFor(row.symbol) || longSeriesFor(row.symbol + '-USD');
        if (L && L.c){
          const n = tf === '1m' ? 2 : tf === '1y' ? 12 : tf === '5y' ? 60 : L.c.length;
          vals = L.c.slice(-Math.min(n, L.c.length)); unit = 'months'; label = tf;
        }
      }
      // intraday, if we hold it for the pair
      if (!vals && (tf === '5m' || tf === '15m' || tf === '30m' || tf === '1d')){
        await intradayData();
        const s = intradayFor(row.symbol + '-USD') || intradayFor(row.symbol);
        if (s){
          const r = resampleBars(s, tf === '15m' ? 3 : tf === '30m' ? 6 : 1);
          vals = r.c; unit = 'bars of ' + tf.replace('m', ' min'); label = tf;
        }
      }
      host.innerHTML = '';
      if (!vals || vals.length < 2){
        const e = document.createElement('p'); e.className = 'empty';
        e.textContent = 'No ' + tf + ' history for ' + (row.symbol || 'this coin') +
          '. Crypto history here covers the majors only.';
        host.append(e); return;
      }
      const sp = sparkline(vals, {h: 96, unit});
      if (sp) host.append(sp);
    };

    bar.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      [].forEach.call(bar.querySelectorAll('button'), x => x.classList.remove('on'));
      b.classList.add('on'); paint(b.dataset.tf);
    });
    paint('1y');
  }
  box.scrollTop = 0;
}

async function openFund(row){
  const box = $('#sheet'), body = $('#sheetBody');
  box.classList.add('on'); box.setAttribute('aria-hidden','false');
  body.innerHTML = '<p class="loading">Loading ' + esc(row.name || 'fund') + '\u2026</p>';

  let all = [], bench = {};
  try {
    const d = await J('mf.json');
    all = d.rows || [];
    bench = d.benchmarks || {};
  } catch (_) { all = [row]; }

  const peers = all.filter(x => x.category === row.category);
  const longest = ['r10y','r5y','r3y','r1y'].find(k => row[k] != null);
  const years = longest === 'r10y' ? 10 : longest === 'r5y' ? 5 : longest === 'r3y' ? 3 : 1;

  // rank inside the category, on the longest return this fund actually reports
  let rankTxt = '-', catMedian = null;
  if (longest && peers.length > 1){
    const vals = peers.filter(x => x[longest] != null && plausible(x[longest], longest))
                      .sort((a,b) => b[longest] - a[longest]);
    const idx = vals.findIndex(x => x.code === row.code);
    if (idx >= 0) rankTxt = (idx + 1) + ' of ' + vals.length;
    const arr = vals.map(x => x[longest]).sort((a,b) => a - b);
    if (arr.length) catMedian = arr[Math.floor(arr.length / 2)];
  }

  let out = '<h3>' + esc(row.name || '') + '</h3>'
    + '<div class="sub">' + esc(row.fund_house || '') + ' \u00b7 ' + esc(row.category || '') +
    ' \u00b7 ' + esc(row.type || '') + '</div>';

  out += '<div class="px">\u20b9' + num(row.nav) + '</div>'
    + '<div class="sub" style="margin:0 0 4px">NAV on ' + esc(row.nav_date || '-') +
    ' \u00b7 since ' + esc(row.first_nav_date || '-') + ' (' + (row.years || 0) + ' years)</div>';

  // ---- returns, each beside the index over the same window ----
  out += '<h5>Returns, and what they beat</h5>';
  const rk = [['r1y','1y'],['r3y','3y'],['r5y','5y'],['r10y','10y']];
  const rowsR = [];
  rk.forEach(([k, lbl]) => {
    if (row[k] == null) return;
    const b = bench.nifty || {};
    const bn = b[lbl];
    rowsR.push({
      window: lbl,
      fund: row[k],
      nifty: bn == null ? null : bn,
      diff: bn == null ? null : row[k] - bn,
      verdict: bn == null ? '-' : (row[k] > bn ? 'ahead' : 'behind')
    });
  });
  if (rowsR.length){
    out += '<div id="retSlot"></div>';
  }

  // ---- risk ----
  if (row.vol != null || row.max_dd != null){
    out += '<h5>Risk</h5>' + rowKV([
      ['Volatility', row.vol == null ? '-' : row.vol.toFixed(2) + '%'],
      ['Worst fall', row.max_dd == null ? '-' : row.max_dd.toFixed(1) + '%'],
      ['Return per unit of risk',
        (row.vol && row[longest] != null) ? (row[longest] / row.vol).toFixed(2) : '-'],
      ['Rank in category', rankTxt]
    ]);
    const notes = [];
    if (row.vol != null) notes.push(row.vol < 12 ? 'Volatility under 12% - it moves less than most equity funds.'
      : row.vol > 20 ? 'Volatility above 20% - it swings harder than most, so the entry date matters more.'
      : 'Volatility in the usual range for an equity fund.');
    if (row.max_dd != null && row.max_dd < -50) notes.push('It has fallen ' + Math.abs(row.max_dd).toFixed(0)
      + '% from a peak before. That is the number to imagine living through, not the annual return.');
    if (notes.length) out += '<p class="sub" style="margin-top:10px">' + esc(notes.join(' ')) + '</p>';
  }

  // ---- against the other benchmarks ----
  const flags = [['Nifty', row.beats_nifty_5y, row.beats_nifty_10y],
                 ['Sensex', row.beats_sensex_5y, row.beats_sensex_10y],
                 ['Gold', row.beats_gold_5y, row.beats_gold_10y]];
  if (flags.some(f => f[1] != null || f[2] != null)){
    out += '<h5>Did it beat, over 5 and 10 years</h5>' + rowKV(flags.flatMap(f => [
      [f[0] + ' \u00b7 5y', f[1] == null ? '-' : (f[1] ? 'Yes' : 'No')],
      [f[0] + ' \u00b7 10y', f[2] == null ? '-' : (f[2] ? 'Yes' : 'No')]
    ]));
  }

  // ---- category context ----
  if (catMedian != null && row[longest] != null){
    out += '<h5>Its category</h5>' + rowKV([
      ['Funds in it', String(peers.length)],
      ['Category median ' + years + 'y', catMedian.toFixed(2) + '%'],
      ['This fund', row[longest].toFixed(2) + '%'],
      ['Difference', (row[longest] - catMedian > 0 ? '+' : '') + (row[longest] - catMedian).toFixed(2) + ' pp']
    ]);
  }

  // ---- SIP at its own past rate ----
  if (longest && plausible(row[longest], longest)){
    const monthly = 5000, n = years * 12, i = row[longest] / 100 / 12;
    const fv = i ? monthly * ((Math.pow(1 + i, n) - 1) / i) * (1 + i) : monthly * n;
    out += '<h5>If you had put \u20b9' + monthly.toLocaleString('en-IN') + ' a month in</h5>' + rowKV([
      ['For', years + ' years'],
      ['You would have put in', '\u20b9' + num(monthly * n)],
      ['It would be about', '\u20b9' + num(Math.round(fv))],
      ['Gain', '\u20b9' + num(Math.round(fv - monthly * n))]
    ]);
    out += '<p class="sub" style="margin-top:8px">Arithmetic at this fund\'s own ' + years
      + '-year rate, compounded monthly. Not a projection - the same rate rarely repeats.</p>';
  }

  out += '<p class="sub" style="margin-top:14px">Returns are annualised. A past return is not a '
    + 'promise.</p>';

  body.innerHTML = out;

  // the returns table needs a real table, not a string
  if (rowsR.length){
    const slot = body.querySelector('#retSlot');
    if (slot) slot.append(makeTable(rowsR, [
      {k:'window',label:'Window'},
      {k:'fund',label:'This fund',r:1,html:v=>pct(v)},
      {k:'nifty',label:'Nifty',r:1,html:v=>pct(v)},
      {k:'diff',label:'Gap',r:1,html:v=>(v>0?'+':'')+v.toFixed(2)+' pp'},
      {k:'verdict',label:''}
    ], {limit:6, noSearch:true}));
  }
  box.scrollTop = 0;
}

let COFIN = null;
async function companyFinancials(){

/* Company profile, management and the financial history the site did not have: revenue, profit,
   EBITDA, debt and equity by year, and revenue and profit by quarter, each drawn. */
let ORIGIN = null;
async function companyOrigin(){
  if (ORIGIN !== null) return ORIGIN;
  try { ORIGIN = await J('company_origin.json'); } catch (_) { ORIGIN = {companies:{}}; }
  return ORIGIN;
}

async function companyBlocks(sym){
  await companyFinancials();
  const c = (COFIN.companies || {})[sym] || {};
  const out = [];

  // ---- promoter holding - it was in shareholding.json and the page never read it ----
  try {
    const sh = await J('shareholding.json');
    const row = (sh.rows || []).find(r => r.symbol === sym.split('.')[0]);
    if (row && (row.promoter_pct != null || row.public_pct != null)){
      const sb = document.createElement('div');
      const rows2 = [
        ['Promoter', row.promoter_pct == null ? '-' : row.promoter_pct.toFixed(2) + '%'],
        ['Public', row.public_pct == null ? '-' : row.public_pct.toFixed(2) + '%'],
        ['Free float proxy', row.free_float_proxy_pct == null ? '-' : row.free_float_proxy_pct.toFixed(2) + '%']
      ];
      // the change since the previous quarter, now that the builder keeps two filings
      if (row.promoter_pct != null && row.prev_promoter_pct != null){
        const chg = row.promoter_pct - row.prev_promoter_pct;
        rows2.push(['Change since ' + (row.prev_as_of || 'previous quarter'),
          (chg > 0 ? '+' : '') + chg.toFixed(2) + ' pp']);
        rows2.push(['Previous', row.prev_promoter_pct.toFixed(2) + '%']);
      }
      rows2.push(['As of', esc(row.as_of || '-')]);
      sb.innerHTML = rowKV(rows2);
      if (row.promoter_pct != null && row.prev_promoter_pct != null){
        const chg = row.promoter_pct - row.prev_promoter_pct;
        const p4 = document.createElement('p');
        p4.className = 'sub'; p4.style.margin = '8px 0 0';
        p4.textContent = Math.abs(chg) < 0.01
          ? 'Promoter holding is unchanged from the previous quarter.'
          : 'Promoter holding ' + (chg > 0 ? 'rose' : 'fell') + ' by ' + Math.abs(chg).toFixed(2)
            + ' percentage points. A fall can be a sale, a dilution or a reclassification - the '
            + 'filing shows the change, not the reason.';
        sb.append(p4);
      }
      out.push(['Who owns it', 'shareholding', sb]);
    }
  } catch (_) { /* no shareholding file - skip the block */ }

  // ---- founders, founding year, ownership - from Wikidata ----
  await companyOrigin();
  const o = (ORIGIN.companies || {})[sym];
  if (o && (o.founders || o.inception || o.subsidiaries || o.parents || o.history)){
    const box = document.createElement('div');
    let html = '';
    const facts = [];
    if (o.founders && o.founders.length) facts.push(['Founded by', esc(o.founders.join(', '))]);
    if (o.inception) facts.push(['Founded', esc(o.inception)]);
    if (o.hq) facts.push(['Headquarters', esc(o.hq)]);
    if (o.parents && o.parents.length) facts.push(['Owned by', esc(o.parents.join(', '))]);
    if (facts.length) html += rowKV(facts);

    // the acquisition side: what this company owns, and what it is owned by
    if (o.subsidiaries && o.subsidiaries.length){
      html += '<h5>Companies it owns</h5><p style="margin:0;line-height:1.6">' +
        o.subsidiaries.map(esc).join(' \u00b7 ') + '</p>';
    }
    if (o.owns && o.owns.length){
      html += '<h5>Also recorded as owning</h5><p style="margin:0;line-height:1.6">' +
        o.owns.map(esc).join(' \u00b7 ') + '</p>';
    }
    if (o.history){
      html += '<h5>History</h5><p style="margin:0;line-height:1.6">' + esc(o.history) + '</p>';
    }
    html += '<p class="sub" style="margin-top:10px">From Wikidata and Wikipedia, which are '
      + 'community-edited - a founder, a date or a subsidiary can be missing, stale or wrong. '
      + 'The subsidiary list is what editors recorded, not a complete list of acquisitions. '
      + 'Current officers come from Yahoo, not from here.</p>';
    box.innerHTML = html;
    out.push(['Origin and ownership', o.inception ? o.inception.slice(0, 4) : 'Wikidata', box]);
  }

  // what the business is
  const facts = [];
  if (c.sector) facts.push(['Sector', esc(c.sector)]);
  if (c.industry) facts.push(['Industry', esc(c.industry)]);
  if (c.employees) facts.push(['Employees', Number(c.employees).toLocaleString('en-IN')]);
  if (c.city || c.country) facts.push(['Based in', esc([c.city, c.country].filter(Boolean).join(', '))]);
  if (c.insiders != null) facts.push(['Promoter / insider', (c.insiders * 100).toFixed(2) + '%']);
  if (c.institutions != null) facts.push(['Institutions', (c.institutions * 100).toFixed(2) + '%']);

  if (c.summary || facts.length){
    const box = document.createElement('div');
    let html = '';
    if (c.summary) html += '<p style="margin:0 0 10px;line-height:1.55">' + esc(c.summary) + '</p>';
    html += rowKV(facts);
    if (c.website) html += '<p class="sub" style="margin-top:8px">' +
      '<a href="' + esc(c.website) + '" target="_blank" rel="noopener">' + esc(c.website) + '</a></p>';
    box.innerHTML = html;
    out.push(['What the company does', c.name || sym, box]);
  }

  if (c.officers && c.officers.length){
    const box = document.createElement('div');
    box.innerHTML = rowKV(c.officers.map(o => [o.n, esc(o.t)]));
    out.push(['Management', c.officers.length + ' officers', box]);
  }

  // annual results, drawn
  const yrs = (c.annual_years || []).slice().reverse();   // oldest first
  const rev = (c.revenue || []).slice(0, yrs.length).reverse();
  const pro = (c.profit || []).slice(0, yrs.length).reverse();
  const ebi = (c.ebitda || []).slice(0, yrs.length).reverse();
  const dbt = (c.debt || []).slice(0, yrs.length).reverse();
  const eqt = (c.equity || []).slice(0, yrs.length).reverse();

  function yearCard(title, vals, colour, note){
    if (!vals || !vals.some(v => v != null)) return;
    const box = document.createElement('div');
    const ch = barChart(yrs, vals, {color: colour});
    if (ch) box.append(ch);
    box.append(barTable(yrs, vals, 'cr'));
    const first = vals.find(v => v != null), last = [...vals].reverse().find(v => v != null);
    if (first && last && first !== 0){
      const g = ((last / first) - 1) * 100;
      const p0 = document.createElement('p');
      p0.className = 'sub'; p0.style.margin = '8px 0 0';
      p0.textContent = 'From ' + num(first) + ' to ' + num(last) + ' over ' + vals.length +
        ' years: ' + (g > 0 ? '+' : '') + g.toFixed(1) + '%. ' + note;
      box.append(p0);
    }
    out.push([title, '\u20b9 crore', box]);
  }

  yearCard('Revenue, by year', rev, '#6ea8fe',
    'Revenue growing while profit does not is a company buying growth.');
  yearCard('Net profit, by year', pro, '#4ec9a0',
    'A falling profit line beside a rising revenue line is margin being squeezed.');
  yearCard('EBITDA, by year', ebi, '#9b8cff', 'Profit before interest, tax and depreciation.');
  yearCard('Total debt, by year', dbt, '#f0a35e',
    'Debt rising faster than profit is the thing to watch in a rate-rising cycle.');
  yearCard('Shareholders\' equity, by year', eqt, '#5ad0c8', 'What the owners actually have in it.');

  // quarterly
  const qp = (c.q_periods || []).slice().reverse();
  const qr = (c.q_revenue || []).slice(0, qp.length).reverse();
  const qn = (c.q_profit || []).slice(0, qp.length).reverse();
  if (qp.length && qr.some(v => v != null)){
    const box = document.createElement('div');
    const ch = barChart(qp, qr, {color: '#6ea8fe'});
    if (ch) box.append(ch);
    box.append(barTable(qp, qr, 'cr'));
    out.push(['Quarterly revenue', qp.length + ' quarters', box]);
  }
  if (qp.length && qn.some(v => v != null)){
    const box = document.createElement('div');
    const ch = barChart(qp, qn, {color: '#4ec9a0'});
    if (ch) box.append(ch);
    box.append(barTable(qp, qn, 'cr'));
    out.push(['Quarterly profit', qp.length + ' quarters', box]);
  }

  return out;
}

async function openStock(sym){
  const box = $('#sheet'), body = $('#sheetBody');
  box.classList.add('on'); box.setAttribute('aria-hidden','false');
  body.innerHTML = '<p class="loading">Loading ' + esc(sym) + '\u2026</p>';
  let db;
  try { db = await stockDB(); }
  catch (e) { body.innerHTML = '<p class="err">Could not load stock data: ' + esc(e.message) + '</p>'; return; }
  const s = db.bySym[sym], f = db.fund[sym];
  if (!s && !f){
    body.innerHTML = '<h3>' + esc(sym) + '</h3><p class="sub">No record for this symbol in '
      + 'stocks.json or fundamentals.json.</p>';
    return;
  }
  const t = (s && s.tech) || {}, fd = (s && s.fund) || {};
  const chg = s ? s.chg_pct : null;
  let out = '<h3>' + esc((s && s.name) || sym) + '</h3>'
    + '<div class="sub">' + esc(sym) + (s && s.sector ? ' \u00b7 ' + esc(s.sector) : '') + '</div>';
  if (s){
    out += '<div class="px ' + (chg > 0 ? 'up' : chg < 0 ? 'dn' : '') + '">' + fmt(s.close) + '</div>'
      + '<div class="' + (chg > 0 ? 'up' : chg < 0 ? 'dn' : '') + '" style="font-size:13px">'
      + (chg > 0 ? '+' : '') + fmt(chg) + '% today</div>';
  }
  // one chart slot with a timeframe switch above it, instead of two fixed lines
  out += '<div id="chartSlot"></div>';

  await longHistory();
  const longS = longSeriesFor(sym);
  let longHTML = '';
  if (longS && longS.c && longS.c.length >= 12){
    const yrs = ((longS.c.length - 1) / 12).toFixed(1);
    const cg = cagrOf(longS.c), tr = totalReturn(longS.c);
    const cmp = vsNifty(longS.c);
    longHTML = '<h5>Over ' + yrs + ' years</h5>';
    longHTML += rowKV([
      ['Total return', tr == null ? '-' : (tr > 0 ? '+' : '') + tr.toFixed(1) + '%'],
      ['Per year (CAGR)', cg == null ? '-' : (cg > 0 ? '+' : '') + cg.toFixed(1) + '%'],
      ['Nifty, same window', cmp ? ((cmp.nifty > 0 ? '+' : '') + cmp.nifty.toFixed(1) + '%') : '-'],
      ['Ahead of Nifty by', cmp ? ((cmp.diff > 0 ? '+' : '') + cmp.diff.toFixed(1) + ' pp') : '-']
    ]);
  }

  if (Object.keys(t).length){
    out += '<h5>Technicals</h5>' + rowKV([
      ['RSI 14', fmt(t.rsi_14, 1)], ['Trend', fmt(t.trend)],
      ['SMA 20', fmt(t.sma_20)], ['SMA 50', fmt(t.sma_50)],
      ['SMA 200', fmt(t.sma_200)], ['ADX', fmt(t.adx, 1)],
      ['MACD hist', fmt(t.macd_hist, 3)], ['Bollinger %B', fmt(t.bb_pctb, 2)],
      ['Volume x', fmt(t.vol_x, 2) + 'x'], ['ATR %', t.atr_pct == null ? '-' : fmt(t.atr_pct * 100, 2) + '%'],
      ['52w high', fmt(t.high_52w)], ['52w low', fmt(t.low_52w)]
    ]);
  }
  if (Object.keys(fd).length){
    out += '<h5>Fundamentals</h5>' + rowKV([
      ['P/E', fmt(fd.pe)], ['P/B', fmt(fd.pb)], ['EPS', fmt(fd.eps)],
      ['Div yield', fd.div_yield == null ? '-' : fmt(fd.div_yield) + '%'],
      ['Beta', fmt(fd.beta)], ['ROE', fd.roe == null ? '-' : roePct(fd.roe)],
      ['Market cap', mcapText(fd.mcap, sym)]
    ]);   // 52-week high and low live in the Technicals block; repeating them here wasted a row
    // where the P/E sits against its own sector
    if (fd.pe != null && s && s.sector){
      const pct = pePercentile(fd.pe, s.sector, db.bySym);
      if (pct){
        out += '<h5>P/E in context</h5>' + rowKV([
          ['This stock', fd.pe.toFixed(1)],
          ['Sector median', pct.median.toFixed(1)],
          ['Percentile', pct.pct + 'th of its sector'],
          ['Peers measured', pct.n + ' stocks']
        ]);
        out += '<p class="sub" style="margin-top:8px">A P/E in the '
          + pct.pct + 'th percentile of ' + esc(s.sector) + ' means it is priced '
          + (pct.pct < 33 ? 'below' : pct.pct > 66 ? 'above' : 'around the middle of')
          + ' most of its peers, from ' + pct.n + ' stocks that report a P/E. A low percentile '
          + 'is not the same as cheap - it can mean the market expects profit to fall.</p>';
      }
    }

    // plain-English read of the two or three numbers that actually place the stock
    const notes = [];
    if (fd.pe != null) notes.push(fd.pe < 15 ? 'P/E under 15 - priced for modest growth, or for trouble.'
      : fd.pe > 40 ? 'P/E above 40 - the market is already paying for a lot of future growth.'
      : 'P/E in the middle of the usual range.');
    if (fd.roe != null){
      const rp = Math.abs(fd.roe) <= 3 ? fd.roe * 100 : fd.roe;
      notes.push(rp > 18 ? 'ROE above 18% - the business earns well on shareholders\' money.'
        : rp < 8 ? 'ROE under 8% - thin returns on the equity in the business.'
        : 'ROE in a normal range.');
    }
    // the builder sets trend from close vs SMA50 vs SMA200, not from the 200-day alone
    if (t.trend){
      const rule = { up: 'close above the 50-day, and the 50-day above the 200-day',
                     down: 'close below the 50-day, and the 50-day below the 200-day',
                     mixed: 'the 50- and 200-day averages disagree' }[t.trend]
        || 'the moving averages give no clear reading';
      notes.push('Trend reads ' + t.trend + ' - ' + rule + '.');
    }
    if (notes.length) out += '<p class="sub" style="margin-top:10px">' + esc(notes.join(' ')) + '</p>';
  }

  // where it sits against its own year, and against its sector
  if (s && s.close != null && t.high_52w && t.low_52w){
    const pos = (s.close - t.low_52w) / ((t.high_52w - t.low_52w) || 1) * 100;
    out += '<h5>Position in its 52-week range</h5>' +
      '<div style="display:flex;height:9px;border-radius:5px;overflow:hidden;margin:2px 0 6px">' +
      '<div style="width:' + Math.max(0, Math.min(100, pos)).toFixed(1) + '%;background:#4ec9a0"></div>' +
      '<div style="width:' + Math.max(0, 100 - Math.min(100, pos)).toFixed(1) + '%;background:rgba(255,255,255,.12)"></div>' +
      '</div><p class="sub" style="margin:0">' + pos.toFixed(0) + '% of the way from the 52-week low to the high.</p>';
  }
  if (f){
    out += '<h5>Reported results \u00b7 ' + esc(f.latest_period || '-') + '</h5>' + rowKV([
      ['Revenue', f.revenue_cr == null ? '-' : '\u20b9' + fmt(f.revenue_cr, 1) + ' cr'],
      ['Profit', f.profit_cr == null ? '-' : '\u20b9' + fmt(f.profit_cr, 1) + ' cr'],
      ['Margin', f.margin_pct == null ? '-' : fmt(f.margin_pct, 2) + '%'],
      ['Revenue YoY', f.revenue_yoy_pct == null ? '-' : fmt(f.revenue_yoy_pct, 1) + '%'],
      ['Profit YoY', f.profit_yoy_pct == null ? '-' : fmt(f.profit_yoy_pct, 1) + '%'],
      ['Margin chg', f.margin_change_pp == null ? '-' : fmt(f.margin_change_pp, 2) + ' pp']
    ]);
    // freshness first: an old results block presented as current is the worst kind of wrong
    const qOld = quartersOld(f.latest_period);
    const stale = qOld != null && qOld > 2;
    out += '<p class="sub" style="margin-top:10px">'
      + 'Period ended ' + esc(f.latest_period || '-')
      + (f.filing_date ? ' \u00b7 filed ' + esc(f.filing_date) : ' \u00b7 filing date not in the feed')
      + ' \u00b7 ' + esc(f.basis || 'standalone') + ' figures'
      + ' \u00b7 year-ago period ' + esc(f.year_ago_period || '-')
      + '</p>';
    if (stale){
      out += '<p class="sub" style="margin-top:4px"><b>Stale:</b> the latest period is '
        + qOld + ' quarters old' + (f.filing_date ? '' : ' and no filing date is recorded')
        + '. Treat these as history, not as the current picture.</p>';
    }
    if (Array.isArray(f.quarters) && f.quarters.length > 2){
      out += '<h5>Five-quarter trend</h5><div id="qtrSlot"></div>';
    }
  }

  body.innerHTML = out;
  const slot = body.querySelector('#chartSlot');
  if (slot){
    // the timeframe bar
    const bar = document.createElement('div');
    bar.className = 'nchips';
    bar.style.margin = '2px 0 8px';
    bar.innerHTML = TF_LIST.map(t =>
      '<button data-tf="' + t[0] + '"' + (t[0] === '1d' ? ' class="on"' : '') + '>' +
      esc(t[1]) + '</button>').join('');
    slot.append(bar);
    const host = document.createElement('div');
    slot.append(host);

    const paint = async (tf) => {
      host.innerHTML = '<p class="loading">Loading ' + esc(tf) + '\u2026</p>';
      const s = await seriesForTimeframe(sym, tf);
      host.innerHTML = '';
      if (!s || !s.vals || s.vals.length < 2){
        const p0 = document.createElement('p'); p0.className = 'empty';
        p0.textContent = 'No ' + tf + ' data for ' + sym +
          '. Yahoo keeps 5-minute bars for about 60 days, so a thin name may have none.';
        host.append(p0);
        return;
      }
      const sp = sparkline(s.vals, {h: 96, unit: s.unit});
      if (sp) host.append(sp);
      const lab = document.createElement('p');
      lab.className = 'sub';
      lab.style.margin = '2px 0 0';
      lab.textContent = s.vals.length + ' ' + s.unit + ' \u00b7 ' + s.label;
      host.append(lab);
    };

    bar.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      [].forEach.call(bar.querySelectorAll('button'), x => x.classList.remove('on'));
      b.classList.add('on');
      paint(b.dataset.tf);
    });
    paint('1d');
  }
  // ---- base rates: how the next 5 and 20 sessions went the last times this stock looked like this ----
  try {
    const su = await J('setup_history.json');
    const row = (su.symbols || {})[sym.split('.')[0]];
    if (row && row.n){
      const thin = row.n < 30;   // the builder accepts 8 cases, the note called anything under 30 thin
      const bb = document.createElement('div');
      bb.innerHTML = rowKV([
        ['Setup', esc(row.bucket || '-')],
        ['Times it happened', String(row.n) + (thin ? '  \u00b7 thin sample' : '')],
        ['Next 5 sessions', row.fwd5_median == null ? '-' : (row.fwd5_median > 0 ? '+' : '') +
          row.fwd5_median.toFixed(2) + '% median, ' + (row.fwd5_hit == null ? '-' : row.fwd5_hit.toFixed(0) + '% up')],
        ['Next 20 sessions', row.fwd20_median == null ? '-' : (row.fwd20_median > 0 ? '+' : '') +
          row.fwd20_median.toFixed(2) + '% median, ' + (row.fwd20_hit == null ? '-' : row.fwd20_hit.toFixed(0) + '% up')],
        ['Data as of', esc((su.updated || '').slice(0, 10))]
      ]);
      const p1 = document.createElement('p');
      p1.className = 'sub'; p1.style.margin = '8px 0 0';
      p1.textContent = 'A base rate, not a forecast. It counts what happened after the same setup '
        + 'before, on this stock alone.' + (thin ? ' ' + row.n + ' cases is a thin sample - treat '
        + 'the percentages as a hint at best.' : '');
      bb.append(p1);
      body.append(card('Last times it looked like this', esc(row.bucket || ''), bb, ''));
    }
  } catch (_) { /* no setup file - skip */ }

  // company profile, management and the financial history, each block its own card
  try {
    const blocks = await companyBlocks(sym);
    blocks.forEach(b => body.append(card(b[0], b[1] || '', b[2], '')));
  } catch (_) { /* a missing profile must not break the card */ }

  box.scrollTop = 0;
}

}

document.addEventListener('DOMContentLoaded', () => {
  buildDrawer();
  const drawer = $('#drawer'), scrim = $('#scrim');
  const open = () => { drawer.classList.add('on'); scrim.classList.add('on'); };
  const close = () => { drawer.classList.remove('on'); scrim.classList.remove('on'); };
  $('#menuBtn').onclick = open;
  $('#dclose').onclick = close;
  scrim.onclick = close;
  drawer.addEventListener('click', e => { if (e.target.tagName === 'A') close(); });
  $('#newsBtn').onclick = () => { location.hash = '#/news'; };

  // stock sheet: close handlers + a delegated tap on any symbol-looking cell
  $('#sheetX').onclick = closeSheet;
  $('#sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  document.addEventListener('click', async e => {
    const td = e.target.closest && e.target.closest('td');
    if (!td || td.classList.contains('sym')) return;
    const txt = (td.textContent || '').trim();
    if (!/^[A-Z0-9&.\-]{2,20}$/.test(txt)) return;
    try {
      const db = await stockDB();
      if (!db.bySym[txt] && !db.fund[txt]) return;
      td.classList.add('sym');
      openStock(txt);
    } catch (_) { /* no stock data - leave the cell alone */ }
  });
  window.addEventListener('hashchange', route);
  route();
});
</script>
<script>
/* ---------------------------------------------------------------------------------------
   ONE LINK. arthasaar.vercel.app is meant to be the only address, with github.io forwarding
   to it. But forwarding blindly is worse than not forwarding: Vercel has not deployed since
   23 Nov, so a hard redirect would send every visitor to an older build.

   So the forward is conditional. github.io asks Vercel how fresh its data is and only
   redirects when Vercel is actually serving current data. Until then github.io keeps working
   normally, and the moment Vercel catches up the forward switches itself on with no further
   change needed here.

   If the probe fails for any reason - offline, blocked, slow - nothing happens and the page
   stays put. A redirect must never be the reason a site appears broken.
   --------------------------------------------------------------------------------------- */
(function(){
  if (location.hostname !== 'devrajai.github.io') return;   // already on the canonical host
  var MAX_AGE_H = 36;                                       // a weekend of slack
  var target = 'https://arthasaar.vercel.app' + location.pathname.replace(/^\/ArthaSaar/, '') + location.search + location.hash;
  try {
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var timer = ctl ? setTimeout(function(){ ctl.abort(); }, 2500) : null;
    fetch('https://arthasaar.vercel.app/data_asof.json', {cache:'no-store', signal: ctl ? ctl.signal : undefined})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if (timer) clearTimeout(timer);
        if (!d || !d.updated) return;
        var age = (Date.now() - Date.parse(d.updated)) / 3600000;
        if (!isFinite(age) || age < 0 || age > MAX_AGE_H) return;   // Vercel is stale - stay
        location.replace(target);
      })
      .catch(function(){ if (timer) clearTimeout(timer); });
  } catch (e) { /* never let this break the page */ }
})();
</script>

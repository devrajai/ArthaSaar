<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ArthaSaar</title>
<style>
:root{
  --ink:#0d1f33;--ink2:#3a5372;--muted:#6d86a3;--faint:#8fa6c0;
  --glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.76);
  --line:rgba(138,178,224,.30);--line2:rgba(138,178,224,.55);
  --up:#0b7a5c;--down:#b23a4b;--flat:#7b8ba1;--blue:#2f6fd0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  color:var(--ink);-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 640px at 10% -10%,#dbe9ff 0,transparent 56%),
    radial-gradient(980px 560px at 94% 2%,#e8f2ff 0,transparent 50%),
    radial-gradient(820px 520px at 46% 108%,#cfe3ff 0,transparent 58%),
    linear-gradient(168deg,#f6faff 0,#ecf4ff 50%,#e2eeff 100%);
  background-attachment:fixed;min-height:100vh}
header{position:sticky;top:0;z-index:60;padding:12px 16px 10px;display:flex;
  align-items:center;justify-content:center;gap:9px;position:sticky;
  background:linear-gradient(180deg,rgba(246,250,255,.94),rgba(246,250,255,0));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .28s}
header.hide{transform:translateY(-108%);opacity:0}
.burger{position:absolute;left:14px;width:30px;height:30px;border-radius:9px;display:grid;
  place-items:center;background:rgba(255,255,255,.72);border:1px solid var(--line);cursor:pointer}
.burger i{display:block;width:14px;height:1.7px;background:var(--ink2);border-radius:2px;position:relative}
.burger i::before,.burger i::after{content:"";position:absolute;left:0;width:14px;height:1.7px;
  background:var(--ink2);border-radius:2px}
.burger i::before{top:-4.5px}.burger i::after{top:4.5px}
.mark{width:26px;height:26px;border-radius:8px;flex:0 0 auto;
  background:linear-gradient(150deg,#d8e9ff,#8fbcff 58%,#4f8ce8);
  box-shadow:0 5px 14px rgba(70,130,215,.32),inset 0 1px 0 rgba(255,255,255,.92)}
.wm{font-size:16.5px;font-weight:660;letter-spacing:-.35px}
.wm em{font-style:normal;color:var(--muted);font-weight:520;font-size:12px;margin-left:7px}
.wrap{max-width:760px;margin:0 auto;padding:2px 16px 104px}
.g{background:var(--glass);border:1px solid var(--line);border-radius:20px;
  backdrop-filter:blur(24px) saturate(155%);-webkit-backdrop-filter:blur(24px) saturate(155%);
  box-shadow:0 12px 38px rgba(66,118,188,.10),inset 0 1px 0 rgba(255,255,255,.88)}
.pad{padding:17px}
section.page{display:none}
section.page.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 4px 9px}
.shead h2{margin:0;font-size:13.5px;font-weight:660}
.shead span{font-size:11.5px;color:var(--faint)}
.strip{padding:15px 17px 12px;margin-bottom:11px}
.stripRow{display:flex}
.sItem{flex:1;min-width:0;text-align:center}
.sDiv{width:1px;background:rgba(138,178,224,.30);margin:2px 5px}
.sName{font-size:9px;letter-spacing:.45px;color:var(--muted);font-weight:620;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sLvl{font-size:17.5px;font-weight:670;letter-spacing:-.6px;margin-top:3px;font-variant-numeric:tabular-nums}
.sChg{font-size:10.5px;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}
.stripFoot{display:flex;justify-content:space-between;gap:10px;margin-top:10px;padding-top:9px;
  border-top:1px solid rgba(138,178,224,.22);font-size:10px;color:var(--faint)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{padding:12px 13px;border-radius:15px;background:var(--glass2);border:1px solid var(--line);
  box-shadow:0 8px 22px rgba(66,118,188,.07),inset 0 1px 0 rgba(255,255,255,.9)}
.tile .k{font-size:9px;letter-spacing:.4px;color:var(--muted);text-transform:uppercase;font-weight:620}
.tile .v{font-size:19px;font-weight:670;letter-spacing:-.6px;margin-top:3px}
.tile .d{font-size:10px;color:var(--faint);margin-top:1px}
.ribWrap{position:relative;margin:0 -16px}
.ribs{display:flex;gap:9px;overflow-x:auto;padding:2px 16px 10px;scroll-snap-type:x mandatory;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ribs::-webkit-scrollbar{display:none}
.ribWrap::after{content:"";position:absolute;top:0;right:0;bottom:10px;width:48px;pointer-events:none;
  background:linear-gradient(90deg,rgba(236,244,255,0),rgba(236,244,255,.93))}
.rib{flex:0 0 152px;scroll-snap-align:start;border-radius:16px;padding:12px 13px;
  background:var(--glass2);border:1px solid var(--line);cursor:pointer;
  box-shadow:0 8px 22px rgba(66,118,188,.08),inset 0 1px 0 rgba(255,255,255,.9)}
.rib .n{font-size:11px;font-weight:620;color:var(--ink2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.rib .m{font-size:19px;font-weight:680;letter-spacing:-.6px;margin-top:3px}
.rib .bb{height:4px;border-radius:99px;background:rgba(150,180,215,.26);margin-top:7px;overflow:hidden}
.rib .bb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#a8ccf8,#3f7fd6)}
.rib .bt{font-size:9.5px;color:var(--faint);margin-top:4px}
.rows{display:flex;flex-direction:column}
.rw{display:flex;align-items:center;gap:10px;padding:11px 2px;
  border-bottom:1px solid rgba(138,178,224,.20)}
.rw:last-child{border-bottom:none}
.dot{width:6px;height:6px;border-radius:99px;flex:0 0 auto}
.rl{flex:1;font-size:12.5px;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.rl small{display:block;font-size:9.5px;color:var(--faint)}
.rv{font-variant-numeric:tabular-nums;font-weight:640;font-size:12.5px}
.rp{font-size:10.5px;color:var(--faint);width:54px;text-align:right;font-variant-numeric:tabular-nums}
.mcard{padding:14px;margin-bottom:9px}
.mcard .t{font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);font-weight:620}
.mcard .p{font-size:25px;font-weight:680;letter-spacing:-1px;margin-top:3px}
.mcard .u{font-size:10.5px;color:var(--faint)}
.tiers{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.tier{font-size:10px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.8);
  border:1px solid var(--line);color:var(--ink2);font-variant-numeric:tabular-nums;font-weight:560}
.chain{display:flex;flex-direction:column}
.cx{display:flex;align-items:center;gap:10px;padding:11px 2px;
  border-bottom:1px solid rgba(138,178,224,.20)}
.cx:last-child{border-bottom:none}
.cxe{flex:1}
.cxd{font-size:12.5px;font-weight:640}
.cxs{font-size:10px;color:var(--faint)}
.cxr{text-align:right;font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums;line-height:1.5}
.tabs{display:flex;gap:7px;margin:2px 0 11px}
.tab{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:12px;font-size:12px;
  font-weight:600;color:var(--ink2);cursor:pointer;background:rgba(255,255,255,.6);
  border:1px solid var(--line)}
.tab.on{background:linear-gradient(150deg,rgba(226,239,255,.95),rgba(200,224,255,.9));
  border-color:rgba(120,170,230,.6);color:#17427e;
  box-shadow:0 6px 18px rgba(70,130,210,.16),inset 0 1px 0 rgba(255,255,255,.9)}
.search{display:flex;align-items:center;gap:9px;margin-bottom:10px;padding:10px 13px;
  border-radius:13px;background:rgba(255,255,255,.72);border:1px solid var(--line)}
.search svg{width:15px;height:15px;fill:none;stroke:var(--faint);stroke-width:2;flex:0 0 auto}
.search input{border:0;outline:0;background:transparent;flex:1;font-size:13px;color:var(--ink)}
.search input::placeholder{color:var(--faint)}
.cWrap{position:relative;margin:0 -16px}
.cnts{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.cnts::-webkit-scrollbar{display:none}
.cWrap::after{content:"";position:absolute;top:0;right:0;bottom:10px;width:42px;pointer-events:none;
  background:linear-gradient(90deg,rgba(236,244,255,0),rgba(236,244,255,.93))}
.cc{flex:0 0 auto;font-size:11px;padding:6px 11px;border-radius:99px;cursor:pointer;
  background:rgba(255,255,255,.72);border:1px solid var(--line);color:var(--ink2);
  display:flex;align-items:center;gap:5px;font-weight:560}
.cc.on{background:#0d1f33;color:#fff;border-color:#0d1f33}
.cc .d{width:5px;height:5px;border-radius:99px}
.cc .n{opacity:.7;font-weight:500}
.item{padding:12px 13px;margin-bottom:8px;border-radius:15px;background:var(--glass2);
  border:1px solid var(--line);text-decoration:none;color:inherit;display:block;
  box-shadow:0 8px 24px rgba(66,118,188,.07),inset 0 1px 0 rgba(255,255,255,.9)}
.meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.pill{font-size:9.5px;padding:3px 8px;border-radius:99px;font-weight:620;display:flex;
  align-items:center;gap:4px;border:1px solid transparent}
.pill .d{width:4px;height:4px;border-radius:99px;background:currentColor}
.p-general{background:rgba(47,111,208,.1);color:#1f5cb8;border-color:rgba(47,111,208,.2)}
.p-results{background:rgba(11,122,92,.1);color:#0b6b52;border-color:rgba(11,122,92,.2)}
.p-global{background:rgba(123,88,201,.1);color:#6544b0;border-color:rgba(123,88,201,.2)}
.p-policy{background:rgba(176,117,42,.1);color:#8f5f1e;border-color:rgba(176,117,42,.2)}
.co{font-size:9.5px;padding:3px 7px;border-radius:99px;background:rgba(255,255,255,.9);
  border:1px solid var(--line);color:var(--ink2);display:flex;align-items:center;gap:4px;font-weight:600}
.co .av{width:10px;height:10px;border-radius:99px;background:linear-gradient(145deg,#cfe4ff,#7fb2f0);
  display:grid;place-items:center;font-size:5.5px;color:#fff;font-weight:700}
.src{font-size:9.5px;color:var(--faint)}
.tm{margin-left:auto;font-size:9.5px;color:var(--faint);display:flex;align-items:center;gap:3px;
  white-space:nowrap}
.tm svg{width:9px;height:9px;fill:none;stroke:currentColor;stroke-width:2}
.item h3{margin:0;font-size:12.5px;font-weight:640;line-height:1.45}
nav{position:fixed;left:0;right:0;bottom:0;z-index:70;padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  display:flex;justify-content:space-around;align-items:center;
  background:rgba(250,253,255,.88);backdrop-filter:blur(26px) saturate(160%);
  -webkit-backdrop-filter:blur(26px) saturate(160%);
  border-top:1px solid var(--line2);box-shadow:0 -6px 30px rgba(60,110,180,.10)}
.nv{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 8px;border-radius:12px;
  cursor:pointer;color:var(--faint);flex:1;max-width:72px;transition:color .16s,background .16s}
.nv svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.85;
  stroke-linecap:round;stroke-linejoin:round}
.nv span{font-size:9px;font-weight:600}
.nv.on{color:var(--blue);background:rgba(47,111,208,.09)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,45,80,.18);z-index:88;opacity:0;
  pointer-events:none;transition:opacity .26s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(84vw,330px);z-index:90;overflow-y:auto;
  padding:20px 16px 28px;transform:translateX(-102%);
  transition:transform .3s cubic-bezier(.32,.72,0,1);
  background:rgba(250,253,255,.96);backdrop-filter:blur(30px) saturate(165%);
  -webkit-backdrop-filter:blur(30px) saturate(165%);
  border-right:1px solid var(--line2);box-shadow:6px 0 50px rgba(50,100,170,.18)}
.drawer.open{transform:translateX(0)}
.dHead{display:flex;align-items:center;gap:9px;margin-bottom:18px}
.dGrp{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);
  font-weight:680;margin:16px 0 6px;padding-left:10px}
.dIt{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:11px;cursor:pointer;
  font-size:13.5px;color:var(--ink2);font-weight:560}
.dIt.on{background:rgba(47,111,208,.10);color:#17427e;font-weight:660}
.dIt .n{margin-left:auto;font-size:10px;color:var(--faint)}
.note{font-size:10.5px;color:var(--faint);line-height:1.6;margin-top:11px;text-align:center}
@media(max-width:520px){.wrap{padding:2px 12px 100px}.sLvl{font-size:16px}}
</style>
</head>

function fmtv(c){const u=c.unit||'';
  if(u==='%')return Number(c.to).toFixed(1)+'%';
  if(u==='crore')return '₹'+inr(Math.round(c.to))+' cr';
  if(u==='rupees')return '₹'+inr(Math.round(c.to));
  if(u==='ratio')return Number(c.to).toFixed(2);
  return inr(Math.round(c.to));}

 learn(){
  const items=[
   ['Breadth','The share of stocks above their own moving average. A rising index on falling breadth means a few large stocks are carrying it.'],
   ['PCR','Total put open interest divided by call open interest. A description of positioning, not a prediction — ours has not beaten its baseline.'],
   ['Max pain','The strike where option buyers collectively lose least. Arithmetic on open interest, not a target.'],
   ['21-session range','What Nifty has actually done over 21 sessions in the past ten years. History, not a forecast.'],
   ['Gap','A jump at the open. "Filled" means price traded back through it.'],
   ['Lot size','How many shares one derivative contract covers. A ₹2 premium on a 65 lot costs ₹130, not ₹2.'],
   ['Pivot','Arithmetic on the previous session\'s high, low and close. A reference level, not a forecast.'],
   ['Narrow move','A sector whose median is up while most of its stocks are below trend. One or two names carrying the rest.']
  ];
  fill('learnBox',e=>e.innerHTML=items.map(([t,d])=>`
    <div class="g pad" style="margin-bottom:9px">
      <div style="font-size:13px;font-weight:660;margin-bottom:4px">${t}</div>
      <div style="font-size:11.5px;color:var(--ink2);line-height:1.6">${d}</div></div>`).join('')
    +`<p class="note">Market data and descriptions only. Not investment advice.</p>`);
 }
};

/* ---------- news ---------- */
let NCAT='all',NQ='';
const CL={all:'All',results:'Results',general:'General',global:'Global',policy:'Policy'};
const CC={general:'#2f6fd0',results:'#0b7a5c',global:'#7b58c9',policy:'#b0752a'};
function when(p){if(!p)return'';const d=new Date(p);if(isNaN(d))return String(p).slice(0,16);
  return d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});}
function renderNews(){
  const items=(D.news||[]).filter(it=>{
    if(NCAT!=='all'&&it.category!==NCAT)return false;
    if(NQ){const s=(it.title+' '+(it.company||'')+' '+it.source).toLowerCase();
      if(s.indexOf(NQ.toLowerCase())<0)return false;}return true;});
  const counts={all:(D.news||[]).length};
  (D.news||[]).forEach(i=>counts[i.category]=(counts[i.category]||0)+1);
  fill('cnts',e=>{e.innerHTML=Object.keys(CL).filter(k=>counts[k]).map(k=>`
    <span class="cc ${NCAT===k?'on':''}" data-c="${k}">
      ${k!=='all'?`<span class="d" style="background:${CC[k]}"></span>`:''}
      ${CL[k]} <span class="n">${counts[k]}</span></span>`).join('');
    e.querySelectorAll('.cc').forEach(c=>c.onclick=()=>{NCAT=c.dataset.c;renderNews()});});
  fill('newsList',e=>{e.innerHTML=items.length?items.map(it=>`
    <a class="item" href="${it.link}" target="_blank" rel="noopener">
      <div class="meta">
        <span class="pill p-${it.category}"><span class="d"></span>${CL[it.category]||it.category}</span>
        ${it.company?`<span class="co"><span class="av">${it.company.slice(0,2)}</span>${it.company}</span>`:''}
        <span class="src">${it.source}</span>
        <span class="tm">${when(it.published)}</span></div>
      <h3>${it.title.replace(/</g,'&lt;')}</h3></a>`).join('')
    :`<div class="g pad" style="text-align:center;color:var(--muted);font-size:12.5px">Nothing matches.</div>`;});
  const q=document.getElementById('q'); if(q&&!q._w){q._w=1;q.oninput=()=>{NQ=q.value.trim();renderNews()}};
}

/* ---------- nav ---------- */
let CUR='home';
function go(p){
  if(!B[p])p='home';
  CUR=p;
  const w=document.getElementById('wrap');
  w.innerHTML=`<section class="page on" id="p-${p}">${B[p]()}</section>`;
  if(AFTER[p])AFTER[p]();
  document.querySelectorAll('.nv').forEach(n=>n.classList.toggle('on',n.dataset.p===p));
  document.querySelectorAll('.dIt').forEach(n=>n.classList.toggle('on',n.dataset.p===p));
  scrollTo({top:0,behavior:'instant'});
  closeDrawer();
}
document.querySelectorAll('.nv').forEach(n=>n.onclick=()=>go(n.dataset.p));

/* drawer */
const drawer=document.getElementById('drawer'), scrim=document.getElementById('scrim');
(function buildDrawer(){
  const groups={};
  PAGES.forEach(p=>{(groups[p.grp]=groups[p.grp]||[]).push(p)});
  drawer.innerHTML=`<div class="dHead"><div class="mark"></div>
      <div class="wm" style="font-size:15px">ArthaSaar</div></div>`+
    Object.keys(groups).map(g=>`<div class="dGrp">${g}</div>`+
      groups[g].map(p=>`<div class="dIt" data-p="${p.id}">${p.label}</div>`).join('')).join('')+
    `<p class="note" style="text-align:left;margin-top:20px;padding-left:10px">
       Market data and descriptions only.<br>Not investment advice.</p>`;
  drawer.querySelectorAll('.dIt').forEach(d=>d.onclick=()=>go(d.dataset.p));
})();
function openDrawer(){drawer.classList.add('open');scrim.classList.add('on');}
function closeDrawer(){drawer.classList.remove('open');scrim.classList.remove('on');}
document.getElementById('burger').onclick=openDrawer;
scrim.onclick=closeDrawer;

/* header hide */
let ly=0;
addEventListener('scroll',()=>{const y=scrollY,hd=document.getElementById('hd');
  if(y>ly&&y>70)hd.classList.add('hide');else hd.classList.remove('hide');ly=y;},{passive:true});

go('home');
</script>

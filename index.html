<!doctype html>
<html lang="en" data-theme="a">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src * data:; connect-src *; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arthasaar — Market Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Archivo:wght@400;600;700;800;900&family=Spline+Sans+Mono:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:14px var(--font);padding-bottom:104px;background-attachment:fixed}
.mono{font-family:var(--mono)}
.up{color:var(--up)}.dn{color:var(--down)}
.fr{float:right;color:var(--dim);font:400 9.5px var(--mono)}
.gl{stroke:var(--border);stroke-width:1}
.hdr{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-bottom:var(--bw,1px) solid var(--border)}
.top{max-width:1000px;margin:auto;padding:10px 14px 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px}
.mk{width:32px;height:32px;border-radius:var(--rad);background:var(--accent);color:var(--bg);display:grid;place-items:center;font:800 12px var(--mono)}
.brand b{font-size:15px;letter-spacing:.06em}
.brand small{display:block;color:var(--dim);font:400 8.5px var(--mono);letter-spacing:.14em}
.clock{font:400 10px var(--mono);opacity:.9;flex:0 0 auto}
@media(max-width:560px){
  .top{flex-wrap:nowrap;gap:6px;padding:8px 10px 5px}
  .brand{gap:7px}
  .brand b{font-size:12.5px;letter-spacing:.02em}
  .mk{width:24px;height:24px;font-size:10px;border-radius:7px}
  .sg{margin-left:2px;gap:4px}
  .top .pill{padding:4px 6px;font-size:8px;gap:3px}
  .clock{font-size:9px}
}
.clock b{color:var(--accent);font-variant-numeric:tabular-nums}
.clock small{display:block;color:var(--faint);font-size:8px;letter-spacing:1px}
.sg{display:flex;gap:5px;align-items:center;margin-left:10px}
.pill{border:var(--bw,1px) solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:5px 9px;font:600 9px var(--mono);display:inline-flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--up);display:inline-block}
.tbtn{cursor:pointer;transition:border-color .15s;line-height:1;font-size:8px;padding:4px 8px;gap:3px}
.tbtn:hover{border-color:var(--accent)}
.nav{max-width:1000px;margin:auto;display:flex;flex-direction:column;gap:5px;padding:0 14px 8px}
.nrow{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.nrow::-webkit-scrollbar{display:none}
.ng{font:600 8px var(--mono);letter-spacing:.16em;color:var(--faint);flex:0 0 auto;margin-right:4px;padding:5px 0}
.nav button{flex:0 0 auto}
.nav button{white-space:nowrap;border:1px solid transparent;background:transparent;color:var(--dim);padding:7px 13px;border-radius:8px;cursor:pointer;font:600 12px var(--font);transition:all .15s}
.nav button:hover{color:var(--text)}
.nav button.active{background:var(--surface);color:var(--text);border-color:var(--border)}
.hdr.scrolled .nav{display:none}
.hdr.scrolled .top{padding:6px 14px 5px}
.hdr.scrolled .brand small{display:none}
main{max-width:1000px;margin:auto;padding:14px 14px 8px}
.view{display:none}
.view.on{display:block;animation:vi .3s ease}
@keyframes vi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font:700 17px var(--font);margin:2px 0 12px;padding-left:11px;border-left:3px solid var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.minirow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{background:var(--surface);border:var(--bw,1px) solid var(--border);border-radius:var(--rad);overflow:hidden;transition:border-color .2s,transform .2s,box-shadow .2s}
.card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi{padding:13px 14px}
.lbl{font:600 9px var(--mono);letter-spacing:.14em;color:var(--dim)}
.num{font:600 21px var(--mono);margin:6px 0 3px;font-variant-numeric:tabular-nums}
.chg{font:500 10.5px var(--mono)}
.sh2{padding:11px 14px 9px;border-bottom:var(--bw,1px) solid var(--border);font:600 10px var(--mono);letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.sect{margin:18px 0 8px;font:600 10px var(--mono);letter-spacing:.2em;color:var(--faint)}
.ni{padding:11px 14px;border-bottom:var(--bw,1px) solid var(--border)}
.ni:last-child{border:0}
.ni b{font-size:12px;line-height:1.45;display:block}
.ni small{color:var(--faint);font:400 9.5px var(--mono);display:block;margin-top:4px}
.zrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:var(--bw,1px) solid var(--border);font-size:11.5px}
.zrow:last-child{border:0}
.breadth{height:7px;border-radius:4px;background:var(--down);overflow:hidden}
.breadth i{display:block;height:100%;background:var(--up)}
.s11{font-size:11px}
table{width:100%;border-collapse:collapse;font-size:11.5px;min-width:560px}
th{text-align:left;padding:9px 10px;font:600 9px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);background:color-mix(in srgb,var(--border) 30%,var(--surface));position:sticky;top:0}
td{padding:9px 10px;border-bottom:var(--bw,1px) solid var(--border)}
tr:last-child td{border:0}
tr:hover td{background:color-mix(in srgb,var(--border) 18%,transparent)}
.b{font:600 8.5px var(--mono);letter-spacing:.08em;border-radius:5px;padding:2.5px 7px;border:var(--bw,1px) solid var(--border)}
.b.buy{color:var(--up);border-color:color-mix(in srgb,var(--up) 45%,transparent);background:color-mix(in srgb,var(--up) 10%,transparent)}
.b.hold{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.b.dn{color:var(--down);border-color:color-mix(in srgb,var(--down) 45%,transparent);background:color-mix(in srgb,var(--down) 10%,transparent)}
.srow{display:flex;gap:8px;margin-bottom:12px}
.srow input{flex:1;min-width:180px;border-radius:10px;border:var(--bw,1px) solid var(--border2);background:var(--surface);padding:10px 13px;color:var(--text);font:400 13px var(--font);outline:none;transition:border-color .15s}
.srow input:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fch{font:500 10px var(--mono);border:var(--bw,1px) solid var(--border);border-radius:999px;padding:5px 11px;color:var(--dim);cursor:pointer;background:var(--surface)}
.fch.on{color:var(--accent);border-color:var(--accent)}
.dock{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:50;width:min(700px,calc(100% - 20px));display:flex;gap:7px;align-items:center;background:color-mix(in srgb,var(--surface) 92%,transparent);border:var(--bw,1px) solid var(--border2);border-radius:999px;padding:7px;box-shadow:var(--shadow);backdrop-filter:blur(15px)}
.db{width:34px;height:34px;flex-shrink:0;border-radius:10px;border:var(--bw,1px) solid var(--border);background:var(--surface);color:var(--dim);display:grid;place-items:center;cursor:pointer;transition:all .15s;padding:0}
.db:hover{color:var(--text);border-color:var(--accent)}
.db.on{color:var(--accent);border-color:var(--accent)}
.ds{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:transparent;border:none;padding:8px 6px;cursor:pointer;color:var(--dim);font-family:var(--font)}
.ds span{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:8vh 10px 0}
.ov.open{display:flex}
.sheet{width:min(680px,95vw);background:var(--surface);border:var(--bw,1px) solid var(--border2);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.ovh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:var(--bw,1px) solid var(--border);font:600 10px var(--mono);letter-spacing:.18em;color:var(--dim)}
.x{background:var(--surface);border:var(--bw,1px) solid var(--border);color:var(--dim);border-radius:7px;padding:5px 10px;font:500 9.5px var(--mono);cursor:pointer}
.x:hover{color:var(--text);border-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 16px 18px}
.gt{text-align:left;background:var(--bg2);border:var(--bw,1px) solid var(--border);border-radius:11px;padding:11px 12px;cursor:pointer;transition:all .15s;font-family:var(--font);position:relative}
.gt:hover{border-color:var(--accent);transform:translateY(-1px)}
.gt b{display:block;font-size:12px;color:var(--text)}
.gt small{font:400 9px var(--mono);color:var(--faint)}
.al{display:flex;flex-direction:column;padding:10px 12px 14px}
.mlist{display:flex;flex-direction:column;gap:5px;padding:10px 12px 4px;max-height:42vh;overflow-y:auto}
.mli{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;cursor:pointer;color:var(--text);font:600 12.5px var(--font);transition:all .15s;text-align:left;width:100%}
.mli:hover{border-color:var(--accent);transform:translateY(-1px)}
.mli small{font:400 9.5px var(--mono);color:var(--faint);white-space:nowrap}
.mb{display:flex;align-items:center;gap:12px;background:var(--bg2);border:var(--bw,1px) solid var(--border);border-radius:10px;padding:12px 14px;margin-top:7px;cursor:pointer;color:var(--text);font:600 13px var(--font);transition:all .15s;text-align:left}
.mb:hover{border-color:var(--accent)}
.mb .ic{width:30px;height:30px;border-radius:8px;background:var(--surface2);border:var(--bw,1px) solid var(--border);display:grid;place-items:center;color:var(--accent);flex:0 0 auto}
.mb small{display:block;font:400 10px var(--mono);color:var(--faint);margin-top:2px}
.pal input{width:100%;background:var(--bg2);border:none;outline:none;color:var(--text);font:500 15px var(--font);padding:14px 16px;border-bottom:var(--bw,1px) solid var(--border)}
.plist{max-height:56vh;overflow-y:auto;padding:6px 0}
.pg{font:600 9px var(--mono);letter-spacing:.15em;color:var(--faint);padding:10px 16px 4px}
.pi{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;color:var(--text);font-size:13px}
.pi:hover{background:color-mix(in srgb,var(--border) 15%,transparent)}
.pi small{margin-left:auto;color:var(--faint);font:400 9.5px var(--mono)}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--surface);border:1px solid var(--accent);color:var(--text);padding:10px 18px;border-radius:10px;font:500 12.5px var(--font);z-index:90;transition:transform .25s;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.minirow{grid-template-columns:1fr 1fr}.tiles{grid-template-columns:repeat(2,1fr)}}

/* ================= 5 THEME MODES ================= */
/* 1) PAPER — simple person, light (Fraunces serif) */
:root{--bg:#f6f1e6;--bg2:#fbf8f0;--surface:#fdfbf4;--surface2:#f0e9d8;
  --border:#d9cfb6;--border2:#b8a67e;--text:#201c15;--dim:#6b6250;--faint:#9a9080;
  --accent:#b5721f;--up:#1f7a4d;--down:#b3323c;
  --font:'Fraunces',Georgia,serif;--mono:'Spline Sans Mono',monospace;
  --rad:10px;--bw:1px;--shadow:0 10px 26px rgba(90,70,30,.14)}
[data-theme="a"] body{background-image:radial-gradient(ellipse 60% 30% at 50% 0%,rgba(181,114,31,.05),transparent)}
[data-theme="a"] h2{font-family:'Fraunces',Georgia,serif;font-weight:600;border-left:none;border-bottom:2px solid var(--text);padding:0 0 6px;border-radius:0}
[data-theme="a"] .ni b{font-family:'Fraunces',serif;font-size:13px}
[data-theme="a"] .mk{border-radius:50%;background:var(--text);color:var(--bg)}
[data-theme="a"] .sect{border-bottom:1px solid var(--border2);padding-bottom:5px}

/* 2) INK — simple person, dark */
[data-theme="b"]{--bg:#17140f;--bg2:#1d1913;--surface:#211c15;--surface2:#2a2419;
  --border:#3a3323;--border2:#5c5133;--text:#efe6d4;--dim:#a3987f;--faint:#6f6650;
  --accent:#d9963f;--up:#7fae5f;--down:#e06565;--shadow:0 12px 30px rgba(0,0,0,.5)}
[data-theme="b"] h2{font-family:'Fraunces',Georgia,serif;font-weight:600;border-left:none;border-bottom:2px solid var(--text);padding:0 0 6px}
[data-theme="b"] .ni b{font-family:'Fraunces',serif;font-size:13px}
[data-theme="b"] .mk{border-radius:50%;background:var(--text);color:var(--bg)}
[data-theme="b"] .sect{border-bottom:1px solid var(--border2);padding-bottom:5px}

/* 3) AMOLED — pure black, battery saver, minimal system font */
[data-theme="c"]{--bg:#000000;--bg2:#000000;--surface:#0a0a0a;--surface2:#141414;
  --border:#202020;--border2:#333333;--text:#eaeaea;--dim:#8f8f8f;--faint:#5e5e5e;
  --accent:#e8b45a;--up:#37b26d;--down:#e05260;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'Spline Sans Mono',monospace;
  --rad:8px;--bw:1px;--shadow:0 8px 24px rgba(0,0,0,.65)}
[data-theme="c"] body{background-image:none}
[data-theme="c"] .pill{border-color:rgba(255,255,255,.28);background:#111;color:#eee}
[data-theme="c"] .tbtn{color:var(--accent)}
[data-theme="c"] .clock b{color:var(--accent)}
[data-theme="c"] .card:hover{box-shadow:none;border-color:var(--border2)}
[data-theme="c"] .card{transition:border-color .15s}
[data-theme="c"] h2{border-left:none;padding-left:0;border-bottom:1px solid var(--border);border-radius:0}

/* 4) CREAM BRUTAL — genz, light */
[data-theme="d"]{--bg:#f3efe6;--bg2:#ffffff;--surface:#ffffff;--surface2:#ffe9a8;
  --border:#171310;--border2:#171310;--text:#171310;--dim:#6a6156;--faint:#a09285;
  --accent:#d8a01d;--up:#1c8a4b;--down:#cc2f3e;
  --font:'Archivo',sans-serif;--mono:'Space Mono',monospace;
  --rad:12px;--bw:2px;--shadow:5px 5px 0 #171310}
[data-theme="d"] body{background-image:repeating-linear-gradient(45deg,transparent 0 26px,rgba(23,19,16,.025) 26px 27px)}
[data-theme="d"] .brand b{font-weight:900;text-transform:uppercase;letter-spacing:.02em;font-size:16px}
[data-theme="d"] .mk{box-shadow:3px 3px 0 var(--text)}
[data-theme="d"] h2,[data-theme="d"] .sh2{font-weight:800}
[data-theme="d"] h2{font-weight:900;text-transform:uppercase;border-left:none;border-bottom:3px solid var(--border);padding:0 0 5px}
[data-theme="d"] .nav button{font-weight:800;text-transform:uppercase;letter-spacing:.04em}
[data-theme="d"] .nav button.active{background:var(--accent);box-shadow:3px 3px 0 var(--border)}
[data-theme="d"] .pill{box-shadow:3px 3px 0 var(--border);font-weight:700}
[data-theme="d"] .card{box-shadow:5px 5px 0 var(--border)}
[data-theme="d"] .card:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--border)}
[data-theme="d"] .db{box-shadow:3px 3px 0 var(--border);font-weight:700}
[data-theme="d"] .db:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--border)}
[data-theme="d"] .db.on{background:var(--accent)}
[data-theme="d"] .b,[data-theme="d"] .fch{box-shadow:2px 2px 0 var(--border);font-weight:700}
[data-theme="d"] .fch.on{background:var(--accent)}
[data-theme="d"] .gt{box-shadow:3px 3px 0 var(--border)}
[data-theme="d"] .gt:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--border)}
[data-theme="d"] .mb{box-shadow:3px 3px 0 var(--border);font-weight:700}
[data-theme="d"] .dock{box-shadow:6px 6px 0 var(--border)}
[data-theme="d"] .num{font-weight:700}

/* 5) BLACK BRUTAL — genz, dark */
[data-theme="e"]{--bg:#171310;--bg2:#241d17;--surface:#241d17;--surface2:#2f2620;
  --border:#f3efe6;--border2:#f3efe6;--text:#f3efe6;--dim:#b0a695;--faint:#786f60;
  --accent:#ffc933;--up:#3ecf7a;--down:#ff6a6a;
  --font:'Archivo',sans-serif;--mono:'Space Mono',monospace;
  --rad:12px;--bw:2px;--shadow:5px 5px 0 rgba(243,239,230,.9)}
[data-theme="e"] body{background-image:repeating-linear-gradient(45deg,transparent 0 26px,rgba(243,239,230,.02) 26px 27px)}
[data-theme="e"] .brand b{font-weight:900;text-transform:uppercase;letter-spacing:.02em;font-size:16px}
[data-theme="e"] .mk{box-shadow:3px 3px 0 var(--text)}
[data-theme="e"] h2{font-weight:900;text-transform:uppercase;border-left:none;border-bottom:3px solid var(--border);padding:0 0 5px}
[data-theme="e"] .sh2{font-weight:800}
[data-theme="e"] .nav button{font-weight:800;text-transform:uppercase;letter-spacing:.04em}
[data-theme="e"] .nav button.active{background:var(--accent);color:#171310;box-shadow:3px 3px 0 var(--border)}
[data-theme="e"] .pill{box-shadow:3px 3px 0 var(--border);font-weight:700}
[data-theme="e"] .card{box-shadow:5px 5px 0 rgba(243,239,230,.9)}
[data-theme="e"] .card:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 rgba(243,239,230,.9)}
[data-theme="e"] .db{box-shadow:3px 3px 0 var(--border);font-weight:700}
[data-theme="e"] .db:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--border)}
[data-theme="e"] .db.on{background:var(--accent);color:#171310}
[data-theme="e"] .b,[data-theme="e"] .fch{box-shadow:2px 2px 0 var(--border);font-weight:700}
[data-theme="e"] .fch.on{background:var(--accent);color:#171310}
[data-theme="e"] .gt{box-shadow:3px 3px 0 var(--border)}
[data-theme="e"] .gt:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--border)}
[data-theme="e"] .mb{box-shadow:3px 3px 0 var(--border);font-weight:700}
[data-theme="e"] .dock{box-shadow:6px 6px 0 rgba(243,239,230,.9)}
[data-theme="e"] .mk{background:var(--accent);color:#171310}

.heat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.hc{border:1px solid var(--border);border-radius:11px;padding:11px 12px}
.hc b{font-size:11px;display:block;margin-bottom:3px}
.hc span{font:600 13px var(--mono)}
@media(max-width:760px){.heat{grid-template-columns:repeat(2,1fr)}}
.tgo{cursor:pointer;transition:transform .15s,border-color .15s}.tgo:hover{transform:translateY(-2px);border-color:var(--accent)}.tgo:active{transform:scale(.98)}.btk{border:1px solid var(--border2);background:var(--surface);color:var(--dim);padding:5px 12px;border-radius:999px;cursor:pointer;font:600 11px var(--font);transition:all .15s}.btk:hover{color:var(--text);border-color:var(--accent)}
#v-gti.on{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;padding:16px 14px}.fshead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}.fshead h2{margin:0;border-bottom:none!important;flex:0 0 auto}.xbtn{border:var(--bw,1px) solid var(--border2);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:999px;cursor:pointer;font:700 11px var(--font)}.xbtn:hover{border-color:var(--accent)}.trow{display:flex;gap:3px;flex-wrap:nowrap;padding:8px 0 0}.tb{white-space:nowrap;border:1px solid transparent;background:transparent;color:var(--dim);padding:8px 9px;border-radius:8px;cursor:pointer;font:600 10.5px var(--font);transition:all .15s;flex:0 0 auto}.tb:hover{color:var(--text);border-color:var(--border2)}.tb:active{transform:scale(.97)}

/* ================= NAV WINDOWS — each nav button opens its own full-screen window ================= */
.view.win.on{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;padding:12px 14px 44px;animation:winIn .3s cubic-bezier(.2,.9,.3,1)}
@keyframes winIn{from{opacity:0;transform:translateY(22px) scale(.99)}to{opacity:1;transform:none}}
.view.win .fshead{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);padding:6px 0 10px}
.view.win .fshead h2{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view.win .fshead .xbtn{flex:0 0 auto;white-space:nowrap}
/* ================= ALL CARDS MENU — full screen ================= */
#moreOv{padding:0;align-items:stretch}
#moreOv .sheet{width:100%;max-width:700px;height:100dvh;border-radius:0;border:0;box-shadow:none;display:flex;flex-direction:column}
#moreOv .mlist{flex:1;max-height:none}
#moreOv.open .sheet{animation:winIn .3s cubic-bezier(.2,.9,.3,1)}
/* ================= INDICES RADAR button ================= */
.radarbtn{width:100%;display:flex;align-items:center;gap:13px;background:var(--bg2);border:1.5px solid var(--accent);border-radius:14px;padding:13px 15px;cursor:pointer;text-align:left;font-family:var(--font);margin:2px 0 12px;transition:transform .15s,border-color .15s,box-shadow .15s}
.radarbtn:hover{transform:translateY(-2px)}
.radarbtn:active{transform:scale(.98)}
.radarbtn .ic{width:38px;height:38px;flex:0 0 auto;border-radius:11px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);display:grid;place-items:center}
.radarbtn .t{min-width:0}
.radarbtn .t b{display:block;font:700 13px var(--font);letter-spacing:.14em;color:var(--accent)}
.radarbtn .t small{display:block;color:var(--dim);font-size:10.5px;margin-top:2px;letter-spacing:.02em}
.radarbtn .arw{margin-left:auto;color:var(--faint);font-size:16px}
/* ================= INDICES RADAR window ================= */
.idxcards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.ridx{background:var(--bg2);border:var(--bw,1px) solid var(--border);border-radius:12px;padding:12px 8px;text-align:center}
.ridx .lbl{font:500 9px var(--mono);letter-spacing:.12em;color:var(--dim)}
.ridx .val{font:600 17px var(--mono);font-variant-numeric:tabular-nums;margin:5px 0 3px}
.ridx .chg{font:600 11.5px var(--mono)}
.rbreadth{margin-top:16px;text-align:center}
.rbreadth .blab{font:700 13px var(--font);letter-spacing:.06em;color:var(--up)}
.rbar{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:8px 0 6px;background:color-mix(in srgb,var(--down) 18%,var(--surface))}
.rbar i{display:block;height:100%;background:var(--up)}
.rbar em{display:block;height:100%;flex:1;background:color-mix(in srgb,var(--down) 45%,transparent)}
.rcap{font:400 10.5px var(--mono);color:var(--faint);letter-spacing:.04em}
.rchips{display:flex;flex-wrap:wrap;gap:7px}
.rchip{border-radius:999px;padding:7px 12px;font:500 10.5px var(--mono);letter-spacing:.02em;white-space:nowrap}
.rchip.g{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up)}
.rchip.r{background:color-mix(in srgb,var(--down) 16%,transparent);color:var(--down)}
.rchip b{font-weight:600}
.rnote{margin-top:22px;font-style:italic;color:var(--faint);font-size:11.5px;line-height:1.65;text-align:center}
/* ================= SECTOR MAP window ================= */
.smradar{border:var(--bw,1px) solid var(--border);border-radius:14px;background:var(--bg2);padding:12px;display:flex;justify-content:center;margin:2px 0 12px}
.smpill{display:inline-flex;align-items:center;gap:12px;background:var(--surface2);border:var(--bw,1px) solid var(--border);border-radius:999px;padding:9px 18px}
.smpill .smic{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);display:grid;place-items:center;flex:0 0 auto}
.smpill b{display:block;font:700 12.5px var(--font);letter-spacing:.14em;color:var(--accent)}
.smpill small{display:block;color:var(--dim);font-size:10px;margin-top:1px;letter-spacing:.02em}
.fch2{font:500 10.5px var(--mono);border:var(--bw,1px) solid var(--border);border-radius:999px;padding:6px 12px;color:var(--dim);cursor:pointer;background:var(--surface);transition:all .15s;white-space:nowrap}
.fch2:hover{color:var(--text);border-color:var(--border2)}
.fch2.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border-color:var(--accent)}
.tmap{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:minmax(58px,auto);gap:4px;padding:12px}
.tcell{border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden;text-align:center;padding:4px}
.tcell b{font:600 11px var(--mono);letter-spacing:.03em}
.tcell span{font:500 10px var(--mono);opacity:.9}
.tcell.big b{font-size:13px}
.tcell.big span{font-size:11.5px}
.tcell.g1{background:color-mix(in srgb,var(--up) 10%,var(--surface))}
.tcell.g2{background:color-mix(in srgb,var(--up) 22%,var(--surface))}
.tcell.g3{background:color-mix(in srgb,var(--up) 38%,var(--surface))}
.tcell.r1{background:color-mix(in srgb,var(--down) 10%,var(--surface))}
.tcell.r2{background:color-mix(in srgb,var(--down) 22%,var(--surface))}
.tcell.r3{background:color-mix(in srgb,var(--down) 38%,var(--surface))}
/* ================= SCREENER / MF / DEEP FUND / CRYPTO / GLOBAL / EVENTS windows ================= */
.sel{border:var(--bw,1px) solid var(--border2);background:var(--surface);color:var(--dim);padding:10px 12px;border-radius:10px;font:500 12px var(--font);outline:none;min-width:0}
.filterpill{display:inline-flex;align-items:center;gap:6px;border:var(--bw,1px) solid var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:999px;padding:6px 13px;font:600 11px var(--mono);letter-spacing:.02em}
.mods{display:flex;flex-direction:column;gap:9px}
.mod{display:flex;align-items:center;gap:10px;background:var(--bg2);border:var(--bw,1px) solid var(--border);border-radius:12px;padding:9px 12px;cursor:pointer;transition:all .15s;width:100%;text-align:left;font-family:var(--font)}
.mod:hover{border-color:var(--accent);transform:translateY(-1px)}
.mod .mic{width:30px;height:30px;flex:0 0 auto;border-radius:9px;background:var(--surface2);display:grid;place-items:center;font-size:14px}
.mod b{display:block;font:700 10.5px var(--font);letter-spacing:.09em;color:var(--accent)}
.mod small{display:block;color:var(--dim);font-size:9px;margin-top:2px;letter-spacing:.02em}
.verdict{border-left:3px solid var(--up);background:color-mix(in srgb,var(--up) 8%,transparent);border-radius:8px;padding:10px 12px;font-size:12px;margin:10px 0 4px;line-height:1.6}
.fundrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:var(--bw,1px) solid var(--border)}
.fundrow:last-child{border:0}
.fundrow .fn b{display:block;font-size:12px}
.fundrow .fn small{color:var(--faint);font:400 9.5px var(--mono);display:block;margin-top:2px}
.fundrow .fr{font:600 12px var(--mono);white-space:nowrap;flex:0 0 auto}
.fg{position:relative;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--down),var(--accent),var(--up));margin:12px 0 5px}
.fg i{position:absolute;top:-3.5px;width:3px;height:16px;border-radius:2px;background:var(--text);left:74%}
.fgrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;font-size:12px}
.gbar{height:4px;border-radius:2px;background:var(--up);opacity:.5;margin:-2px 0 9px}
.closed-banner{background:color-mix(in srgb,var(--down) 10%,transparent);border:var(--bw,1px) solid color-mix(in srgb,var(--down) 35%,transparent);color:var(--down);border-radius:9px;padding:9px 12px;font:600 11.5px var(--mono);letter-spacing:.02em;margin:12px 14px}
.sess{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-bottom:var(--bw,1px) solid var(--border)}
.sess:last-child{border:0}
.sess .sl b{display:block;font-size:12px;letter-spacing:.04em}
.sess .sl small{color:var(--faint);font:400 9.5px var(--mono);display:block;margin-top:3px}
.sess .st{font:500 9.5px var(--mono);color:var(--faint);text-align:right;white-space:nowrap;flex:0 0 auto}
.sess .st .live{color:var(--up);font-weight:600}
/* ================= FUNDAMENTALS / NEWS extras + shared bits ================= */
.biasrow{display:flex;gap:8px;flex-wrap:wrap}
.bias{border:var(--bw,1px) solid var(--border);border-radius:999px;padding:6px 12px;font:500 10px var(--mono);color:var(--dim)}
.bias b{color:var(--text);font-weight:600}
.ttabs{display:flex;gap:4px;margin-top:10px}
.ttab{flex:0 0 auto;border:1px solid transparent;background:transparent;color:var(--dim);padding:7px 13px;border-radius:8px;font:600 10.5px var(--font);cursor:pointer;transition:all .15s}
.ttab:hover{color:var(--text);border-color:var(--border2)}
.ttab.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.bullrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:var(--bw,1px) solid var(--border)}
.bullrow:last-child{border:0}
.bullrow .bn{font:600 11.5px var(--mono);flex:0 0 auto}
.bullrow .bbar{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--up) 14%,transparent);overflow:hidden}
.bullrow .bbar i{display:block;height:100%;background:var(--up)}
.bullrow .bs{font:600 12px var(--mono);flex:0 0 auto}
.bullrow .bd{font:400 9.5px var(--mono);color:var(--faint);flex:0 0 auto}
.feat{display:flex;align-items:center;gap:12px;border-radius:12px;padding:11px 14px;border:var(--bw,1px) solid var(--border)}
.feat.gold{background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.feat.green{background:color-mix(in srgb,var(--up) 12%,var(--surface));border-color:color-mix(in srgb,var(--up) 45%,transparent)}
.feat .fic{width:32px;height:32px;border-radius:9px;background:var(--surface);border:var(--bw,1px) solid var(--border);display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.feat b{display:block;font:700 11px var(--font);letter-spacing:.09em}
.feat.gold b{color:var(--accent)}
.feat.green b{color:var(--up)}
.feat small{display:block;color:var(--dim);font-size:9.5px;margin-top:1px}
.newscard{background:var(--bg2);border:var(--bw,1px) solid var(--border);border-radius:12px;padding:12px 14px}
.newscard .nbadge{display:inline-block;font:500 9px var(--mono);letter-spacing:.1em;border:var(--bw,1px) solid var(--border);border-radius:5px;padding:2px 8px;color:var(--dim);margin-bottom:7px}
.newscard .nh{font-size:12.5px;line-height:1.5}
.winclose{display:flex;justify-content:center;margin:16px 0 4px}
/* company window — compact fonts */
#v-company .num{font-size:16px}
#v-company .kpi{padding:10px 12px}
#v-company .srow input{font-size:12px;padding:9px 12px}
#v-company .ni b{font-size:11.5px}

</style>
</head>

<header class="hdr" id="hdr">
  <div class="top">
    <div class="brand"><div class="mk">AS</div><div><b>ARTHASAAR</b></div></div>

      <span class="pill"><span class="dot"></span>NSE</span>

<main id="app"></main>

  <button class="db on" id="dHome" title="Home"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></button>
  <button class="db" id="dLearn" title="Learn — strategies · studies · notes"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></button>

  <button class="ds" id="dSearch"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>Search anything — stocks · MF · F&O…</span></button>
  <button class="db" id="dMore" title="Actions"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <button class="db" id="dPort" title="Portfolio"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg></button>
</div>

<div class="ov" id="moreOv"><div class="sheet"><div class="ovh"><span>ALL CARDS · MENU</span><button class="x" id="mx">✕ CLOSE</button></div>
<div class="mlist" id="menuList"></div>

<div class="al">

  <button class="mb"><span class="ic">⇩</span><span>Import CSV<small>broker statement</small></span></button>
  <button class="mb"><span class="ic">⟳</span><span>Refresh data<small>saare feeds dobara fetch</small></span></button>

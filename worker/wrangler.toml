# Cloudflare Worker config for the ArthaSaar live-data proxy.
#
# Deploy with:  cd worker && npx wrangler deploy
# Set a secret: npx wrangler secret put TOKEN
#
# The free plan allows 100,000 requests/day, which is far more than a personal
# terminal needs. No credit card is required.

name = "arthasaar-proxy"

# Pinned explicitly. An ACCOUNT-scoped API token cannot call /memberships, which is how
# wrangler normally discovers the account - without this it fails with
# "Authentication failed (status: 400) [code: 9106]" before it ever uploads.
# Not a secret: the account id appears in the Cloudflare dashboard URL.
account_id = "ce9a82b5557a832163c9528a55a08b20"
main = "worker.js"
compatibility_date = "2026-01-01"

# Keep it cheap and predictable: one small worker, no bindings needed.
workers_dev = true

[observability]
enabled = true
